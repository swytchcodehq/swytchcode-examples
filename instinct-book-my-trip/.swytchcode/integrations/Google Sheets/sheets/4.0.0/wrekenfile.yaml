  UpdateValuesResponse:
    - name: spreadsheetId
      TYPE: STRING
      REQUIRED: false
      comment: The spreadsheet the updates were applied to.
    - name: updatedCells
      TYPE: INT
      REQUIRED: false
      FORMAT: int32
      comment: The number of cells updated.
    - name: updatedColumns
      TYPE: INT
      REQUIRED: false
      FORMAT: int32
      comment: The number of columns where at least one cell in the column was updated.
    - name: updatedData
      TYPE: STRUCT(ValueRange)
      REQUIRED: false
      comment: The values of the cells after updates were applied. This is only included if the request's `includeValuesInResponse` field was `true`.
    - name: updatedRange
      TYPE: STRING
      REQUIRED: false
      comment: The range (in A1 notation) that updates were applied to.
    - name: updatedRows
      TYPE: INT
      REQUIRED: false
      FORMAT: int32
      comment: The number of rows where at least one cell in the row was updated.
  ValueRange:
    - name: majorDimension
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - DIMENSION_UNSPECIFIED
        - ROWS
        - COLUMNS
      comment: "The major dimension of the values. For output, if the spreadsheet data is: `A1=1,B1=2,A2=3,B2=4`, then requesting `range=A1:B2,majorDimension=ROWS` will return `[[1,2],[3,4]]`, whereas requesting `range=A1:B2,majorDimension=COLUMNS` will return `[[1,3],[2,4]]`. For input, with `range=A1:B2,majorDimension=ROWS` then `[[1,2],[3,4]]` will set `A1=1,B1=2,A2=3,B2=4`. With `range=A1:B2,majorDimension=COLUMNS` then `[[1,2],[3,4]]` will set `A1=1,B1=3,A2=2,B2=4`. When writing, if this field is not set, it defaults to ROWS."
    - name: range
      TYPE: STRING
      REQUIRED: false
      comment: The range the values cover, in [A1 notation](https://developers.google.com/workspace/sheets/api/guides/concepts#cell). For output, this range indicates the entire requested range, even though the values will exclude trailing rows and columns. When appending values, this field represents the range to search for a table, after which values will be appended.
    - name: values
      TYPE: "[]ANY"
      REQUIRED: false
      comment: "The data that was read or to be written. This is an array of arrays, the outer array representing all the data and each inner array representing a major dimension. Each item in the inner array corresponds with one cell. For output, empty trailing rows and columns will not be included. For input, supported value types are: bool, string, and double. Null values will be skipped. To set a cell to an empty value, set the string value to an empty string."
  WaterfallChartColumnStyle:
    - name: color
      TYPE: STRUCT(Color)
      REQUIRED: false
      DEPRECATED: true
      comment: "The color of the column. Deprecated: Use color_style."
    - name: colorStyle
      TYPE: STRUCT(ColorStyle)
      REQUIRED: false
      comment: The color of the column. If color is also set, this field takes precedence.
    - name: label
      TYPE: STRING
      REQUIRED: false
      comment: The label of the column's legend.
  WaterfallChartCustomSubtotal:
    - name: dataIsSubtotal
      TYPE: BOOL
      REQUIRED: false
      comment: True if the data point at subtotal_index is the subtotal. If false, the subtotal will be computed and appear after the data point.
    - name: label
      TYPE: STRING
      REQUIRED: false
      comment: A label for the subtotal column.
    - name: subtotalIndex
      TYPE: INT
      REQUIRED: false
      FORMAT: int32
      comment: The zero-based index of a data point within the series. If data_is_subtotal is true, the data point at this index is the subtotal. Otherwise, the subtotal appears after the data point with this index. A series can have multiple subtotals at arbitrary indices, but subtotals do not affect the indices of the data points. For example, if a series has three data points, their indices will always be 0, 1, and 2, regardless of how many subtotals exist on the series or what data points they are associated with.
  WaterfallChartDomain:
    - name: data
      TYPE: STRUCT(ChartData)
      REQUIRED: false
      comment: The data of the WaterfallChartDomain.
    - name: reversed
      TYPE: BOOL
      REQUIRED: false
      comment: True to reverse the order of the domain values (horizontal axis).
  WaterfallChartSeries:
    - name: customSubtotals
      TYPE: "[]STRUCT(WaterfallChartCustomSubtotal)"
      REQUIRED: false
      comment: Custom subtotal columns appearing in this series. The order in which subtotals are defined is not significant. Only one subtotal may be defined for each data point.
    - name: data
      TYPE: STRUCT(ChartData)
      REQUIRED: false
      comment: The data being visualized in this series.
    - name: dataLabel
      TYPE: STRUCT(DataLabel)
      REQUIRED: false
      comment: Information about the data labels for this series.
    - name: hideTrailingSubtotal
      TYPE: BOOL
      REQUIRED: false
      comment: True to hide the subtotal column from the end of the series. By default, a subtotal column will appear at the end of each series. Setting this field to true will hide that subtotal column for this series.
    - name: negativeColumnsStyle
      TYPE: STRUCT(WaterfallChartColumnStyle)
      REQUIRED: false
      comment: Styles for all columns in this series with negative values.
    - name: positiveColumnsStyle
      TYPE: STRUCT(WaterfallChartColumnStyle)
      REQUIRED: false
      comment: Styles for all columns in this series with positive values.
    - name: subtotalColumnsStyle
      TYPE: STRUCT(WaterfallChartColumnStyle)
      REQUIRED: false
      comment: Styles for all subtotal columns in this series.
  WaterfallChartSpec:
    - name: connectorLineStyle
      TYPE: STRUCT(LineStyle)
      REQUIRED: false
      comment: The line style for the connector lines.
    - name: domain
      TYPE: STRUCT(WaterfallChartDomain)
      REQUIRED: false
      comment: The domain data (horizontal axis) for the waterfall chart.
    - name: firstValueIsTotal
      TYPE: BOOL
      REQUIRED: false
      comment: True to interpret the first value as a total.
    - name: hideConnectorLines
      TYPE: BOOL
      REQUIRED: false
      comment: True to hide connector lines between columns.
    - name: series
      TYPE: "[]STRUCT(WaterfallChartSeries)"
      REQUIRED: false
      comment: The data this waterfall chart is visualizing.
    - name: stackedType
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - WATERFALL_STACKED_TYPE_UNSPECIFIED
        - STACKED
        - SEQUENTIAL
      comment: The stacked type.
    - name: totalDataLabel
      TYPE: STRUCT(DataLabel)
      REQUIRED: false
      comment: Controls whether to display additional data labels on stacked charts which sum the total value of all stacked values at each value along the domain axis. stacked_type must be STACKED and neither CUSTOM nor placement can be set on the total_data_label.

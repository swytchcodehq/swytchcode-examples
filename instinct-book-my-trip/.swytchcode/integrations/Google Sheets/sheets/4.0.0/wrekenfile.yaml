VERSION: 2.0.2
DEFAULTS:
  bearer_token: BEARER <ACCESS_TOKEN>
  w_base_url: https://sheets.googleapis.com
METHODS:
  google_sheets.spreadsheet.create:
    SUMMARY: Creates a spreadsheet, returning the newly created spreadsheet.
    DESC: Creates a spreadsheet, returning the newly created spreadsheet.
    HTTP:
      METHOD: POST
      ENDPOINT: /v4/spreadsheets
      HEADERS:
        Content-Type: application/json
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
      BODY:
        TYPE: STRUCT(Spreadsheet)
    SECURITY:
      - Oauth2:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/drive
        Oauth2c:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/drive
      - Oauth2:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/drive.file
        Oauth2c:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/drive.file
      - Oauth2:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/spreadsheets
        Oauth2c:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/spreadsheets
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - body:
          TYPE: STRUCT(Spreadsheet)
          REQUIRED: false
          LOCATION: body
    RETURNS:
      - RETURNTYPE: STRUCT(Spreadsheet)
        RETURNVAR: google_sheets_spreadsheet_create
        STATUS: 200
    CANONICAL_ID: google_sheets.spreadsheet.create
  google_sheets.spreadsheet.get:
    SUMMARY: Returns the spreadsheet at the given ID
    DESC: "Returns the spreadsheet at the given ID. The caller must specify the spreadsheet ID. By default, data within grids is not returned. You can include grid data in one of 2 ways: * Specify a [field mask](https://developers.google.com/workspace/sheets/api/guides/field-masks) listing your desired fields using the `fields` URL parameter in HTTP * Set the includeGridData URL parameter to true. If a field mask is set, the `includeGridData` parameter is ignored For large spreadsheets, as a best practice, retrieve only the specific spreadsheet fields that you want. To retrieve only subsets of spreadsheet data, use the ranges URL parameter. Ranges are specified using [A1 notation](https://developers.google.com/workspace/sheets/api/guides/concepts#cell). You can define a single cell (for example, `A1`) or multiple cells (for example, `A1:D5`). You can also get cells from other sheets within the same spreadsheet (for example, `Sheet2!A1:C4`) or retrieve multiple ranges at once (for example, `?ranges=A1:D5&ranges=Sheet2!A1:C4`). Limiting the range returns only the portions of the spreadsheet that intersect the requested ranges."
    HTTP:
      METHOD: GET
      ENDPOINT: /v4/spreadsheets/{spreadsheetId}
      HEADERS:
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    SECURITY:
      - Oauth2:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/drive
        Oauth2c:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/drive
      - Oauth2:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/drive.file
        Oauth2c:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/drive.file
      - Oauth2:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/drive.readonly
        Oauth2c:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/drive.readonly
      - Oauth2:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/spreadsheets
        Oauth2c:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/spreadsheets
      - Oauth2:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/spreadsheets.readonly
        Oauth2c:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/spreadsheets.readonly
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - spreadsheetId:
          TYPE: STRING
          REQUIRED: true
          LOCATION: path
      - excludeTablesInBandedRanges:
          TYPE: BOOL
          REQUIRED: false
          LOCATION: query
      - includeGridData:
          TYPE: BOOL
          REQUIRED: false
          LOCATION: query
      - ranges:
          TYPE: "[]ANY"
          REQUIRED: false
          LOCATION: query
          STYLE: multi
    RETURNS:
      - RETURNTYPE: STRUCT(Spreadsheet)
        RETURNVAR: google_sheets_spreadsheet_get
        STATUS: 200
    CANONICAL_ID: google_sheets.spreadsheet.get
  google_sheets.developermetadata.get:
    SUMMARY: Returns the developer metadata with the specified ID
    DESC: Returns the developer metadata with the specified ID. The caller must specify the spreadsheet ID and the developer metadata's unique metadataId. For more information, see [Read, write, and search metadata](https://developers.google.com/workspace/sheets/api/guides/metadata).
    HTTP:
      METHOD: GET
      ENDPOINT: /v4/spreadsheets/{spreadsheetId}/developerMetadata/{metadataId}
      HEADERS:
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    SECURITY:
      - Oauth2:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/drive
        Oauth2c:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/drive
      - Oauth2:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/drive.file
        Oauth2c:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/drive.file
      - Oauth2:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/spreadsheets
        Oauth2c:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/spreadsheets
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - spreadsheetId:
          TYPE: STRING
          REQUIRED: true
          LOCATION: path
      - metadataId:
          TYPE: INT
          REQUIRED: true
          LOCATION: path
    RETURNS:
      - RETURNTYPE: STRUCT(DeveloperMetadata)
        RETURNVAR: google_sheets_developermetadata_get
        STATUS: 200
    CANONICAL_ID: google_sheets.developermetadata.get
  google_sheets.developermetadatasearch.create:
    SUMMARY: Returns all developer metadata matching the specified DataFilter
    DESC: Returns all developer metadata matching the specified DataFilter. For more information, see [Read, write, and search metadata](https://developers.google.com/workspace/sheets/api/guides/metadata). If the provided DataFilter represents a DeveloperMetadataLookup object, this will return all DeveloperMetadata entries selected by it. If the DataFilter represents a location in a spreadsheet, this will return all developer metadata associated with locations intersecting that region.
    HTTP:
      METHOD: POST
      ENDPOINT: /v4/spreadsheets/{spreadsheetId}/developerMetadata:search
      HEADERS:
        Content-Type: application/json
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
      BODY:
        TYPE: STRUCT(SearchDeveloperMetadataRequest)
    SECURITY:
      - Oauth2:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/drive
        Oauth2c:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/drive
      - Oauth2:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/drive.file
        Oauth2c:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/drive.file
      - Oauth2:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/spreadsheets
        Oauth2c:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/spreadsheets
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - spreadsheetId:
          TYPE: STRING
          REQUIRED: true
          LOCATION: path
      - body:
          TYPE: STRUCT(SearchDeveloperMetadataRequest)
          REQUIRED: false
          LOCATION: body
    RETURNS:
      - RETURNTYPE: STRUCT(SearchDeveloperMetadataResponse)
        RETURNVAR: google_sheets_developermetadatasearch_create
        STATUS: 200
    CANONICAL_ID: google_sheets.developermetadatasearch.create
  google_sheets.sheet.sheetIdcopyTo.create:
    SUMMARY: Copies a single sheet from a spreadsheet to another spreadsheet
    DESC: Copies a single sheet from a spreadsheet to another spreadsheet. Returns the properties of the newly created sheet.
    HTTP:
      METHOD: POST
      ENDPOINT: /v4/spreadsheets/{spreadsheetId}/sheets/{sheetId}:copyTo
      HEADERS:
        Content-Type: application/json
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
      BODY:
        TYPE: STRUCT(CopySheetToAnotherSpreadsheetRequest)
    SECURITY:
      - Oauth2:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/drive
        Oauth2c:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/drive
      - Oauth2:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/drive.file
        Oauth2c:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/drive.file
      - Oauth2:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/spreadsheets
        Oauth2c:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/spreadsheets
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - spreadsheetId:
          TYPE: STRING
          REQUIRED: true
          LOCATION: path
      - sheetId:
          TYPE: INT
          REQUIRED: true
          LOCATION: path
      - body:
          TYPE: STRUCT(CopySheetToAnotherSpreadsheetRequest)
          REQUIRED: false
          LOCATION: body
    RETURNS:
      - RETURNTYPE: STRUCT(SheetProperties)
        RETURNVAR: google_sheets_sheet_sheetIdcopyTo_create
        STATUS: 200
    CANONICAL_ID: google_sheets.sheet.sheetIdcopyTo.create
  google_sheets.value.get:
    SUMMARY: Returns a range of values from a spreadsheet
    DESC: Returns a range of values from a spreadsheet. The caller must specify the spreadsheet ID and a range.
    HTTP:
      METHOD: GET
      ENDPOINT: /v4/spreadsheets/{spreadsheetId}/values/{range}
      HEADERS:
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    SECURITY:
      - Oauth2:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/drive
        Oauth2c:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/drive
      - Oauth2:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/drive.file
        Oauth2c:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/drive.file
      - Oauth2:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/drive.readonly
        Oauth2c:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/drive.readonly
      - Oauth2:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/spreadsheets
        Oauth2c:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/spreadsheets
      - Oauth2:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/spreadsheets.readonly
        Oauth2c:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/spreadsheets.readonly
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - spreadsheetId:
          TYPE: STRING
          REQUIRED: true
          LOCATION: path
      - range:
          TYPE: STRING
          REQUIRED: true
          LOCATION: path
      - dateTimeRenderOption:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
          ENUM:
            - SERIAL_NUMBER
            - FORMATTED_STRING
      - majorDimension:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
          ENUM:
            - DIMENSION_UNSPECIFIED
            - ROWS
            - COLUMNS
      - valueRenderOption:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
          ENUM:
            - FORMATTED_VALUE
            - UNFORMATTED_VALUE
            - FORMULA
    RETURNS:
      - RETURNTYPE: STRUCT(ValueRange)
        RETURNVAR: google_sheets_value_get
        STATUS: 200
    CANONICAL_ID: google_sheets.value.get
  google_sheets.value.update:
    SUMMARY: Sets values in a range of a spreadsheet
    DESC: Sets values in a range of a spreadsheet. The caller must specify the spreadsheet ID, range, and a valueInputOption.
    HTTP:
      METHOD: PUT
      ENDPOINT: /v4/spreadsheets/{spreadsheetId}/values/{range}
      HEADERS:
        Content-Type: application/json

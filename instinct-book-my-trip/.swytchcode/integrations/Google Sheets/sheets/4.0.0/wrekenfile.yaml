      - Oauth2:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/drive.file
        Oauth2c:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/drive.file
      - Oauth2:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/spreadsheets
        Oauth2c:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/spreadsheets
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - spreadsheetId:
          TYPE: STRING
          REQUIRED: true
          LOCATION: path
      - range:
          TYPE: STRING
          REQUIRED: true
          LOCATION: path
      - includeValuesInResponse:
          TYPE: BOOL
          REQUIRED: false
          LOCATION: query
      - responseDateTimeRenderOption:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
          ENUM:
            - SERIAL_NUMBER
            - FORMATTED_STRING
      - responseValueRenderOption:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
          ENUM:
            - FORMATTED_VALUE
            - UNFORMATTED_VALUE
            - FORMULA
      - valueInputOption:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
          ENUM:
            - INPUT_VALUE_OPTION_UNSPECIFIED
            - RAW
            - USER_ENTERED
      - body:
          TYPE: STRUCT(ValueRange)
          REQUIRED: false
          LOCATION: body
    RETURNS:
      - RETURNTYPE: STRUCT(UpdateValuesResponse)
        RETURNVAR: google_sheets_value_update
        STATUS: 200
    CANONICAL_ID: google_sheets.value.update
  google_sheets.value.rangeappend.create:
    SUMMARY: Appends values to a spreadsheet
    DESC: Appends values to a spreadsheet. The input range is used to search for existing data and find a "table" within that range. Values will be appended to the next row of the table, starting with the first column of the table. See the [guide](https://developers.google.com/workspace/sheets/api/guides/values#appending_values) and [sample code](https://developers.google.com/workspace/sheets/api/samples/writing#append_values) for specific details of how tables are detected and data is appended. The caller must specify the spreadsheet ID, range, and a valueInputOption. The `valueInputOption` only controls how the input data will be added to the sheet (column-wise or row-wise), it does not influence what cell the data starts being written to.
    HTTP:
      METHOD: POST
      ENDPOINT: /v4/spreadsheets/{spreadsheetId}/values/{range}:append
      HEADERS:
        Content-Type: application/json
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
      BODY:
        TYPE: STRUCT(ValueRange)
    SECURITY:
      - Oauth2:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/drive
        Oauth2c:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/drive
      - Oauth2:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/drive.file
        Oauth2c:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/drive.file
      - Oauth2:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/spreadsheets
        Oauth2c:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/spreadsheets
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - spreadsheetId:
          TYPE: STRING
          REQUIRED: true
          LOCATION: path
      - range:
          TYPE: STRING
          REQUIRED: true
          LOCATION: path
      - includeValuesInResponse:
          TYPE: BOOL
          REQUIRED: false
          LOCATION: query
      - insertDataOption:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
          ENUM:
            - OVERWRITE
            - INSERT_ROWS
      - responseDateTimeRenderOption:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
          ENUM:
            - SERIAL_NUMBER
            - FORMATTED_STRING
      - responseValueRenderOption:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
          ENUM:
            - FORMATTED_VALUE
            - UNFORMATTED_VALUE
            - FORMULA
      - valueInputOption:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
          ENUM:
            - INPUT_VALUE_OPTION_UNSPECIFIED
            - RAW
            - USER_ENTERED
      - body:
          TYPE: STRUCT(ValueRange)
          REQUIRED: false
          LOCATION: body
    RETURNS:
      - RETURNTYPE: STRUCT(AppendValuesResponse)
        RETURNVAR: google_sheets_value_rangeappend_create
        STATUS: 200
    CANONICAL_ID: google_sheets.value.rangeappend.create

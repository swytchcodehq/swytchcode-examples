    - name: properties
      TYPE: STRUCT(DimensionProperties)
      REQUIRED: false
      comment: Properties to update.
    - name: range
      TYPE: STRUCT(DimensionRange)
      REQUIRED: false
      comment: The rows or columns to update.
  UpdateEmbeddedObjectBorderRequest:
    - name: border
      TYPE: STRUCT(EmbeddedObjectBorder)
      REQUIRED: false
      comment: The border that applies to the embedded object.
    - name: fields
      TYPE: STRING
      REQUIRED: false
      FORMAT: google-fieldmask
      comment: The fields that should be updated. At least one field must be specified. The root `border` is implied and should not be specified. A single `"*"` can be used as short-hand for listing every field.

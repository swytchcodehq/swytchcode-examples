  google_sheets.spreadsheetidbatchupdate.create:
    SUMMARY: Applies one or more updates to the spreadsheet
    DESC: Applies one or more updates to the spreadsheet. Each request is validated before being applied. If any request is not valid then the entire request will fail and nothing will be applied. Some requests have replies to give you some information about how they are applied. The replies will mirror the requests. For example, if you applied 4 updates and the 3rd one had a reply, then the response will have 2 empty replies, the actual reply, and another empty reply, in that order. Due to the collaborative nature of spreadsheets, it is not guaranteed that the spreadsheet will reflect exactly your changes after this completes, however it is guaranteed that the updates in the request will be applied together atomically. Your changes may be altered with respect to collaborator changes. If there are no collaborators, the spreadsheet should reflect your changes.
    HTTP:
      METHOD: POST
      ENDPOINT: /v4/spreadsheets/{spreadsheetId}:batchUpdate
      HEADERS:
        Content-Type: application/json
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
      BODY:
        TYPE: STRUCT(BatchUpdateSpreadsheetRequest)
    SECURITY:
      - Oauth2:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/drive
        Oauth2c:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/drive
      - Oauth2:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/drive.file
        Oauth2c:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/drive.file
      - Oauth2:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/spreadsheets
        Oauth2c:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/spreadsheets
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - spreadsheetId:
          TYPE: STRING
          REQUIRED: true
          LOCATION: path
      - body:
          TYPE: STRUCT(BatchUpdateSpreadsheetRequest)
          REQUIRED: false
          LOCATION: body
    RETURNS:
      - RETURNTYPE: STRUCT(BatchUpdateSpreadsheetResponse)
        RETURNVAR: google_sheets_spreadsheetidbatchupdate_create
        STATUS: 200
    CANONICAL_ID: google_sheets.spreadsheetidbatchupdate.create
  google_sheets.spreadsheetidgetbydatafilter.create:
    SUMMARY: Returns the spreadsheet at the given ID
    DESC: "Returns the spreadsheet at the given ID. The caller must specify the spreadsheet ID. For more information, see [Read, write, and search metadata](https://developers.google.com/workspace/sheets/api/guides/metadata). This method differs from GetSpreadsheet in that it allows selecting which subsets of spreadsheet data to return by specifying a dataFilters parameter. Multiple DataFilters can be specified. Specifying one or more data filters returns the portions of the spreadsheet that intersect ranges matched by any of the filters. By default, data within grids is not returned. You can include grid data in one of two ways: * Specify a [field mask](https://developers.google.com/workspace/sheets/api/guides/field-masks) listing your desired fields using the `fields` URL parameter in HTTP. * Set the includeGridData parameter to `true`. If a field mask is set, the `includeGridData` parameter is ignored. For large spreadsheets, as a best practice, retrieve only the specific spreadsheet fields that you want."
    HTTP:
      METHOD: POST
      ENDPOINT: /v4/spreadsheets/{spreadsheetId}:getByDataFilter
      HEADERS:
        Content-Type: application/json
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
      BODY:
        TYPE: STRUCT(GetSpreadsheetByDataFilterRequest)
    SECURITY:
      - Oauth2:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/drive
        Oauth2c:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/drive
      - Oauth2:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/drive.file
        Oauth2c:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/drive.file
      - Oauth2:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/spreadsheets
        Oauth2c:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/spreadsheets
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - spreadsheetId:
          TYPE: STRING
          REQUIRED: true
          LOCATION: path
      - body:
          TYPE: STRUCT(GetSpreadsheetByDataFilterRequest)
          REQUIRED: false
          LOCATION: body
    RETURNS:
      - RETURNTYPE: STRUCT(Spreadsheet)
        RETURNVAR: google_sheets_spreadsheetidgetbydatafilter_create
        STATUS: 200
    CANONICAL_ID: google_sheets.spreadsheetidgetbydatafilter.create
STRUCTS:
  AddBandingRequest:
    - name: bandedRange
      TYPE: STRUCT(BandedRange)
      REQUIRED: false
      comment: The banded range to add. The bandedRangeId field is optional; if one is not set, an id will be randomly generated. (It is an error to specify the ID of a range that already exists.)
  AddBandingResponse:
    - name: bandedRange
      TYPE: STRUCT(BandedRange)
      REQUIRED: false
      comment: The banded range that was added.
  AddChartRequest:
    - name: chart
      TYPE: STRUCT(EmbeddedChart)
      REQUIRED: false
      comment: The chart that should be added to the spreadsheet, including the position where it should be placed. The chartId field is optional; if one is not set, an id will be randomly generated. (It is an error to specify the ID of an embedded object that already exists.)
  AddChartResponse:
    - name: chart
      TYPE: STRUCT(EmbeddedChart)
      REQUIRED: false
      comment: The newly added chart.
  AddConditionalFormatRuleRequest:
    - name: index
      TYPE: INT
      REQUIRED: false
      FORMAT: int32
      comment: The zero-based index where the rule should be inserted.
    - name: rule
      TYPE: STRUCT(ConditionalFormatRule)
      REQUIRED: false
      comment: The rule to add.
  AddDataSourceRequest:
    - name: dataSource
      TYPE: STRUCT(DataSource)
      REQUIRED: false
      comment: The data source to add.
  AddDataSourceResponse:
    - name: dataExecutionStatus
      TYPE: STRUCT(DataExecutionStatus)
      REQUIRED: false
      comment: The data execution status.
    - name: dataSource
      TYPE: STRUCT(DataSource)
      REQUIRED: false
      comment: The data source that was created.
  AddDimensionGroupRequest:
    - name: range
      TYPE: STRUCT(DimensionRange)
      REQUIRED: false
      comment: The range over which to create a group.
  AddDimensionGroupResponse:
    - name: dimensionGroups
      TYPE: "[]STRUCT(DimensionGroup)"
      REQUIRED: false
      comment: All groups of a dimension after adding a group to that dimension.
  AddFilterViewRequest:
    - name: filter
      TYPE: STRUCT(FilterView)
      REQUIRED: false
      comment: The filter to add. The filterViewId field is optional. If one is not set, an ID will be randomly generated. (It is an error to specify the ID of a filter that already exists.)
  AddFilterViewResponse:
    - name: filter
      TYPE: STRUCT(FilterView)
      REQUIRED: false
      comment: The newly added filter view.
  AddNamedRangeRequest:
    - name: namedRange
      TYPE: STRUCT(NamedRange)
      REQUIRED: false
      comment: The named range to add. The namedRangeId field is optional; if one is not set, an id will be randomly generated. (It is an error to specify the ID of a range that already exists.)
  AddNamedRangeResponse:
    - name: namedRange
      TYPE: STRUCT(NamedRange)
      REQUIRED: false
      comment: The named range to add.
  AddProtectedRangeRequest:
    - name: protectedRange
      TYPE: STRUCT(ProtectedRange)
      REQUIRED: false
      comment: The protected range to be added. The protectedRangeId field is optional; if one is not set, an id will be randomly generated. (It is an error to specify the ID of a range that already exists.)
  AddProtectedRangeResponse:
    - name: protectedRange
      TYPE: STRUCT(ProtectedRange)
      REQUIRED: false
      comment: The newly added protected range.
  AddSheetRequest:
    - name: properties
      TYPE: STRUCT(SheetProperties)
      REQUIRED: false
      comment: The properties the new sheet should have. All properties are optional. The sheetId field is optional; if one is not set, an id will be randomly generated. (It is an error to specify the ID of a sheet that already exists.)
  AddSheetResponse:
    - name: properties
      TYPE: STRUCT(SheetProperties)
      REQUIRED: false
      comment: The properties of the newly added sheet.
  AddSlicerRequest:
    - name: slicer
      TYPE: STRUCT(Slicer)
      REQUIRED: false
      comment: The slicer that should be added to the spreadsheet, including the position where it should be placed. The slicerId field is optional; if one is not set, an id will be randomly generated. (It is an error to specify the ID of a slicer that already exists.)
  AddSlicerResponse:
    - name: slicer
      TYPE: STRUCT(Slicer)
      REQUIRED: false
      comment: The newly added slicer.
  AddTableRequest:
    - name: table
      TYPE: STRUCT(Table)
      REQUIRED: false
      comment: Required. The table to add.
  AddTableResponse:
    - name: table
      TYPE: STRUCT(Table)
      REQUIRED: false
      READ_ONLY: true
      comment: Output only. The table that was added.
  AppendCellsRequest:
    - name: fields
      TYPE: STRING
      REQUIRED: false
      FORMAT: google-fieldmask
      comment: The fields of CellData that should be updated. At least one field must be specified. The root is the CellData; 'row.values.' should not be specified. A single `"*"` can be used as short-hand for listing every field.
    - name: rows
      TYPE: "[]STRUCT(RowData)"
      REQUIRED: false
      comment: The data to append.
    - name: sheetId
      TYPE: INT
      REQUIRED: false
      FORMAT: int32
      comment: The sheet ID to append the data to.
    - name: tableId
      TYPE: STRING
      REQUIRED: false
      comment: The ID of the table to append data to. The data will be only appended to the table body. This field also takes precedence over the `sheet_id` field.
  AppendDimensionRequest:
    - name: dimension
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - DIMENSION_UNSPECIFIED
        - ROWS
        - COLUMNS
      comment: Whether rows or columns should be appended.
    - name: length
      TYPE: INT
      REQUIRED: false
      FORMAT: int32
      comment: The number of rows or columns to append.
    - name: sheetId
      TYPE: INT
      REQUIRED: false
      FORMAT: int32
      comment: The sheet to append rows or columns to.
  AppendValuesResponse:
    - name: spreadsheetId
      TYPE: STRING
      REQUIRED: false
      comment: The spreadsheet the updates were applied to.
    - name: tableRange
      TYPE: STRING
      REQUIRED: false
      comment: The range (in A1 notation) of the table that values are being appended to (before the values were appended). Empty if no table was found.
    - name: updates
      TYPE: STRUCT(UpdateValuesResponse)
      REQUIRED: false
      comment: Information about the updates that were applied.
  AutoFillRequest:
    - name: range
      TYPE: STRUCT(GridRange)
      REQUIRED: false
      comment: The range to autofill. This will examine the range and detect the location that has data and automatically fill that data in to the rest of the range.
    - name: sourceAndDestination
      TYPE: STRUCT(SourceAndDestination)
      REQUIRED: false
      comment: The source and destination areas to autofill. This explicitly lists the source of the autofill and where to extend that data.
    - name: useAlternateSeries
      TYPE: BOOL
      REQUIRED: false
      comment: True if we should generate data with the "alternate" series. This differs based on the type and amount of source data.
  AutoResizeDimensionsRequest:
    - name: dataSourceSheetDimensions
      TYPE: STRUCT(DataSourceSheetDimensionRange)
      REQUIRED: false
      comment: The dimensions on a data source sheet to automatically resize.
    - name: dimensions
      TYPE: STRUCT(DimensionRange)
      REQUIRED: false
      comment: The dimensions to automatically resize.
  BandedRange:
    - name: bandedRangeId
      TYPE: INT
      REQUIRED: false
      FORMAT: int32
      comment: The ID of the banded range. If unset, refer to banded_range_reference.
    - name: bandedRangeReference
      TYPE: STRING
      REQUIRED: false
      READ_ONLY: true
      comment: Output only. The reference of the banded range, used to identify the ID that is not supported by the banded_range_id.
    - name: columnProperties
      TYPE: STRUCT(BandingProperties)
      REQUIRED: false
      comment: Properties for column bands. These properties are applied on a column- by-column basis throughout all the columns in the range. At least one of row_properties or column_properties must be specified.
    - name: range
      TYPE: STRUCT(GridRange)
      REQUIRED: false
      comment: The range over which these properties are applied.
    - name: rowProperties
      TYPE: STRUCT(BandingProperties)
      REQUIRED: false
      comment: Properties for row bands. These properties are applied on a row-by-row basis throughout all the rows in the range. At least one of row_properties or column_properties must be specified.
  BandingProperties:
    - name: firstBandColor
      TYPE: STRUCT(Color)
      REQUIRED: false
      DEPRECATED: true
      comment: "The first color that is alternating. (Required) Deprecated: Use first_band_color_style."
    - name: firstBandColorStyle
      TYPE: STRUCT(ColorStyle)
      REQUIRED: false
      comment: The first color that is alternating. (Required) If first_band_color is also set, this field takes precedence.
    - name: footerColor
      TYPE: STRUCT(Color)
      REQUIRED: false
      DEPRECATED: true
      comment: "The color of the last row or column. If this field is not set, the last row or column is filled with either first_band_color or second_band_color, depending on the color of the previous row or column. Deprecated: Use footer_color_style."
    - name: footerColorStyle
      TYPE: STRUCT(ColorStyle)
      REQUIRED: false
      comment: The color of the last row or column. If this field is not set, the last row or column is filled with either first_band_color or second_band_color, depending on the color of the previous row or column. If footer_color is also set, this field takes precedence.
    - name: headerColor
      TYPE: STRUCT(Color)
      REQUIRED: false
      DEPRECATED: true
      comment: "The color of the first row or column. If this field is set, the first row or column is filled with this color and the colors alternate between first_band_color and second_band_color starting from the second row or column. Otherwise, the first row or column is filled with first_band_color and the colors proceed to alternate as they normally would. Deprecated: Use header_color_style."
    - name: headerColorStyle
      TYPE: STRUCT(ColorStyle)
      REQUIRED: false
      comment: The color of the first row or column. If this field is set, the first row or column is filled with this color and the colors alternate between first_band_color and second_band_color starting from the second row or column. Otherwise, the first row or column is filled with first_band_color and the colors proceed to alternate as they normally would. If header_color is also set, this field takes precedence.
    - name: secondBandColor
      TYPE: STRUCT(Color)
      REQUIRED: false
      DEPRECATED: true
      comment: "The second color that is alternating. (Required) Deprecated: Use second_band_color_style."
    - name: secondBandColorStyle
      TYPE: STRUCT(ColorStyle)
      REQUIRED: false
      comment: The second color that is alternating. (Required) If second_band_color is also set, this field takes precedence.
  BaselineValueFormat:
    - name: comparisonType
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - COMPARISON_TYPE_UNDEFINED
        - ABSOLUTE_DIFFERENCE
        - PERCENTAGE_DIFFERENCE
      comment: The comparison type of key value with baseline value.
    - name: description
      TYPE: STRING
      REQUIRED: false
      comment: Description which is appended after the baseline value. This field is optional.
    - name: negativeColor
      TYPE: STRUCT(Color)
      REQUIRED: false
      DEPRECATED: true
      comment: "Color to be used, in case baseline value represents a negative change for key value. This field is optional. Deprecated: Use negative_color_style."
    - name: negativeColorStyle
      TYPE: STRUCT(ColorStyle)
      REQUIRED: false
      comment: Color to be used, in case baseline value represents a negative change for key value. This field is optional. If negative_color is also set, this field takes precedence.
    - name: position
      TYPE: STRUCT(TextPosition)
      REQUIRED: false
      comment: Specifies the horizontal text positioning of baseline value. This field is optional. If not specified, default positioning is used.
    - name: positiveColor
      TYPE: STRUCT(Color)
      REQUIRED: false
      DEPRECATED: true
      comment: "Color to be used, in case baseline value represents a positive change for key value. This field is optional. Deprecated: Use positive_color_style."
    - name: positiveColorStyle
      TYPE: STRUCT(ColorStyle)
      REQUIRED: false
      comment: Color to be used, in case baseline value represents a positive change for key value. This field is optional. If positive_color is also set, this field takes precedence.
    - name: textFormat
      TYPE: STRUCT(TextFormat)
      REQUIRED: false
      comment: Text formatting options for baseline value. The link field is not supported.
  BasicChartAxis:
    - name: format
      TYPE: STRUCT(TextFormat)
      REQUIRED: false
      comment: The format of the title. Only valid if the axis is not associated with the domain. The link field is not supported.
    - name: position
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - BASIC_CHART_AXIS_POSITION_UNSPECIFIED
        - BOTTOM_AXIS
        - LEFT_AXIS
        - RIGHT_AXIS
      comment: The position of this axis.
    - name: title
      TYPE: STRING
      REQUIRED: false
      comment: The title of this axis. If set, this overrides any title inferred from headers of the data.
    - name: titleTextPosition
      TYPE: STRUCT(TextPosition)
      REQUIRED: false
      comment: The axis title text position.
    - name: viewWindowOptions
      TYPE: STRUCT(ChartAxisViewWindowOptions)
      REQUIRED: false
      comment: The view window options for this axis.
  BasicChartDomain:
    - name: domain
      TYPE: STRUCT(ChartData)
      REQUIRED: false
      comment: The data of the domain. For example, if charting stock prices over time, this is the data representing the dates.
    - name: reversed
      TYPE: BOOL
      REQUIRED: false
      comment: True to reverse the order of the domain values (horizontal axis).
  BasicChartSeries:
    - name: color
      TYPE: STRUCT(Color)
      REQUIRED: false
      DEPRECATED: true
      comment: "The color for elements (such as bars, lines, and points) associated with this series. If empty, a default color is used. Deprecated: Use color_style."
    - name: colorStyle
      TYPE: STRUCT(ColorStyle)
      REQUIRED: false
      comment: The color for elements (such as bars, lines, and points) associated with this series. If empty, a default color is used. If color is also set, this field takes precedence.
    - name: dataLabel
      TYPE: STRUCT(DataLabel)
      REQUIRED: false
      comment: Information about the data labels for this series.
    - name: lineStyle
      TYPE: STRUCT(LineStyle)
      REQUIRED: false
      comment: The line style of this series. Valid only if the chartType is AREA, LINE, or SCATTER. COMBO charts are also supported if the series chart type is AREA or LINE.
    - name: pointStyle
      TYPE: STRUCT(PointStyle)
      REQUIRED: false
      comment: The style for points associated with this series. Valid only if the chartType is AREA, LINE, or SCATTER. COMBO charts are also supported if the series chart type is AREA, LINE, or SCATTER. If empty, a default point style is used.
    - name: series
      TYPE: STRUCT(ChartData)
      REQUIRED: false
      comment: The data being visualized in this chart series.
    - name: styleOverrides
      TYPE: "[]STRUCT(BasicSeriesDataPointStyleOverride)"
      REQUIRED: false
      comment: Style override settings for series data points.
    - name: targetAxis
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - BASIC_CHART_AXIS_POSITION_UNSPECIFIED
        - BOTTOM_AXIS
        - LEFT_AXIS
        - RIGHT_AXIS
      comment: The minor axis that will specify the range of values for this series. For example, if charting stocks over time, the "Volume" series may want to be pinned to the right with the prices pinned to the left, because the scale of trading volume is different than the scale of prices. It is an error to specify an axis that isn't a valid minor axis for the chart's type.
    - name: type
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - BASIC_CHART_TYPE_UNSPECIFIED
        - BAR
        - LINE
        - AREA
        - COLUMN
        - SCATTER
        - COMBO
        - STEPPED_AREA
      comment: The type of this series. Valid only if the chartType is COMBO. Different types will change the way the series is visualized. Only LINE, AREA, and COLUMN are supported.
  BasicChartSpec:
    - name: axis
      TYPE: "[]STRUCT(BasicChartAxis)"
      REQUIRED: false
      comment: The axis on the chart.
    - name: chartType
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - BASIC_CHART_TYPE_UNSPECIFIED
        - BAR
        - LINE
        - AREA
        - COLUMN
        - SCATTER
        - COMBO
        - STEPPED_AREA
      comment: The type of the chart.
    - name: compareMode
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - BASIC_CHART_COMPARE_MODE_UNSPECIFIED
        - DATUM
        - CATEGORY
      comment: The behavior of tooltips and data highlighting when hovering on data and chart area.
    - name: domains
      TYPE: "[]STRUCT(BasicChartDomain)"
      REQUIRED: false
      comment: The domain of data this is charting. Only a single domain is supported.
    - name: headerCount
      TYPE: INT
      REQUIRED: false
      FORMAT: int32
      comment: The number of rows or columns in the data that are "headers". If not set, Google Sheets will guess how many rows are headers based on the data. (Note that BasicChartAxis.title may override the axis title inferred from the header values.)
    - name: interpolateNulls
      TYPE: BOOL
      REQUIRED: false
      comment: If some values in a series are missing, gaps may appear in the chart (e.g, segments of lines in a line chart will be missing). To eliminate these gaps set this to true. Applies to Line, Area, and Combo charts.
    - name: legendPosition
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - BASIC_CHART_LEGEND_POSITION_UNSPECIFIED
        - BOTTOM_LEGEND
        - LEFT_LEGEND
        - RIGHT_LEGEND
        - TOP_LEGEND
        - NO_LEGEND
      comment: The position of the chart legend.
    - name: lineSmoothing
      TYPE: BOOL
      REQUIRED: false
      comment: Gets whether all lines should be rendered smooth or straight by default. Applies to Line charts.
    - name: series
      TYPE: "[]STRUCT(BasicChartSeries)"
      REQUIRED: false
      comment: The data this chart is visualizing.
    - name: stackedType
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - BASIC_CHART_STACKED_TYPE_UNSPECIFIED
        - NOT_STACKED
        - STACKED
        - PERCENT_STACKED
      comment: The stacked type for charts that support vertical stacking. Applies to Area, Bar, Column, Combo, and Stepped Area charts.
    - name: threeDimensional
      TYPE: BOOL
      REQUIRED: false
      comment: True to make the chart 3D. Applies to Bar and Column charts.
    - name: totalDataLabel
      TYPE: STRUCT(DataLabel)
      REQUIRED: false
      comment: Controls whether to display additional data labels on stacked charts which sum the total value of all stacked values at each value along the domain axis. These data labels can only be set when chart_type is one of AREA, BAR, COLUMN, COMBO or STEPPED_AREA and stacked_type is either STACKED or PERCENT_STACKED. In addition, for COMBO, this will only be supported if there is only one type of stackable series type or one type has more series than the others and each of the other types have no more than one series. For example, if a chart has two stacked bar series and one area series, the total data labels will be supported. If it has three bar series and two area series, total data labels are not allowed. Neither CUSTOM nor placement can be set on the total_data_label.
  BasicFilter:
    - name: criteria
      TYPE: map[STRING]ANY
      REQUIRED: false
      DEPRECATED: true
      comment: The criteria for showing/hiding values per column. The map's key is the column index, and the value is the criteria for that column. This field is deprecated in favor of filter_specs.
    - name: filterSpecs
      TYPE: "[]STRUCT(FilterSpec)"
      REQUIRED: false
      comment: The filter criteria per column. Both criteria and filter_specs are populated in responses. If both fields are specified in an update request, this field takes precedence.
    - name: range
      TYPE: STRUCT(GridRange)
      REQUIRED: false
      comment: The range the filter covers.
    - name: sortSpecs
      TYPE: "[]STRUCT(SortSpec)"
      REQUIRED: false
      comment: The sort order per column. Later specifications are used when values are equal in the earlier specifications.
    - name: tableId
      TYPE: STRING
      REQUIRED: false
      comment: The table this filter is backed by, if any. When writing, only one of range or table_id may be set.
  BasicSeriesDataPointStyleOverride:
    - name: color
      TYPE: STRUCT(Color)
      REQUIRED: false
      DEPRECATED: true
      comment: "Color of the series data point. If empty, the series default is used. Deprecated: Use color_style."
    - name: colorStyle
      TYPE: STRUCT(ColorStyle)
      REQUIRED: false
      comment: Color of the series data point. If empty, the series default is used. If color is also set, this field takes precedence.
    - name: index
      TYPE: INT
      REQUIRED: false
      FORMAT: int32
      comment: The zero-based index of the series data point.
    - name: pointStyle
      TYPE: STRUCT(PointStyle)
      REQUIRED: false
      comment: Point style of the series data point. Valid only if the chartType is AREA, LINE, or SCATTER. COMBO charts are also supported if the series chart type is AREA, LINE, or SCATTER. If empty, the series default is used.
  BatchClearValuesByDataFilterRequest:
    - name: dataFilters
      TYPE: "[]STRUCT(DataFilter)"
      REQUIRED: false
      comment: The DataFilters used to determine which ranges to clear.
  BatchClearValuesByDataFilterResponse:
    - name: clearedRanges
      TYPE: "[]STRING"
      REQUIRED: false
      comment: The ranges that were cleared, in [A1 notation](https://developers.google.com/workspace/sheets/api/guides/concepts#cell). If the requests are for an unbounded range or a range larger than the bounds of the sheet, this is the actual ranges that were cleared, bounded to the sheet's limits.
    - name: spreadsheetId
      TYPE: STRING
      REQUIRED: false
      comment: The spreadsheet the updates were applied to.
  BatchClearValuesRequest:
    - name: ranges
      TYPE: "[]STRING"
      REQUIRED: false
      comment: The ranges to clear, in [A1 notation or R1C1 notation](https://developers.google.com/workspace/sheets/api/guides/concepts#cell).
  BatchClearValuesResponse:
    - name: clearedRanges
      TYPE: "[]STRING"
      REQUIRED: false
      comment: The ranges that were cleared, in A1 notation. If the requests are for an unbounded range or a range larger than the bounds of the sheet, this is the actual ranges that were cleared, bounded to the sheet's limits.
    - name: spreadsheetId
      TYPE: STRING
      REQUIRED: false
      comment: The spreadsheet the updates were applied to.
  BatchGetValuesByDataFilterRequest:
    - name: dataFilters
      TYPE: "[]STRUCT(DataFilter)"
      REQUIRED: false
      comment: The data filters used to match the ranges of values to retrieve. Ranges that match any of the specified data filters are included in the response.
    - name: dateTimeRenderOption
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - SERIAL_NUMBER
        - FORMATTED_STRING
      comment: How dates, times, and durations should be represented in the output. This is ignored if value_render_option is FORMATTED_VALUE. The default dateTime render option is SERIAL_NUMBER.
    - name: majorDimension
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - DIMENSION_UNSPECIFIED
        - ROWS
        - COLUMNS
      comment: "The major dimension that results should use. For example, if the spreadsheet data is: `A1=1,B1=2,A2=3,B2=4`, then a request that selects that range and sets `majorDimension=ROWS` returns `[[1,2],[3,4]]`, whereas a request that sets `majorDimension=COLUMNS` returns `[[1,3],[2,4]]`."
    - name: valueRenderOption
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - FORMATTED_VALUE
        - UNFORMATTED_VALUE
        - FORMULA
      comment: How values should be represented in the output. The default render option is FORMATTED_VALUE.
  BatchGetValuesByDataFilterResponse:
    - name: spreadsheetId
      TYPE: STRING
      REQUIRED: false
      comment: The ID of the spreadsheet the data was retrieved from.
    - name: valueRanges
      TYPE: "[]STRUCT(MatchedValueRange)"
      REQUIRED: false
      comment: The requested values with the list of data filters that matched them.
  BatchGetValuesResponse:
    - name: spreadsheetId
      TYPE: STRING
      REQUIRED: false
      comment: The ID of the spreadsheet the data was retrieved from.
    - name: valueRanges
      TYPE: "[]STRUCT(ValueRange)"
      REQUIRED: false
      comment: The requested values. The order of the ValueRanges is the same as the order of the requested ranges.
  BatchUpdateSpreadsheetRequest:
    - name: includeSpreadsheetInResponse
      TYPE: BOOL
      REQUIRED: false
      comment: Determines if the update response should include the spreadsheet resource.
    - name: requests
      TYPE: "[]STRUCT(Request)"
      REQUIRED: false
      comment: A list of updates to apply to the spreadsheet. Requests will be applied in the order they are specified. If any request is not valid, no requests will be applied.
    - name: responseIncludeGridData
      TYPE: BOOL
      REQUIRED: false
      comment: True if grid data should be returned. Meaningful only if include_spreadsheet_in_response is 'true'. This parameter is ignored if a field mask was set in the request.
    - name: responseRanges
      TYPE: "[]STRING"
      REQUIRED: false
      comment: Limits the ranges included in the response spreadsheet. Meaningful only if include_spreadsheet_in_response is 'true'.
  BatchUpdateSpreadsheetResponse:
    - name: replies
      TYPE: "[]STRUCT(Response)"
      REQUIRED: false
      comment: The reply of the updates. This maps 1:1 with the updates, although replies to some requests may be empty.
    - name: spreadsheetId
      TYPE: STRING
      REQUIRED: false
      comment: The spreadsheet the updates were applied to.
    - name: updatedSpreadsheet
      TYPE: STRUCT(Spreadsheet)
      REQUIRED: false
      comment: The spreadsheet after updates were applied. This is only set if BatchUpdateSpreadsheetRequest.include_spreadsheet_in_response is `true`.
  BatchUpdateValuesByDataFilterRequest:
    - name: data
      TYPE: "[]STRUCT(DataFilterValueRange)"
      REQUIRED: false
      comment: The new values to apply to the spreadsheet. If more than one range is matched by the specified DataFilter the specified values are applied to all of those ranges.
    - name: includeValuesInResponse
      TYPE: BOOL
      REQUIRED: false
      comment: Determines if the update response should include the values of the cells that were updated. By default, responses do not include the updated values. The `updatedData` field within each of the BatchUpdateValuesResponse.responses contains the updated values. If the range to write was larger than the range actually written, the response includes all values in the requested range (excluding trailing empty rows and columns).
    - name: responseDateTimeRenderOption
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - SERIAL_NUMBER
        - FORMATTED_STRING
      comment: Determines how dates, times, and durations in the response should be rendered. This is ignored if response_value_render_option is FORMATTED_VALUE. The default dateTime render option is SERIAL_NUMBER.
    - name: responseValueRenderOption
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - FORMATTED_VALUE
        - UNFORMATTED_VALUE
        - FORMULA
      comment: Determines how values in the response should be rendered. The default render option is FORMATTED_VALUE.
    - name: valueInputOption
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - INPUT_VALUE_OPTION_UNSPECIFIED
        - RAW
        - USER_ENTERED
      comment: How the input data should be interpreted.
  BatchUpdateValuesByDataFilterResponse:
    - name: responses
      TYPE: "[]STRUCT(UpdateValuesByDataFilterResponse)"
      REQUIRED: false
      comment: The response for each range updated.
    - name: spreadsheetId
      TYPE: STRING
      REQUIRED: false
      comment: The spreadsheet the updates were applied to.
    - name: totalUpdatedCells
      TYPE: INT
      REQUIRED: false
      FORMAT: int32
      comment: The total number of cells updated.
    - name: totalUpdatedColumns
      TYPE: INT
      REQUIRED: false
      FORMAT: int32
      comment: The total number of columns where at least one cell in the column was updated.
    - name: totalUpdatedRows
      TYPE: INT
      REQUIRED: false
      FORMAT: int32
      comment: The total number of rows where at least one cell in the row was updated.
    - name: totalUpdatedSheets
      TYPE: INT
      REQUIRED: false
      FORMAT: int32
      comment: The total number of sheets where at least one cell in the sheet was updated.
  BatchUpdateValuesRequest:
    - name: data
      TYPE: "[]STRUCT(ValueRange)"
      REQUIRED: false
      comment: The new values to apply to the spreadsheet.
    - name: includeValuesInResponse
      TYPE: BOOL
      REQUIRED: false
      comment: Determines if the update response should include the values of the cells that were updated. By default, responses do not include the updated values. The `updatedData` field within each of the BatchUpdateValuesResponse.responses contains the updated values. If the range to write was larger than the range actually written, the response includes all values in the requested range (excluding trailing empty rows and columns).
    - name: responseDateTimeRenderOption
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - SERIAL_NUMBER
        - FORMATTED_STRING
      comment: Determines how dates, times, and durations in the response should be rendered. This is ignored if response_value_render_option is FORMATTED_VALUE. The default dateTime render option is SERIAL_NUMBER.
    - name: responseValueRenderOption
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - FORMATTED_VALUE
        - UNFORMATTED_VALUE
        - FORMULA
      comment: Determines how values in the response should be rendered. The default render option is FORMATTED_VALUE.
    - name: valueInputOption
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - INPUT_VALUE_OPTION_UNSPECIFIED
        - RAW
        - USER_ENTERED
      comment: How the input data should be interpreted.
  BatchUpdateValuesResponse:
    - name: responses
      TYPE: "[]STRUCT(UpdateValuesResponse)"
      REQUIRED: false
      comment: One UpdateValuesResponse per requested range, in the same order as the requests appeared.
    - name: spreadsheetId
      TYPE: STRING
      REQUIRED: false
      comment: The spreadsheet the updates were applied to.
    - name: totalUpdatedCells
      TYPE: INT
      REQUIRED: false
      FORMAT: int32
      comment: The total number of cells updated.
    - name: totalUpdatedColumns
      TYPE: INT
      REQUIRED: false
      FORMAT: int32
      comment: The total number of columns where at least one cell in the column was updated.
    - name: totalUpdatedRows
      TYPE: INT
      REQUIRED: false
      FORMAT: int32
      comment: The total number of rows where at least one cell in the row was updated.
    - name: totalUpdatedSheets
      TYPE: INT
      REQUIRED: false
      FORMAT: int32
      comment: The total number of sheets where at least one cell in the sheet was updated.
  BigQueryDataSourceSpec:
    - name: projectId
      TYPE: STRING
      REQUIRED: false
      comment: The ID of a BigQuery enabled Google Cloud project with a billing account attached. For any queries executed against the data source, the project is charged.
    - name: querySpec
      TYPE: STRUCT(BigQueryQuerySpec)
      REQUIRED: false
      comment: A BigQueryQuerySpec.
    - name: tableSpec
      TYPE: STRUCT(BigQueryTableSpec)
      REQUIRED: false
      comment: A BigQueryTableSpec.
  BigQueryQuerySpec:
    - name: rawQuery
      TYPE: STRING
      REQUIRED: false
      comment: The raw query string.
  BigQueryTableSpec:
    - name: datasetId
      TYPE: STRING
      REQUIRED: false
      comment: The BigQuery dataset id.
    - name: tableId
      TYPE: STRING
      REQUIRED: false
      comment: The BigQuery table id.
    - name: tableProjectId
      TYPE: STRING
      REQUIRED: false
      comment: The ID of a BigQuery project the table belongs to. If not specified, the project_id is assumed.
  BooleanCondition:
    - name: type
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - CONDITION_TYPE_UNSPECIFIED
        - NUMBER_GREATER
        - NUMBER_GREATER_THAN_EQ
        - NUMBER_LESS
        - NUMBER_LESS_THAN_EQ
        - NUMBER_EQ
        - NUMBER_NOT_EQ
        - NUMBER_BETWEEN
        - NUMBER_NOT_BETWEEN
        - TEXT_CONTAINS
        - TEXT_NOT_CONTAINS
        - TEXT_STARTS_WITH
        - TEXT_ENDS_WITH
        - TEXT_EQ
        - TEXT_IS_EMAIL
        - TEXT_IS_URL
        - DATE_EQ
        - DATE_BEFORE
        - DATE_AFTER
        - DATE_ON_OR_BEFORE
        - DATE_ON_OR_AFTER
        - DATE_BETWEEN
        - DATE_NOT_BETWEEN
        - DATE_IS_VALID
        - ONE_OF_RANGE
        - ONE_OF_LIST
        - BLANK
        - NOT_BLANK
        - CUSTOM_FORMULA
        - BOOLEAN
        - TEXT_NOT_EQ
        - DATE_NOT_EQ
        - FILTER_EXPRESSION
      comment: The type of condition.
    - name: values
      TYPE: "[]STRUCT(ConditionValue)"
      REQUIRED: false
      comment: The values of the condition. The number of supported values depends on the condition type. Some support zero values, others one or two values, and ConditionType.ONE_OF_LIST supports an arbitrary number of values.
  BooleanRule:
    - name: condition
      TYPE: STRUCT(BooleanCondition)
      REQUIRED: false
      comment: The condition of the rule. If the condition evaluates to true, the format is applied.
    - name: format
      TYPE: STRUCT(CellFormat)
      REQUIRED: false
      comment: "The format to apply. Conditional formatting can only apply a subset of formatting: bold, italic, strikethrough, foreground color and, background color."
  Border:
    - name: color
      TYPE: STRUCT(Color)
      REQUIRED: false
      DEPRECATED: true
      comment: "The color of the border. Deprecated: Use color_style."
    - name: colorStyle
      TYPE: STRUCT(ColorStyle)
      REQUIRED: false
      comment: The color of the border. If color is also set, this field takes precedence.
    - name: style
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - STYLE_UNSPECIFIED
        - DOTTED
        - DASHED
        - SOLID
        - SOLID_MEDIUM
        - SOLID_THICK
        - NONE
        - DOUBLE
      comment: The style of the border.
    - name: width
      TYPE: INT
      REQUIRED: false
      FORMAT: int32
      DEPRECATED: true
      comment: The width of the border, in pixels. Deprecated; the width is determined by the "style" field.
  Borders:
    - name: bottom
      TYPE: STRUCT(Border)
      REQUIRED: false
      comment: The bottom border of the cell.
    - name: left
      TYPE: STRUCT(Border)
      REQUIRED: false
      comment: The left border of the cell.
    - name: right
      TYPE: STRUCT(Border)
      REQUIRED: false
      comment: The right border of the cell.
    - name: top
      TYPE: STRUCT(Border)
      REQUIRED: false
      comment: The top border of the cell.
  BubbleChartSpec:
    - name: bubbleBorderColor
      TYPE: STRUCT(Color)
      REQUIRED: false
      DEPRECATED: true
      comment: "The bubble border color. Deprecated: Use bubble_border_color_style."
    - name: bubbleBorderColorStyle
      TYPE: STRUCT(ColorStyle)
      REQUIRED: false
      comment: The bubble border color. If bubble_border_color is also set, this field takes precedence.
    - name: bubbleLabels
      TYPE: STRUCT(ChartData)
      REQUIRED: false
      comment: The data containing the bubble labels. These do not need to be unique.
    - name: bubbleMaxRadiusSize
      TYPE: INT
      REQUIRED: false
      FORMAT: int32
      comment: The max radius size of the bubbles, in pixels. If specified, the field must be a positive value.
    - name: bubbleMinRadiusSize
      TYPE: INT
      REQUIRED: false
      FORMAT: int32
      comment: The minimum radius size of the bubbles, in pixels. If specific, the field must be a positive value.
    - name: bubbleOpacity
      TYPE: FLOAT
      REQUIRED: false
      FORMAT: float
      comment: The opacity of the bubbles between 0 and 1.0. 0 is fully transparent and 1 is fully opaque.
    - name: bubbleSizes
      TYPE: STRUCT(ChartData)
      REQUIRED: false
      comment: The data containing the bubble sizes. Bubble sizes are used to draw the bubbles at different sizes relative to each other. If specified, group_ids must also be specified. This field is optional.
    - name: bubbleTextStyle
      TYPE: STRUCT(TextFormat)
      REQUIRED: false
      comment: The format of the text inside the bubbles. Strikethrough, underline, and link are not supported.
    - name: domain
      TYPE: STRUCT(ChartData)
      REQUIRED: false
      comment: The data containing the bubble x-values. These values locate the bubbles in the chart horizontally.
    - name: groupIds
      TYPE: STRUCT(ChartData)
      REQUIRED: false
      comment: The data containing the bubble group IDs. All bubbles with the same group ID are drawn in the same color. If bubble_sizes is specified then this field must also be specified but may contain blank values. This field is optional.
    - name: legendPosition
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - BUBBLE_CHART_LEGEND_POSITION_UNSPECIFIED
        - BOTTOM_LEGEND
        - LEFT_LEGEND
        - RIGHT_LEGEND
        - TOP_LEGEND
        - NO_LEGEND
        - INSIDE_LEGEND
      comment: Where the legend of the chart should be drawn.
    - name: series
      TYPE: STRUCT(ChartData)
      REQUIRED: false
      comment: The data containing the bubble y-values. These values locate the bubbles in the chart vertically.
  CancelDataSourceRefreshRequest:
    - name: dataSourceId
      TYPE: STRING
      REQUIRED: false
      comment: Reference to a DataSource. If specified, cancels all associated data source object refreshes for this data source.
    - name: isAll
      TYPE: BOOL
      REQUIRED: false
      comment: Cancels all existing data source object refreshes for all data sources in the spreadsheet.
    - name: references
      TYPE: STRUCT(DataSourceObjectReferences)
      REQUIRED: false
      comment: References to data source objects whose refreshes are to be cancelled.
  CancelDataSourceRefreshResponse:
    - name: statuses
      TYPE: "[]STRUCT(CancelDataSourceRefreshStatus)"
      REQUIRED: false
      comment: The cancellation statuses of refreshes of all data source objects specified in the request. If is_all is specified, the field contains only those in failure status. Refreshing and canceling refresh the same data source object is also not allowed in the same `batchUpdate`.
  CancelDataSourceRefreshStatus:
    - name: reference
      TYPE: STRUCT(DataSourceObjectReference)
      REQUIRED: false
      comment: Reference to the data source object whose refresh is being cancelled.
    - name: refreshCancellationStatus
      TYPE: STRUCT(RefreshCancellationStatus)
      REQUIRED: false
      comment: The cancellation status.
  CandlestickChartSpec:
    - name: data
      TYPE: "[]STRUCT(CandlestickData)"
      REQUIRED: false
      comment: The Candlestick chart data. Only one CandlestickData is supported.
    - name: domain
      TYPE: STRUCT(CandlestickDomain)
      REQUIRED: false
      comment: The domain data (horizontal axis) for the candlestick chart. String data will be treated as discrete labels, other data will be treated as continuous values.
  CandlestickData:
    - name: closeSeries
      TYPE: STRUCT(CandlestickSeries)
      REQUIRED: false
      comment: The range data (vertical axis) for the close/final value for each candle. This is the top of the candle body. If greater than the open value the candle will be filled. Otherwise the candle will be hollow.
    - name: highSeries
      TYPE: STRUCT(CandlestickSeries)
      REQUIRED: false
      comment: The range data (vertical axis) for the high/maximum value for each candle. This is the top of the candle's center line.
    - name: lowSeries
      TYPE: STRUCT(CandlestickSeries)
      REQUIRED: false
      comment: The range data (vertical axis) for the low/minimum value for each candle. This is the bottom of the candle's center line.
    - name: openSeries
      TYPE: STRUCT(CandlestickSeries)
      REQUIRED: false
      comment: The range data (vertical axis) for the open/initial value for each candle. This is the bottom of the candle body. If less than the close value the candle will be filled. Otherwise the candle will be hollow.
  CandlestickDomain:
    - name: data
      TYPE: STRUCT(ChartData)
      REQUIRED: false
      comment: The data of the CandlestickDomain.
    - name: reversed
      TYPE: BOOL
      REQUIRED: false
      comment: True to reverse the order of the domain values (horizontal axis).
  CandlestickSeries:
    - name: data
      TYPE: STRUCT(ChartData)
      REQUIRED: false
      comment: The data of the CandlestickSeries.
  CellData:
    - name: chipRuns
      TYPE: "[]STRUCT(ChipRun)"
      REQUIRED: false
      comment: Optional. Runs of chips applied to subsections of the cell. Properties of a run start at a specific index in the text and continue until the next run. When reading, all chipped and non-chipped runs are included. Non-chipped runs will have an empty Chip. When writing, only runs with chips are included. Runs containing chips are of length 1 and are represented in the user-entered text by an “@” placeholder symbol. New runs will overwrite any prior runs. Writing a new user_entered_value will erase previous runs.
    - name: dataSourceFormula
      TYPE: STRUCT(DataSourceFormula)
      REQUIRED: false
      READ_ONLY: true
      comment: Output only. Information about a data source formula on the cell. The field is set if user_entered_value is a formula referencing some DATA_SOURCE sheet, e.g. `=SUM(DataSheet!Column)`.
    - name: dataSourceTable
      TYPE: STRUCT(DataSourceTable)
      REQUIRED: false
      comment: A data source table anchored at this cell. The size of data source table itself is computed dynamically based on its configuration. Only the first cell of the data source table contains the data source table definition. The other cells will contain the display values of the data source table result in their effective_value fields.
    - name: dataValidation
      TYPE: STRUCT(DataValidationRule)
      REQUIRED: false
      comment: A data validation rule on the cell, if any. When writing, the new data validation rule will overwrite any prior rule.
    - name: effectiveFormat
      TYPE: STRUCT(CellFormat)
      REQUIRED: false
      comment: The effective format being used by the cell. This includes the results of applying any conditional formatting and, if the cell contains a formula, the computed number format. If the effective format is the default format, effective format will not be written. This field is read-only.
    - name: effectiveValue
      TYPE: STRUCT(ExtendedValue)
      REQUIRED: false
      comment: The effective value of the cell. For cells with formulas, this is the calculated value. For cells with literals, this is the same as the user_entered_value. This field is read-only.
    - name: formattedValue
      TYPE: STRING
      REQUIRED: false
      comment: The formatted value of the cell. This is the value as it's shown to the user. This field is read-only.
    - name: hyperlink
      TYPE: STRING
      REQUIRED: false
      comment: A hyperlink this cell points to, if any. If the cell contains multiple hyperlinks, this field will be empty. This field is read-only. To set it, use a `=HYPERLINK` formula in the userEnteredValue.formulaValue field. A cell-level link can also be set from the userEnteredFormat.textFormat field. Alternatively, set a hyperlink in the textFormatRun.format.link field that spans the entire cell.
    - name: note
      TYPE: STRING
      REQUIRED: false
      comment: Any note on the cell.
    - name: pivotTable
      TYPE: STRUCT(PivotTable)
      REQUIRED: false
      comment: A pivot table anchored at this cell. The size of pivot table itself is computed dynamically based on its data, grouping, filters, values, etc. Only the top-left cell of the pivot table contains the pivot table definition. The other cells will contain the calculated values of the results of the pivot in their effective_value fields.
    - name: textFormatRuns
      TYPE: "[]STRUCT(TextFormatRun)"
      REQUIRED: false
      comment: Runs of rich text applied to subsections of the cell. Runs are only valid on user entered strings, not formulas, bools, or numbers. Properties of a run start at a specific index in the text and continue until the next run. Runs will inherit the properties of the cell unless explicitly changed. When writing, the new runs will overwrite any prior runs. When writing a new user_entered_value, previous runs are erased.
    - name: userEnteredFormat
      TYPE: STRUCT(CellFormat)
      REQUIRED: false
      comment: The format the user entered for the cell. When writing, the new format will be merged with the existing format.
    - name: userEnteredValue
      TYPE: STRUCT(ExtendedValue)
      REQUIRED: false
      comment: "The value the user entered in the cell. e.g., `1234`, `'Hello'`, or `=NOW()` Note: Dates, Times and DateTimes are represented as doubles in serial number format."
  CellFormat:
    - name: backgroundColor
      TYPE: STRUCT(Color)
      REQUIRED: false
      DEPRECATED: true
      comment: "The background color of the cell. Deprecated: Use background_color_style."
    - name: backgroundColorStyle
      TYPE: STRUCT(ColorStyle)
      REQUIRED: false
      comment: The background color of the cell. If background_color is also set, this field takes precedence.
    - name: borders
      TYPE: STRUCT(Borders)
      REQUIRED: false
      comment: The borders of the cell.
    - name: horizontalAlignment
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - HORIZONTAL_ALIGN_UNSPECIFIED
        - LEFT
        - CENTER
        - RIGHT
      comment: The horizontal alignment of the value in the cell.
    - name: hyperlinkDisplayType
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - HYPERLINK_DISPLAY_TYPE_UNSPECIFIED
        - LINKED
        - PLAIN_TEXT
      comment: If one exists, how a hyperlink should be displayed in the cell.
    - name: numberFormat
      TYPE: STRUCT(NumberFormat)
      REQUIRED: false
      comment: A format describing how number values should be represented to the user.
    - name: padding
      TYPE: STRUCT(Padding)
      REQUIRED: false
      comment: The padding of the cell.
    - name: textDirection
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - TEXT_DIRECTION_UNSPECIFIED
        - LEFT_TO_RIGHT
        - RIGHT_TO_LEFT
      comment: The direction of the text in the cell.
    - name: textFormat
      TYPE: STRUCT(TextFormat)
      REQUIRED: false
      comment: The format of the text in the cell (unless overridden by a format run). Setting a cell-level link here clears the cell's existing links. Setting the link field in a TextFormatRun takes precedence over the cell-level link.
    - name: textRotation
      TYPE: STRUCT(TextRotation)
      REQUIRED: false
      comment: The rotation applied to text in the cell.
    - name: verticalAlignment
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - VERTICAL_ALIGN_UNSPECIFIED
        - TOP
        - MIDDLE
        - BOTTOM
      comment: The vertical alignment of the value in the cell.
    - name: wrapStrategy
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - WRAP_STRATEGY_UNSPECIFIED
        - OVERFLOW_CELL
        - LEGACY_WRAP
        - CLIP
        - WRAP
      comment: The wrap strategy for the value in the cell.
  ChartAxisViewWindowOptions:
    - name: viewWindowMax
      TYPE: FLOAT
      REQUIRED: false
      FORMAT: double
      comment: The maximum numeric value to be shown in this view window. If unset, will automatically determine a maximum value that looks good for the data.
    - name: viewWindowMin
      TYPE: FLOAT
      REQUIRED: false
      FORMAT: double
      comment: The minimum numeric value to be shown in this view window. If unset, will automatically determine a minimum value that looks good for the data.
    - name: viewWindowMode
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - DEFAULT_VIEW_WINDOW_MODE
        - VIEW_WINDOW_MODE_UNSUPPORTED
        - EXPLICIT
        - PRETTY
      comment: The view window's mode.
  ChartCustomNumberFormatOptions:
    - name: prefix
      TYPE: STRING
      REQUIRED: false
      comment: Custom prefix to be prepended to the chart attribute. This field is optional.
    - name: suffix
      TYPE: STRING
      REQUIRED: false
      comment: Custom suffix to be appended to the chart attribute. This field is optional.
  ChartData:
    - name: aggregateType
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - CHART_AGGREGATE_TYPE_UNSPECIFIED
        - AVERAGE
        - COUNT
        - MAX
        - MEDIAN
        - MIN
        - SUM
      comment: The aggregation type for the series of a data source chart. Only supported for data source charts.
    - name: columnReference
      TYPE: STRUCT(DataSourceColumnReference)
      REQUIRED: false
      comment: The reference to the data source column that the data reads from.
    - name: groupRule
      TYPE: STRUCT(ChartGroupRule)
      REQUIRED: false
      comment: The rule to group the data by if the ChartData backs the domain of a data source chart. Only supported for data source charts.
    - name: sourceRange
      TYPE: STRUCT(ChartSourceRange)
      REQUIRED: false
      comment: The source ranges of the data.
  ChartDateTimeRule:
    - name: type
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - CHART_DATE_TIME_RULE_TYPE_UNSPECIFIED
        - SECOND
        - MINUTE
        - HOUR
        - HOUR_MINUTE
        - HOUR_MINUTE_AMPM
        - DAY_OF_WEEK
        - DAY_OF_YEAR
        - DAY_OF_MONTH
        - DAY_MONTH
        - MONTH
        - QUARTER
        - YEAR
        - YEAR_MONTH
        - YEAR_QUARTER
        - YEAR_MONTH_DAY
      comment: The type of date-time grouping to apply.
  ChartGroupRule:
    - name: dateTimeRule
      TYPE: STRUCT(ChartDateTimeRule)
      REQUIRED: false
      comment: A ChartDateTimeRule.
    - name: histogramRule
      TYPE: STRUCT(ChartHistogramRule)
      REQUIRED: false
      comment: A ChartHistogramRule
  ChartHistogramRule:
    - name: intervalSize
      TYPE: FLOAT
      REQUIRED: false
      FORMAT: double
      comment: The size of the buckets that are created. Must be positive.
    - name: maxValue
      TYPE: FLOAT
      REQUIRED: false
      FORMAT: double
      comment: The maximum value at which items are placed into buckets. Values greater than the maximum are grouped into a single bucket. If omitted, it is determined by the maximum item value.
    - name: minValue
      TYPE: FLOAT
      REQUIRED: false
      FORMAT: double
      comment: The minimum value at which items are placed into buckets. Values that are less than the minimum are grouped into a single bucket. If omitted, it is determined by the minimum item value.
  ChartSourceRange:
    - name: sources
      TYPE: "[]STRUCT(GridRange)"
      REQUIRED: false
      comment: "The ranges of data for a series or domain. Exactly one dimension must have a length of 1, and all sources in the list must have the same dimension with length 1. The domain (if it exists) & all series must have the same number of source ranges. If using more than one source range, then the source range at a given offset must be in order and contiguous across the domain and series. For example, these are valid configurations: domain sources: A1:A5 series1 sources: B1:B5 series2 sources: D6:D10 domain sources: A1:A5, C10:C12 series1 sources: B1:B5, D10:D12 series2 sources: C1:C5, E10:E12"
  ChartSpec:
    - name: altText
      TYPE: STRING
      REQUIRED: false
      comment: The alternative text that describes the chart. This is often used for accessibility.
    - name: backgroundColor
      TYPE: STRUCT(Color)
      REQUIRED: false
      DEPRECATED: true
      comment: "The background color of the entire chart. Not applicable to Org charts. Deprecated: Use background_color_style."
    - name: backgroundColorStyle
      TYPE: STRUCT(ColorStyle)
      REQUIRED: false
      comment: The background color of the entire chart. Not applicable to Org charts. If background_color is also set, this field takes precedence.
    - name: basicChart
      TYPE: STRUCT(BasicChartSpec)
      REQUIRED: false
      comment: A basic chart specification, can be one of many kinds of charts. See BasicChartType for the list of all charts this supports.
    - name: bubbleChart
      TYPE: STRUCT(BubbleChartSpec)
      REQUIRED: false
      comment: A bubble chart specification.
    - name: candlestickChart
      TYPE: STRUCT(CandlestickChartSpec)
      REQUIRED: false
      comment: A candlestick chart specification.
    - name: dataSourceChartProperties
      TYPE: STRUCT(DataSourceChartProperties)
      REQUIRED: false
      comment: If present, the field contains data source chart specific properties.
    - name: filterSpecs
      TYPE: "[]STRUCT(FilterSpec)"
      REQUIRED: false
      comment: The filters applied to the source data of the chart. Only supported for data source charts.
    - name: fontName
      TYPE: STRING
      REQUIRED: false
      comment: The name of the font to use by default for all chart text (e.g. title, axis labels, legend). If a font is specified for a specific part of the chart it will override this font name.
    - name: hiddenDimensionStrategy
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - CHART_HIDDEN_DIMENSION_STRATEGY_UNSPECIFIED
        - SKIP_HIDDEN_ROWS_AND_COLUMNS
        - SKIP_HIDDEN_ROWS
        - SKIP_HIDDEN_COLUMNS
        - SHOW_ALL
      comment: Determines how the charts will use hidden rows or columns.
    - name: histogramChart
      TYPE: STRUCT(HistogramChartSpec)
      REQUIRED: false
      comment: A histogram chart specification.
    - name: maximized
      TYPE: BOOL
      REQUIRED: false
      comment: True to make a chart fill the entire space in which it's rendered with minimum padding. False to use the default padding. (Not applicable to Geo and Org charts.)
    - name: orgChart
      TYPE: STRUCT(OrgChartSpec)
      REQUIRED: false
      comment: An org chart specification.
    - name: pieChart
      TYPE: STRUCT(PieChartSpec)
      REQUIRED: false
      comment: A pie chart specification.
    - name: scorecardChart
      TYPE: STRUCT(ScorecardChartSpec)
      REQUIRED: false
      comment: A scorecard chart specification.
    - name: sortSpecs
      TYPE: "[]STRUCT(SortSpec)"
      REQUIRED: false
      comment: The order to sort the chart data by. Only a single sort spec is supported. Only supported for data source charts.
    - name: subtitle
      TYPE: STRING
      REQUIRED: false
      comment: The subtitle of the chart.
    - name: subtitleTextFormat
      TYPE: STRUCT(TextFormat)
      REQUIRED: false
      comment: The subtitle text format. Strikethrough, underline, and link are not supported.
    - name: subtitleTextPosition
      TYPE: STRUCT(TextPosition)
      REQUIRED: false
      comment: The subtitle text position. This field is optional.
    - name: title
      TYPE: STRING
      REQUIRED: false
      comment: The title of the chart.
    - name: titleTextFormat
      TYPE: STRUCT(TextFormat)
      REQUIRED: false
      comment: The title text format. Strikethrough, underline, and link are not supported.
    - name: titleTextPosition
      TYPE: STRUCT(TextPosition)
      REQUIRED: false
      comment: The title text position. This field is optional.
    - name: treemapChart
      TYPE: STRUCT(TreemapChartSpec)
      REQUIRED: false
      comment: A treemap chart specification.
    - name: waterfallChart
      TYPE: STRUCT(WaterfallChartSpec)
      REQUIRED: false
      comment: A waterfall chart specification.
  Chip:
    - name: personProperties
      TYPE: STRUCT(PersonProperties)
      REQUIRED: false
      comment: Properties of a linked person.
    - name: richLinkProperties
      TYPE: STRUCT(RichLinkProperties)
      REQUIRED: false
      comment: Properties of a rich link.
  ChipRun:
    - name: chip
      TYPE: STRUCT(Chip)
      REQUIRED: false
      comment: Optional. The chip of this run.
    - name: startIndex
      TYPE: INT
      REQUIRED: false
      FORMAT: int32
      comment: Required. The zero-based character index where this run starts, in UTF-16 code units.
  ClearBasicFilterRequest:
    - name: sheetId
      TYPE: INT
      REQUIRED: false
      FORMAT: int32
      comment: The sheet ID on which the basic filter should be cleared.
  ClearValuesRequest:
    - name: value
      TYPE: ANY
      REQUIRED: false
  ClearValuesResponse:
    - name: clearedRange
      TYPE: STRING
      REQUIRED: false
      comment: The range (in A1 notation) that was cleared. (If the request was for an unbounded range or a range larger than the bounds of the sheet, this will be the actual range that was cleared, bounded to the sheet's limits.)
    - name: spreadsheetId
      TYPE: STRING
      REQUIRED: false
      comment: The spreadsheet the updates were applied to.
  Color:
    - name: alpha
      TYPE: FLOAT
      REQUIRED: false
      FORMAT: float
      comment: "The fraction of this color that should be applied to the pixel. That is, the final pixel color is defined by the equation: `pixel color = alpha * (this color) + (1.0 - alpha) * (background color)` This means that a value of 1.0 corresponds to a solid color, whereas a value of 0.0 corresponds to a completely transparent color. This uses a wrapper message rather than a simple float scalar so that it is possible to distinguish between a default value and the value being unset. If omitted, this color object is rendered as a solid color (as if the alpha value had been explicitly given a value of 1.0)."
    - name: blue
      TYPE: FLOAT
      REQUIRED: false
      FORMAT: float
      comment: The amount of blue in the color as a value in the interval [0, 1].
    - name: green
      TYPE: FLOAT
      REQUIRED: false
      FORMAT: float
      comment: The amount of green in the color as a value in the interval [0, 1].
    - name: red
      TYPE: FLOAT
      REQUIRED: false
      FORMAT: float
      comment: The amount of red in the color as a value in the interval [0, 1].
  ColorStyle:
    - name: rgbColor
      TYPE: STRUCT(Color)
      REQUIRED: false
      comment: RGB color. The [`alpha`](https://developers.google.com/workspace/sheets/api/reference/rest/v4/spreadsheets/other#Color.FIELDS.alpha) value in the [`Color`](https://developers.google.com/workspace/sheets/api/reference/rest/v4/spreadsheets/other#color) object isn't generally supported.
    - name: themeColor
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - THEME_COLOR_TYPE_UNSPECIFIED
        - TEXT
        - BACKGROUND
        - ACCENT1
        - ACCENT2
        - ACCENT3
        - ACCENT4
        - ACCENT5
        - ACCENT6
        - LINK
      comment: Theme color.
  ConditionValue:
    - name: relativeDate
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - RELATIVE_DATE_UNSPECIFIED
        - PAST_YEAR
        - PAST_MONTH
        - PAST_WEEK
        - YESTERDAY
        - TODAY
        - TOMORROW
      comment: A relative date (based on the current date). Valid only if the type is DATE_BEFORE, DATE_AFTER, DATE_ON_OR_BEFORE or DATE_ON_OR_AFTER. Relative dates are not supported in data validation. They are supported only in conditional formatting and conditional filters.
    - name: userEnteredValue
      TYPE: STRING
      REQUIRED: false
      comment: A value the condition is based on. The value is parsed as if the user typed into a cell. Formulas are supported (and must begin with an `=` or a '+').
  ConditionalFormatRule:
    - name: booleanRule
      TYPE: STRUCT(BooleanRule)
      REQUIRED: false
      comment: The formatting is either "on" or "off" according to the rule.
    - name: gradientRule
      TYPE: STRUCT(GradientRule)
      REQUIRED: false
      comment: The formatting will vary based on the gradients in the rule.
    - name: ranges
      TYPE: "[]STRUCT(GridRange)"
      REQUIRED: false
      comment: The ranges that are formatted if the condition is true. All the ranges must be on the same grid.
  CopyPasteRequest:
    - name: destination
      TYPE: STRUCT(GridRange)
      REQUIRED: false
      comment: The location to paste to. If the range covers a span that's a multiple of the source's height or width, then the data will be repeated to fill in the destination range. If the range is smaller than the source range, the entire source data will still be copied (beyond the end of the destination range).
    - name: pasteOrientation
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - NORMAL
        - TRANSPOSE
      comment: How that data should be oriented when pasting.
    - name: pasteType
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - PASTE_NORMAL
        - PASTE_VALUES
        - PASTE_FORMAT
        - PASTE_NO_BORDERS
        - PASTE_FORMULA
        - PASTE_DATA_VALIDATION
        - PASTE_CONDITIONAL_FORMATTING
      comment: What kind of data to paste.
    - name: source
      TYPE: STRUCT(GridRange)
      REQUIRED: false
      comment: The source range to copy.
  CopySheetToAnotherSpreadsheetRequest:
    - name: destinationSpreadsheetId
      TYPE: STRING
      REQUIRED: false
      comment: The ID of the spreadsheet to copy the sheet to.
  CreateDeveloperMetadataRequest:
    - name: developerMetadata
      TYPE: STRUCT(DeveloperMetadata)
      REQUIRED: false
      comment: The developer metadata to create.
  CreateDeveloperMetadataResponse:
    - name: developerMetadata
      TYPE: STRUCT(DeveloperMetadata)
      REQUIRED: false
      comment: The developer metadata that was created.
  CutPasteRequest:
    - name: destination
      TYPE: STRUCT(GridCoordinate)
      REQUIRED: false
      comment: The top-left coordinate where the data should be pasted.
    - name: pasteType
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - PASTE_NORMAL
        - PASTE_VALUES
        - PASTE_FORMAT
        - PASTE_NO_BORDERS
        - PASTE_FORMULA
        - PASTE_DATA_VALIDATION
        - PASTE_CONDITIONAL_FORMATTING
      comment: What kind of data to paste. All the source data will be cut, regardless of what is pasted.
    - name: source
      TYPE: STRUCT(GridRange)
      REQUIRED: false
      comment: The source data to cut.
  DataExecutionStatus:
    - name: errorCode
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - DATA_EXECUTION_ERROR_CODE_UNSPECIFIED
        - TIMED_OUT
        - TOO_MANY_ROWS
        - TOO_MANY_COLUMNS
        - TOO_MANY_CELLS
        - ENGINE
        - PARAMETER_INVALID
        - UNSUPPORTED_DATA_TYPE
        - DUPLICATE_COLUMN_NAMES
        - INTERRUPTED
        - CONCURRENT_QUERY
        - OTHER
        - TOO_MANY_CHARS_PER_CELL
        - DATA_NOT_FOUND
        - PERMISSION_DENIED
        - MISSING_COLUMN_ALIAS
        - OBJECT_NOT_FOUND
        - OBJECT_IN_ERROR_STATE
        - OBJECT_SPEC_INVALID
        - DATA_EXECUTION_CANCELLED
      comment: The error code.
    - name: errorMessage
      TYPE: STRING
      REQUIRED: false
      comment: The error message, which may be empty.
    - name: lastRefreshTime
      TYPE: STRING
      REQUIRED: false
      FORMAT: google-datetime
      comment: Gets the time the data last successfully refreshed.
    - name: state
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - DATA_EXECUTION_STATE_UNSPECIFIED
        - NOT_STARTED
        - RUNNING
        - CANCELLING
        - SUCCEEDED
        - FAILED
      comment: The state of the data execution.
  DataFilter:
    - name: a1Range
      TYPE: STRING
      REQUIRED: false
      comment: Selects data that matches the specified A1 range.
    - name: developerMetadataLookup
      TYPE: STRUCT(DeveloperMetadataLookup)
      REQUIRED: false
      comment: Selects data associated with the developer metadata matching the criteria described by this DeveloperMetadataLookup.
    - name: gridRange
      TYPE: STRUCT(GridRange)
      REQUIRED: false
      comment: Selects data that matches the range described by the GridRange.
  DataFilterValueRange:
    - name: dataFilter
      TYPE: STRUCT(DataFilter)
      REQUIRED: false
      comment: The data filter describing the location of the values in the spreadsheet.
    - name: majorDimension
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - DIMENSION_UNSPECIFIED
        - ROWS
        - COLUMNS
      comment: The major dimension of the values.
    - name: values
      TYPE: "[]ANY"
      REQUIRED: false
      comment: The data to be written. If the provided values exceed any of the ranges matched by the data filter then the request fails. If the provided values are less than the matched ranges only the specified values are written, existing values in the matched ranges remain unaffected.
  DataLabel:
    - name: customLabelData
      TYPE: STRUCT(ChartData)
      REQUIRED: false
      comment: Data to use for custom labels. Only used if type is set to CUSTOM. This data must be the same length as the series or other element this data label is applied to. In addition, if the series is split into multiple source ranges, this source data must come from the next column in the source data. For example, if the series is B2:B4,E6:E8 then this data must come from C2:C4,F6:F8.
    - name: placement
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - DATA_LABEL_PLACEMENT_UNSPECIFIED
        - CENTER
        - LEFT
        - RIGHT
        - ABOVE
        - BELOW
        - INSIDE_END
        - INSIDE_BASE
        - OUTSIDE_END
      comment: The placement of the data label relative to the labeled data.
    - name: textFormat
      TYPE: STRUCT(TextFormat)
      REQUIRED: false
      comment: The text format used for the data label. The link field is not supported.
    - name: type
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - DATA_LABEL_TYPE_UNSPECIFIED
        - NONE
        - DATA
        - CUSTOM
      comment: The type of the data label.
  DataSource:
    - name: calculatedColumns
      TYPE: "[]STRUCT(DataSourceColumn)"
      REQUIRED: false
      comment: All calculated columns in the data source.
    - name: dataSourceId
      TYPE: STRING
      REQUIRED: false
      comment: "The spreadsheet-scoped unique ID that identifies the data source. Example: 1080547365."
    - name: sheetId
      TYPE: INT
      REQUIRED: false
      FORMAT: int32
      comment: The ID of the Sheet connected with the data source. The field cannot be changed once set. When creating a data source, an associated DATA_SOURCE sheet is also created, if the field is not specified, the ID of the created sheet will be randomly generated.
    - name: spec
      TYPE: STRUCT(DataSourceSpec)
      REQUIRED: false
      comment: The DataSourceSpec for the data source connected with this spreadsheet.
  DataSourceChartProperties:
    - name: dataExecutionStatus
      TYPE: STRUCT(DataExecutionStatus)
      REQUIRED: false
      READ_ONLY: true
      comment: Output only. The data execution status.
    - name: dataSourceId
      TYPE: STRING
      REQUIRED: false
      comment: ID of the data source that the chart is associated with.
  DataSourceColumn:
    - name: formula
      TYPE: STRING
      REQUIRED: false
      comment: The formula of the calculated column.
    - name: reference
      TYPE: STRUCT(DataSourceColumnReference)
      REQUIRED: false
      comment: The column reference.
  DataSourceColumnReference:
    - name: name
      TYPE: STRING
      REQUIRED: false
      comment: The display name of the column. It should be unique within a data source.
  DataSourceFormula:
    - name: dataExecutionStatus
      TYPE: STRUCT(DataExecutionStatus)
      REQUIRED: false
      READ_ONLY: true
      comment: Output only. The data execution status.
    - name: dataSourceId
      TYPE: STRING
      REQUIRED: false
      comment: The ID of the data source the formula is associated with.
  DataSourceObjectReference:
    - name: chartId
      TYPE: INT
      REQUIRED: false
      FORMAT: int32
      comment: References to a data source chart.
    - name: dataSourceFormulaCell
      TYPE: STRUCT(GridCoordinate)
      REQUIRED: false
      comment: References to a cell containing DataSourceFormula.
    - name: dataSourcePivotTableAnchorCell
      TYPE: STRUCT(GridCoordinate)
      REQUIRED: false
      comment: References to a data source PivotTable anchored at the cell.
    - name: dataSourceTableAnchorCell
      TYPE: STRUCT(GridCoordinate)
      REQUIRED: false
      comment: References to a DataSourceTable anchored at the cell.
    - name: sheetId
      TYPE: STRING
      REQUIRED: false
      comment: References to a DATA_SOURCE sheet.
  DataSourceObjectReferences:
    - name: references
      TYPE: "[]STRUCT(DataSourceObjectReference)"
      REQUIRED: false
      comment: The references.
  DataSourceParameter:
    - name: name
      TYPE: STRING
      REQUIRED: false
      comment: Named parameter. Must be a legitimate identifier for the DataSource that supports it. For example, [BigQuery identifier](https://cloud.google.com/bigquery/docs/reference/standard-sql/lexical#identifiers).
    - name: namedRangeId
      TYPE: STRING
      REQUIRED: false
      comment: ID of a NamedRange. Its size must be 1x1.
    - name: range
      TYPE: STRUCT(GridRange)
      REQUIRED: false
      comment: A range that contains the value of the parameter. Its size must be 1x1.
  DataSourceRefreshDailySchedule:
    - name: startTime
      TYPE: STRUCT(TimeOfDay)
      REQUIRED: false
      comment: The start time of a time interval in which a data source refresh is scheduled. Only `hours` part is used. The time interval size defaults to that in the Sheets editor.
  DataSourceRefreshMonthlySchedule:
    - name: daysOfMonth
      TYPE: "[]INT"
      REQUIRED: false
      comment: Days of the month to refresh. Only 1-28 are supported, mapping to the 1st to the 28th day. At least one day must be specified.
    - name: startTime
      TYPE: STRUCT(TimeOfDay)
      REQUIRED: false
      comment: The start time of a time interval in which a data source refresh is scheduled. Only `hours` part is used. The time interval size defaults to that in the Sheets editor.
  DataSourceRefreshSchedule:
    - name: dailySchedule
      TYPE: STRUCT(DataSourceRefreshDailySchedule)
      REQUIRED: false
      comment: Daily refresh schedule.
    - name: enabled
      TYPE: BOOL
      REQUIRED: false
      comment: True if the refresh schedule is enabled, or false otherwise.
    - name: monthlySchedule
      TYPE: STRUCT(DataSourceRefreshMonthlySchedule)
      REQUIRED: false
      comment: Monthly refresh schedule.
    - name: nextRun
      TYPE: STRUCT(Interval)
      REQUIRED: false
      READ_ONLY: true
      comment: Output only. The time interval of the next run.
    - name: refreshScope
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - DATA_SOURCE_REFRESH_SCOPE_UNSPECIFIED
        - ALL_DATA_SOURCES
      comment: The scope of the refresh. Must be ALL_DATA_SOURCES.
    - name: weeklySchedule
      TYPE: STRUCT(DataSourceRefreshWeeklySchedule)
      REQUIRED: false
      comment: Weekly refresh schedule.
  DataSourceRefreshWeeklySchedule:
    - name: daysOfWeek
      TYPE: "[]STRING"
      REQUIRED: false
      comment: Days of the week to refresh. At least one day must be specified.
    - name: startTime
      TYPE: STRUCT(TimeOfDay)
      REQUIRED: false
      comment: The start time of a time interval in which a data source refresh is scheduled. Only `hours` part is used. The time interval size defaults to that in the Sheets editor.
  DataSourceSheetDimensionRange:
    - name: columnReferences
      TYPE: "[]STRUCT(DataSourceColumnReference)"
      REQUIRED: false
      comment: The columns on the data source sheet.
    - name: sheetId
      TYPE: INT
      REQUIRED: false
      FORMAT: int32
      comment: The ID of the data source sheet the range is on.
  DataSourceSheetProperties:
    - name: columns
      TYPE: "[]STRUCT(DataSourceColumn)"
      REQUIRED: false
      comment: The columns displayed on the sheet, corresponding to the values in RowData.
    - name: dataExecutionStatus
      TYPE: STRUCT(DataExecutionStatus)
      REQUIRED: false
      comment: The data execution status.
    - name: dataSourceId
      TYPE: STRING
      REQUIRED: false
      comment: ID of the DataSource the sheet is connected to.
  DataSourceSpec:
    - name: parameters
      TYPE: "[]STRUCT(DataSourceParameter)"
      REQUIRED: false
      comment: The parameters of the data source, used when querying the data source.
    - name: bigQuery
      TYPE: STRUCT(BigQueryDataSourceSpec)
      REQUIRED: false
      comment: A BigQueryDataSourceSpec.
    - name: looker
      TYPE: STRUCT(LookerDataSourceSpec)
      REQUIRED: false
      comment: A LookerDatasourceSpec.
  DataSourceTable:
    - name: columnSelectionType
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - DATA_SOURCE_TABLE_COLUMN_SELECTION_TYPE_UNSPECIFIED
        - SELECTED
        - SYNC_ALL
      comment: The type to select columns for the data source table. Defaults to SELECTED.
    - name: columns
      TYPE: "[]STRUCT(DataSourceColumnReference)"
      REQUIRED: false
      comment: Columns selected for the data source table. The column_selection_type must be SELECTED.
    - name: dataExecutionStatus
      TYPE: STRUCT(DataExecutionStatus)
      REQUIRED: false
      READ_ONLY: true
      comment: Output only. The data execution status.
    - name: dataSourceId
      TYPE: STRING
      REQUIRED: false
      comment: The ID of the data source the data source table is associated with.
    - name: filterSpecs
      TYPE: "[]STRUCT(FilterSpec)"
      REQUIRED: false
      comment: Filter specifications in the data source table.
    - name: rowLimit
      TYPE: INT
      REQUIRED: false
      FORMAT: int32
      comment: The limit of rows to return. If not set, a default limit is applied. Please refer to the Sheets editor for the default and max limit.
    - name: sortSpecs
      TYPE: "[]STRUCT(SortSpec)"
      REQUIRED: false
      comment: Sort specifications in the data source table. The result of the data source table is sorted based on the sort specifications in order.
  DataValidationRule:
    - name: condition
      TYPE: STRUCT(BooleanCondition)
      REQUIRED: false
      comment: The condition that data in the cell must match.
    - name: inputMessage
      TYPE: STRING
      REQUIRED: false
      comment: A message to show the user when adding data to the cell.
    - name: showCustomUi
      TYPE: BOOL
      REQUIRED: false
      comment: True if the UI should be customized based on the kind of condition. If true, "List" conditions will show a dropdown.
    - name: strict
      TYPE: BOOL
      REQUIRED: false
      comment: True if invalid data should be rejected.
  DateTimeRule:
    - name: type
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - DATE_TIME_RULE_TYPE_UNSPECIFIED
        - SECOND
        - MINUTE
        - HOUR
        - HOUR_MINUTE
        - HOUR_MINUTE_AMPM
        - DAY_OF_WEEK
        - DAY_OF_YEAR
        - DAY_OF_MONTH
        - DAY_MONTH
        - MONTH
        - QUARTER
        - YEAR
        - YEAR_MONTH
        - YEAR_QUARTER
        - YEAR_MONTH_DAY
      comment: The type of date-time grouping to apply.
  DeleteBandingRequest:
    - name: bandedRangeId
      TYPE: INT
      REQUIRED: false
      FORMAT: int32
      comment: The ID of the banded range to delete.
  DeleteConditionalFormatRuleRequest:
    - name: index
      TYPE: INT
      REQUIRED: false
      FORMAT: int32
      comment: The zero-based index of the rule to be deleted.
    - name: sheetId
      TYPE: INT
      REQUIRED: false
      FORMAT: int32
      comment: The sheet the rule is being deleted from.
  DeleteConditionalFormatRuleResponse:
    - name: rule
      TYPE: STRUCT(ConditionalFormatRule)
      REQUIRED: false
      comment: The rule that was deleted.
  DeleteDataSourceRequest:
    - name: dataSourceId
      TYPE: STRING
      REQUIRED: false
      comment: The ID of the data source to delete.
  DeleteDeveloperMetadataRequest:
    - name: dataFilter
      TYPE: STRUCT(DataFilter)
      REQUIRED: false
      comment: The data filter describing the criteria used to select which developer metadata entry to delete.
  DeleteDeveloperMetadataResponse:
    - name: deletedDeveloperMetadata
      TYPE: "[]STRUCT(DeveloperMetadata)"
      REQUIRED: false
      comment: The metadata that was deleted.
  DeleteDimensionGroupRequest:
    - name: range
      TYPE: STRUCT(DimensionRange)
      REQUIRED: false
      comment: The range of the group to be deleted.
  DeleteDimensionGroupResponse:
    - name: dimensionGroups
      TYPE: "[]STRUCT(DimensionGroup)"
      REQUIRED: false
      comment: All groups of a dimension after deleting a group from that dimension.
  DeleteDimensionRequest:
    - name: range
      TYPE: STRUCT(DimensionRange)
      REQUIRED: false
      comment: The dimensions to delete from the sheet.
  DeleteDuplicatesRequest:
    - name: comparisonColumns
      TYPE: "[]STRUCT(DimensionRange)"
      REQUIRED: false
      comment: The columns in the range to analyze for duplicate values. If no columns are selected then all columns are analyzed for duplicates.
    - name: range
      TYPE: STRUCT(GridRange)
      REQUIRED: false
      comment: The range to remove duplicates rows from.
  DeleteDuplicatesResponse:
    - name: duplicatesRemovedCount
      TYPE: INT
      REQUIRED: false
      FORMAT: int32
      comment: The number of duplicate rows removed.
  DeleteEmbeddedObjectRequest:
    - name: objectId
      TYPE: INT
      REQUIRED: false
      FORMAT: int32
      comment: The ID of the embedded object to delete.
  DeleteFilterViewRequest:
    - name: filterId
      TYPE: INT
      REQUIRED: false
      FORMAT: int32
      comment: The ID of the filter to delete.
  DeleteNamedRangeRequest:
    - name: namedRangeId
      TYPE: STRING
      REQUIRED: false
      comment: The ID of the named range to delete.
  DeleteProtectedRangeRequest:
    - name: protectedRangeId
      TYPE: INT
      REQUIRED: false
      FORMAT: int32
      comment: The ID of the protected range to delete.
  DeleteRangeRequest:
    - name: range
      TYPE: STRUCT(GridRange)
      REQUIRED: false
      comment: The range of cells to delete.
    - name: shiftDimension
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - DIMENSION_UNSPECIFIED
        - ROWS
        - COLUMNS
      comment: The dimension from which deleted cells will be replaced with. If ROWS, existing cells will be shifted upward to replace the deleted cells. If COLUMNS, existing cells will be shifted left to replace the deleted cells.
  DeleteSheetRequest:
    - name: sheetId
      TYPE: INT
      REQUIRED: false
      FORMAT: int32
      comment: The ID of the sheet to delete. If the sheet is of DATA_SOURCE type, the associated DataSource is also deleted.
  DeleteTableRequest:
    - name: tableId
      TYPE: STRING
      REQUIRED: false
      comment: The ID of the table to delete.
  DeveloperMetadata:
    - name: location
      TYPE: STRUCT(DeveloperMetadataLocation)
      REQUIRED: false
      comment: The location where the metadata is associated.
    - name: metadataId
      TYPE: INT
      REQUIRED: false
      FORMAT: int32
      comment: The spreadsheet-scoped unique ID that identifies the metadata. IDs may be specified when metadata is created, otherwise one will be randomly generated and assigned. Must be positive.
    - name: metadataKey
      TYPE: STRING
      REQUIRED: false
      comment: The metadata key. There may be multiple metadata in a spreadsheet with the same key. Developer metadata must always have a key specified.
    - name: metadataValue
      TYPE: STRING
      REQUIRED: false
      comment: Data associated with the metadata's key.
    - name: visibility
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - DEVELOPER_METADATA_VISIBILITY_UNSPECIFIED
        - DOCUMENT
        - PROJECT
      comment: The metadata visibility. Developer metadata must always have visibility specified.
  DeveloperMetadataLocation:
    - name: dimensionRange
      TYPE: STRUCT(DimensionRange)
      REQUIRED: false
      comment: Represents the row or column when metadata is associated with a dimension. The specified DimensionRange must represent a single row or column. It cannot be unbounded or span multiple rows or columns.
    - name: locationType
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - DEVELOPER_METADATA_LOCATION_TYPE_UNSPECIFIED
        - ROW
        - COLUMN
        - SHEET
        - SPREADSHEET
      comment: The type of location this object represents. This field is read-only.
    - name: sheetId
      TYPE: INT
      REQUIRED: false
      FORMAT: int32
      comment: The ID of the sheet when metadata is associated with an entire sheet.
    - name: spreadsheet
      TYPE: BOOL
      REQUIRED: false
      comment: True when metadata is associated with an entire spreadsheet.
  DeveloperMetadataLookup:
    - name: locationMatchingStrategy
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - DEVELOPER_METADATA_LOCATION_MATCHING_STRATEGY_UNSPECIFIED
        - EXACT_LOCATION
        - INTERSECTING_LOCATION
      comment: Determines how this lookup matches the location. If this field is specified as EXACT, only developer metadata associated on the exact location specified is matched. If this field is specified to INTERSECTING, developer metadata associated on intersecting locations is also matched. If left unspecified, this field assumes a default value of INTERSECTING. If this field is specified, a metadataLocation must also be specified.
    - name: locationType
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - DEVELOPER_METADATA_LOCATION_TYPE_UNSPECIFIED
        - ROW
        - COLUMN
        - SHEET
        - SPREADSHEET
      comment: Limits the selected developer metadata to those entries which are associated with locations of the specified type. For example, when this field is specified as ROW this lookup only considers developer metadata associated on rows. If the field is left unspecified, all location types are considered. This field cannot be specified as SPREADSHEET when the locationMatchingStrategy is specified as INTERSECTING or when the metadataLocation is specified as a non-spreadsheet location. Spreadsheet metadata cannot intersect any other developer metadata location. This field also must be left unspecified when the locationMatchingStrategy is specified as EXACT.
    - name: metadataId
      TYPE: INT
      REQUIRED: false
      FORMAT: int32
      comment: Limits the selected developer metadata to that which has a matching DeveloperMetadata.metadata_id.
    - name: metadataKey
      TYPE: STRING
      REQUIRED: false
      comment: Limits the selected developer metadata to that which has a matching DeveloperMetadata.metadata_key.
    - name: metadataLocation
      TYPE: STRUCT(DeveloperMetadataLocation)
      REQUIRED: false
      comment: Limits the selected developer metadata to those entries associated with the specified location. This field either matches exact locations or all intersecting locations according the specified locationMatchingStrategy.
    - name: metadataValue
      TYPE: STRING
      REQUIRED: false
      comment: Limits the selected developer metadata to that which has a matching DeveloperMetadata.metadata_value.
    - name: visibility
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - DEVELOPER_METADATA_VISIBILITY_UNSPECIFIED
        - DOCUMENT
        - PROJECT
      comment: Limits the selected developer metadata to that which has a matching DeveloperMetadata.visibility. If left unspecified, all developer metadata visible to the requesting project is considered.
  DimensionGroup:
    - name: collapsed
      TYPE: BOOL
      REQUIRED: false
      comment: This field is true if this group is collapsed. A collapsed group remains collapsed if an overlapping group at a shallower depth is expanded. A true value does not imply that all dimensions within the group are hidden, since a dimension's visibility can change independently from this group property. However, when this property is updated, all dimensions within it are set to hidden if this field is true, or set to visible if this field is false.
    - name: depth
      TYPE: INT
      REQUIRED: false
      FORMAT: int32
      comment: The depth of the group, representing how many groups have a range that wholly contains the range of this group.
    - name: range
      TYPE: STRUCT(DimensionRange)
      REQUIRED: false
      comment: The range over which this group exists.
  DimensionProperties:
    - name: dataSourceColumnReference
      TYPE: STRUCT(DataSourceColumnReference)
      REQUIRED: false
      READ_ONLY: true
      comment: Output only. If set, this is a column in a data source sheet.
    - name: developerMetadata
      TYPE: "[]STRUCT(DeveloperMetadata)"
      REQUIRED: false
      comment: The developer metadata associated with a single row or column.
    - name: hiddenByFilter
      TYPE: BOOL
      REQUIRED: false
      comment: True if this dimension is being filtered. This field is read-only.
    - name: hiddenByUser
      TYPE: BOOL
      REQUIRED: false
      comment: True if this dimension is explicitly hidden.
    - name: pixelSize
      TYPE: INT
      REQUIRED: false
      FORMAT: int32
      comment: The height (if a row) or width (if a column) of the dimension in pixels.
  DimensionRange:
    - name: dimension
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - DIMENSION_UNSPECIFIED
        - ROWS
        - COLUMNS
      comment: The dimension of the span.
    - name: endIndex
      TYPE: INT
      REQUIRED: false
      FORMAT: int32
      comment: The end (exclusive) of the span, or not set if unbounded.
    - name: sheetId
      TYPE: INT
      REQUIRED: false
      FORMAT: int32
      comment: The sheet this span is on.
    - name: startIndex
      TYPE: INT
      REQUIRED: false
      FORMAT: int32
      comment: The start (inclusive) of the span, or not set if unbounded.
  DuplicateFilterViewRequest:
    - name: filterId
      TYPE: INT
      REQUIRED: false
      FORMAT: int32
      comment: The ID of the filter being duplicated.
  DuplicateFilterViewResponse:
    - name: filter
      TYPE: STRUCT(FilterView)
      REQUIRED: false
      comment: The newly created filter.
  DuplicateSheetRequest:
    - name: insertSheetIndex
      TYPE: INT
      REQUIRED: false
      FORMAT: int32
      comment: The zero-based index where the new sheet should be inserted. The index of all sheets after this are incremented.
    - name: newSheetId
      TYPE: INT
      REQUIRED: false
      FORMAT: int32
      comment: If set, the ID of the new sheet. If not set, an ID is chosen. If set, the ID must not conflict with any existing sheet ID. If set, it must be non-negative.
    - name: newSheetName
      TYPE: STRING
      REQUIRED: false
      comment: The name of the new sheet. If empty, a new name is chosen for you.
    - name: sourceSheetId
      TYPE: INT
      REQUIRED: false
      FORMAT: int32
      comment: The sheet to duplicate. If the source sheet is of DATA_SOURCE type, its backing DataSource is also duplicated and associated with the new copy of the sheet. No data execution is triggered, the grid data of this sheet is also copied over but only available after the batch request completes.
  DuplicateSheetResponse:
    - name: properties
      TYPE: STRUCT(SheetProperties)
      REQUIRED: false
      comment: The properties of the duplicate sheet.
  Editors:
    - name: domainUsersCanEdit
      TYPE: BOOL
      REQUIRED: false
      comment: True if anyone in the document's domain has edit access to the protected range. Domain protection is only supported on documents within a domain.
    - name: groups
      TYPE: "[]STRING"
      REQUIRED: false
      comment: The email addresses of groups with edit access to the protected range.
    - name: users
      TYPE: "[]STRING"
      REQUIRED: false
      comment: The email addresses of users with edit access to the protected range.
  EmbeddedChart:
    - name: border
      TYPE: STRUCT(EmbeddedObjectBorder)
      REQUIRED: false
      comment: The border of the chart.
    - name: chartId
      TYPE: INT
      REQUIRED: false
      FORMAT: int32
      comment: The ID of the chart.
    - name: position
      TYPE: STRUCT(EmbeddedObjectPosition)
      REQUIRED: false
      comment: The position of the chart.
    - name: spec
      TYPE: STRUCT(ChartSpec)
      REQUIRED: false
      comment: The specification of the chart.
  EmbeddedObjectBorder:
    - name: color
      TYPE: STRUCT(Color)
      REQUIRED: false
      DEPRECATED: true
      comment: "The color of the border. Deprecated: Use color_style."
    - name: colorStyle
      TYPE: STRUCT(ColorStyle)
      REQUIRED: false
      comment: The color of the border. If color is also set, this field takes precedence.
  EmbeddedObjectPosition:
    - name: newSheet
      TYPE: BOOL
      REQUIRED: false
      comment: If true, the embedded object is put on a new sheet whose ID is chosen for you. Used only when writing.
    - name: overlayPosition
      TYPE: STRUCT(OverlayPosition)
      REQUIRED: false
      comment: The position at which the object is overlaid on top of a grid.
    - name: sheetId
      TYPE: INT
      REQUIRED: false
      FORMAT: int32
      comment: The sheet this is on. Set only if the embedded object is on its own sheet. Must be non-negative.
  ErrorValue:
    - name: message
      TYPE: STRING
      REQUIRED: false
      comment: A message with more information about the error (in the spreadsheet's locale).
    - name: type
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - ERROR_TYPE_UNSPECIFIED
        - ERROR
        - NULL_VALUE
        - DIVIDE_BY_ZERO
        - VALUE
        - REF
        - NAME
        - NUM
        - N_A
        - LOADING
      comment: The type of error.
  ExtendedValue:
    - name: boolValue
      TYPE: BOOL
      REQUIRED: false
      comment: Represents a boolean value.
    - name: errorValue
      TYPE: STRUCT(ErrorValue)
      REQUIRED: false
      comment: Represents an error. This field is read-only.
    - name: formulaValue
      TYPE: STRING
      REQUIRED: false
      comment: Represents a formula.
    - name: numberValue
      TYPE: FLOAT
      REQUIRED: false
      FORMAT: double
      comment: "Represents a double value. Note: Dates, Times and DateTimes are represented as doubles in SERIAL_NUMBER format."
    - name: stringValue
      TYPE: STRING
      REQUIRED: false
      comment: Represents a string value. Leading single quotes are not included. For example, if the user typed `'123` into the UI, this would be represented as a `stringValue` of `"123"`.
  FilterCriteria:
    - name: condition
      TYPE: STRUCT(BooleanCondition)
      REQUIRED: false
      comment: A condition that must be `true` for values to be shown. (This does not override hidden_values -- if a value is listed there, it will still be hidden.)
    - name: hiddenValues
      TYPE: "[]STRING"
      REQUIRED: false
      comment: Values that should be hidden.
    - name: visibleBackgroundColor
      TYPE: STRUCT(Color)
      REQUIRED: false
      DEPRECATED: true
      comment: "The background fill color to filter by; only cells with this fill color are shown. Mutually exclusive with visible_foreground_color. Deprecated: Use visible_background_color_style."
    - name: visibleBackgroundColorStyle
      TYPE: STRUCT(ColorStyle)
      REQUIRED: false
      comment: The background fill color to filter by; only cells with this fill color are shown. This field is mutually exclusive with visible_foreground_color, and must be set to an RGB-type color. If visible_background_color is also set, this field takes precedence.
    - name: visibleForegroundColor
      TYPE: STRUCT(Color)
      REQUIRED: false
      DEPRECATED: true
      comment: "The foreground color to filter by; only cells with this foreground color are shown. Mutually exclusive with visible_background_color. Deprecated: Use visible_foreground_color_style."
    - name: visibleForegroundColorStyle
      TYPE: STRUCT(ColorStyle)
      REQUIRED: false
      comment: The foreground color to filter by; only cells with this foreground color are shown. This field is mutually exclusive with visible_background_color, and must be set to an RGB-type color. If visible_foreground_color is also set, this field takes precedence.
  FilterSpec:
    - name: columnIndex
      TYPE: INT
      REQUIRED: false
      FORMAT: int32
      comment: The zero-based column index.
    - name: dataSourceColumnReference
      TYPE: STRUCT(DataSourceColumnReference)
      REQUIRED: false
      comment: Reference to a data source column.
    - name: filterCriteria
      TYPE: STRUCT(FilterCriteria)
      REQUIRED: false
      comment: The criteria for the column.
  FilterView:
    - name: criteria
      TYPE: map[STRING]ANY
      REQUIRED: false
      DEPRECATED: true
      comment: The criteria for showing/hiding values per column. The map's key is the column index, and the value is the criteria for that column. This field is deprecated in favor of filter_specs.
    - name: filterSpecs
      TYPE: "[]STRUCT(FilterSpec)"
      REQUIRED: false
      comment: The filter criteria for showing or hiding values per column. Both criteria and filter_specs are populated in responses. If both fields are specified in an update request, this field takes precedence.
    - name: filterViewId
      TYPE: INT
      REQUIRED: false
      FORMAT: int32
      comment: The ID of the filter view.
    - name: namedRangeId
      TYPE: STRING
      REQUIRED: false
      comment: The named range this filter view is backed by, if any. When writing, only one of range, named_range_id, or table_id may be set.
    - name: range
      TYPE: STRUCT(GridRange)
      REQUIRED: false
      comment: The range this filter view covers. When writing, only one of range, named_range_id, or table_id may be set.
    - name: sortSpecs
      TYPE: "[]STRUCT(SortSpec)"
      REQUIRED: false
      comment: The sort order per column. Later specifications are used when values are equal in the earlier specifications.
    - name: tableId
      TYPE: STRING
      REQUIRED: false
      comment: The table this filter view is backed by, if any. When writing, only one of range, named_range_id, or table_id may be set.
    - name: title
      TYPE: STRING
      REQUIRED: false
      comment: The name of the filter view.
  FindReplaceRequest:
    - name: allSheets
      TYPE: BOOL
      REQUIRED: false
      comment: True to find/replace over all sheets.
    - name: find
      TYPE: STRING
      REQUIRED: false
      comment: The value to search.
    - name: includeFormulas
      TYPE: BOOL
      REQUIRED: false
      comment: True if the search should include cells with formulas. False to skip cells with formulas.
    - name: matchCase
      TYPE: BOOL
      REQUIRED: false
      comment: True if the search is case sensitive.
    - name: matchEntireCell
      TYPE: BOOL
      REQUIRED: false
      comment: True if the find value should match the entire cell.
    - name: range
      TYPE: STRUCT(GridRange)
      REQUIRED: false
      comment: The range to find/replace over.
    - name: replacement
      TYPE: STRING
      REQUIRED: false
      comment: The value to use as the replacement.
    - name: searchByRegex
      TYPE: BOOL
      REQUIRED: false
      comment: True if the find value is a regex. The regular expression and replacement should follow Java regex rules at https://docs.oracle.com/javase/8/docs/api/java/util/regex/Pattern.html. The replacement string is allowed to refer to capturing groups. For example, if one cell has the contents `"Google Sheets"` and another has `"Google Docs"`, then searching for `"o.* (.*)"` with a replacement of `"$1 Rocks"` would change the contents of the cells to `"GSheets Rocks"` and `"GDocs Rocks"` respectively.
    - name: sheetId
      TYPE: INT
      REQUIRED: false
      FORMAT: int32
      comment: The sheet to find/replace over.
  FindReplaceResponse:
    - name: formulasChanged
      TYPE: INT
      REQUIRED: false
      FORMAT: int32
      comment: The number of formula cells changed.
    - name: occurrencesChanged
      TYPE: INT
      REQUIRED: false
      FORMAT: int32
      comment: The number of occurrences (possibly multiple within a cell) changed. For example, if replacing `"e"` with `"o"` in `"Google Sheets"`, this would be `"3"` because `"Google Sheets"` -> `"Googlo Shoots"`.
    - name: rowsChanged
      TYPE: INT
      REQUIRED: false
      FORMAT: int32
      comment: The number of rows changed.
    - name: sheetsChanged
      TYPE: INT
      REQUIRED: false
      FORMAT: int32
      comment: The number of sheets changed.
    - name: valuesChanged
      TYPE: INT
      REQUIRED: false
      FORMAT: int32
      comment: The number of non-formula cells changed.
  GetSpreadsheetByDataFilterRequest:
    - name: dataFilters
      TYPE: "[]STRUCT(DataFilter)"
      REQUIRED: false
      comment: The DataFilters used to select which ranges to retrieve from the spreadsheet.
    - name: excludeTablesInBandedRanges
      TYPE: BOOL
      REQUIRED: false
      comment: True if tables should be excluded in the banded ranges. False if not set.
    - name: includeGridData
      TYPE: BOOL
      REQUIRED: false
      comment: True if grid data should be returned. This parameter is ignored if a field mask was set in the request.
  GradientRule:
    - name: maxpoint
      TYPE: STRUCT(InterpolationPoint)
      REQUIRED: false
      comment: The final interpolation point.
    - name: midpoint
      TYPE: STRUCT(InterpolationPoint)
      REQUIRED: false
      comment: An optional midway interpolation point.
    - name: minpoint
      TYPE: STRUCT(InterpolationPoint)
      REQUIRED: false
      comment: The starting interpolation point.
  GridCoordinate:
    - name: columnIndex
      TYPE: INT
      REQUIRED: false
      FORMAT: int32
      comment: The column index of the coordinate.
    - name: rowIndex
      TYPE: INT
      REQUIRED: false
      FORMAT: int32
      comment: The row index of the coordinate.
    - name: sheetId
      TYPE: INT
      REQUIRED: false
      FORMAT: int32
      comment: The sheet this coordinate is on.
  GridData:
    - name: columnMetadata
      TYPE: "[]STRUCT(DimensionProperties)"
      REQUIRED: false
      comment: Metadata about the requested columns in the grid, starting with the column in start_column.
    - name: rowData
      TYPE: "[]STRUCT(RowData)"
      REQUIRED: false
      comment: The data in the grid, one entry per row, starting with the row in startRow. The values in RowData will correspond to columns starting at start_column.
    - name: rowMetadata
      TYPE: "[]STRUCT(DimensionProperties)"
      REQUIRED: false
      comment: Metadata about the requested rows in the grid, starting with the row in start_row.
    - name: startColumn
      TYPE: INT
      REQUIRED: false
      FORMAT: int32
      comment: The first column this GridData refers to, zero-based.
    - name: startRow
      TYPE: INT
      REQUIRED: false
      FORMAT: int32
      comment: The first row this GridData refers to, zero-based.
  GridProperties:
    - name: columnCount
      TYPE: INT
      REQUIRED: false
      FORMAT: int32
      comment: The number of columns in the grid.
    - name: columnGroupControlAfter
      TYPE: BOOL
      REQUIRED: false
      comment: True if the column grouping control toggle is shown after the group.
    - name: frozenColumnCount
      TYPE: INT
      REQUIRED: false
      FORMAT: int32
      comment: The number of columns that are frozen in the grid.
    - name: frozenRowCount
      TYPE: INT
      REQUIRED: false
      FORMAT: int32
      comment: The number of rows that are frozen in the grid.
    - name: hideGridlines
      TYPE: BOOL
      REQUIRED: false
      comment: True if the grid isn't showing gridlines in the UI.
    - name: rowCount
      TYPE: INT
      REQUIRED: false
      FORMAT: int32
      comment: The number of rows in the grid.
    - name: rowGroupControlAfter
      TYPE: BOOL
      REQUIRED: false
      comment: True if the row grouping control toggle is shown after the group.
  GridRange:
    - name: endColumnIndex
      TYPE: INT
      REQUIRED: false
      FORMAT: int32
      comment: The end column (exclusive) of the range, or not set if unbounded.
    - name: endRowIndex
      TYPE: INT
      REQUIRED: false
      FORMAT: int32
      comment: The end row (exclusive) of the range, or not set if unbounded.
    - name: sheetId
      TYPE: INT
      REQUIRED: false
      FORMAT: int32
      comment: The sheet this range is on.
    - name: startColumnIndex
      TYPE: INT
      REQUIRED: false
      FORMAT: int32
      comment: The start column (inclusive) of the range, or not set if unbounded.
    - name: startRowIndex
      TYPE: INT
      REQUIRED: false
      FORMAT: int32
      comment: The start row (inclusive) of the range, or not set if unbounded.
  HistogramChartSpec:
    - name: bucketSize
      TYPE: FLOAT
      REQUIRED: false
      FORMAT: double
      comment: By default the bucket size (the range of values stacked in a single column) is chosen automatically, but it may be overridden here. E.g., A bucket size of 1.5 results in buckets from 0 - 1.5, 1.5 - 3.0, etc. Cannot be negative. This field is optional.
    - name: legendPosition
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - HISTOGRAM_CHART_LEGEND_POSITION_UNSPECIFIED
        - BOTTOM_LEGEND
        - LEFT_LEGEND
        - RIGHT_LEGEND
        - TOP_LEGEND
        - NO_LEGEND
        - INSIDE_LEGEND
      comment: The position of the chart legend.
    - name: outlierPercentile
      TYPE: FLOAT
      REQUIRED: false
      FORMAT: double
      comment: The outlier percentile is used to ensure that outliers do not adversely affect the calculation of bucket sizes. For example, setting an outlier percentile of 0.05 indicates that the top and bottom 5% of values when calculating buckets. The values are still included in the chart, they will be added to the first or last buckets instead of their own buckets. Must be between 0.0 and 0.5.
    - name: series
      TYPE: "[]STRUCT(HistogramSeries)"
      REQUIRED: false
      comment: The series for a histogram may be either a single series of values to be bucketed or multiple series, each of the same length, containing the name of the series followed by the values to be bucketed for that series.
    - name: showItemDividers
      TYPE: BOOL
      REQUIRED: false
      comment: Whether horizontal divider lines should be displayed between items in each column.
  HistogramRule:
    - name: end
      TYPE: FLOAT
      REQUIRED: false
      FORMAT: double
      comment: The maximum value at which items are placed into buckets of constant size. Values above end are lumped into a single bucket. This field is optional.
    - name: interval
      TYPE: FLOAT
      REQUIRED: false
      FORMAT: double
      comment: The size of the buckets that are created. Must be positive.
    - name: start
      TYPE: FLOAT
      REQUIRED: false
      FORMAT: double
      comment: The minimum value at which items are placed into buckets of constant size. Values below start are lumped into a single bucket. This field is optional.
  HistogramSeries:
    - name: barColor
      TYPE: STRUCT(Color)
      REQUIRED: false
      DEPRECATED: true
      comment: "The color of the column representing this series in each bucket. This field is optional. Deprecated: Use bar_color_style."
    - name: barColorStyle
      TYPE: STRUCT(ColorStyle)
      REQUIRED: false
      comment: The color of the column representing this series in each bucket. This field is optional. If bar_color is also set, this field takes precedence.
    - name: data
      TYPE: STRUCT(ChartData)
      REQUIRED: false
      comment: The data for this histogram series.
  InsertDimensionRequest:
    - name: inheritFromBefore
      TYPE: BOOL
      REQUIRED: false
      comment: Whether dimension properties should be extended from the dimensions before or after the newly inserted dimensions. True to inherit from the dimensions before (in which case the start index must be greater than 0), and false to inherit from the dimensions after. For example, if row index 0 has red background and row index 1 has a green background, then inserting 2 rows at index 1 can inherit either the green or red background. If `inheritFromBefore` is true, the two new rows will be red (because the row before the insertion point was red), whereas if `inheritFromBefore` is false, the two new rows will be green (because the row after the insertion point was green).
    - name: range
      TYPE: STRUCT(DimensionRange)
      REQUIRED: false
      comment: The dimensions to insert. Both the start and end indexes must be bounded.
  InsertRangeRequest:
    - name: range
      TYPE: STRUCT(GridRange)
      REQUIRED: false
      comment: The range to insert new cells into. The range is constrained to the current sheet boundaries.
    - name: shiftDimension
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - DIMENSION_UNSPECIFIED
        - ROWS
        - COLUMNS
      comment: The dimension which will be shifted when inserting cells. If ROWS, existing cells will be shifted down. If COLUMNS, existing cells will be shifted right.
  InterpolationPoint:
    - name: color
      TYPE: STRUCT(Color)
      REQUIRED: false
      DEPRECATED: true
      comment: "The color this interpolation point should use. Deprecated: Use color_style."
    - name: colorStyle
      TYPE: STRUCT(ColorStyle)
      REQUIRED: false
      comment: The color this interpolation point should use. If color is also set, this field takes precedence.
    - name: type
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - INTERPOLATION_POINT_TYPE_UNSPECIFIED
        - MIN
        - MAX
        - NUMBER
        - PERCENT
        - PERCENTILE
      comment: How the value should be interpreted.
    - name: value
      TYPE: STRING
      REQUIRED: false
      comment: The value this interpolation point uses. May be a formula. Unused if type is MIN or MAX.
  Interval:
    - name: endTime
      TYPE: STRING
      REQUIRED: false
      FORMAT: google-datetime
      comment: Optional. Exclusive end of the interval. If specified, a Timestamp matching this interval will have to be before the end.
    - name: startTime
      TYPE: STRING
      REQUIRED: false
      FORMAT: google-datetime
      comment: Optional. Inclusive start of the interval. If specified, a Timestamp matching this interval will have to be the same or after the start.
  IterativeCalculationSettings:
    - name: convergenceThreshold
      TYPE: FLOAT
      REQUIRED: false
      FORMAT: double
      comment: When iterative calculation is enabled and successive results differ by less than this threshold value, the calculation rounds stop.
    - name: maxIterations
      TYPE: INT
      REQUIRED: false
      FORMAT: int32
      comment: When iterative calculation is enabled, the maximum number of calculation rounds to perform.
  KeyValueFormat:
    - name: position
      TYPE: STRUCT(TextPosition)
      REQUIRED: false
      comment: Specifies the horizontal text positioning of key value. This field is optional. If not specified, default positioning is used.
    - name: textFormat
      TYPE: STRUCT(TextFormat)
      REQUIRED: false
      comment: Text formatting options for key value. The link field is not supported.
  LineStyle:
    - name: type
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - LINE_DASH_TYPE_UNSPECIFIED
        - INVISIBLE
        - CUSTOM
        - SOLID
        - DOTTED
        - MEDIUM_DASHED
        - MEDIUM_DASHED_DOTTED
        - LONG_DASHED
        - LONG_DASHED_DOTTED
      comment: The dash type of the line.
    - name: width
      TYPE: INT
      REQUIRED: false
      FORMAT: int32
      comment: The thickness of the line, in px.
  Link:
    - name: uri
      TYPE: STRING
      REQUIRED: false
      comment: The link identifier.
  LookerDataSourceSpec:
    - name: explore
      TYPE: STRING
      REQUIRED: false
      comment: Name of a Looker model explore.
    - name: instanceUri
      TYPE: STRING
      REQUIRED: false
      comment: A Looker instance URL.
    - name: model
      TYPE: STRING
      REQUIRED: false
      comment: Name of a Looker model.
  ManualRule:
    - name: groups
      TYPE: "[]STRUCT(ManualRuleGroup)"
      REQUIRED: false
      comment: The list of group names and the corresponding items from the source data that map to each group name.
  ManualRuleGroup:
    - name: groupName
      TYPE: STRUCT(ExtendedValue)
      REQUIRED: false
      comment: The group name, which must be a string. Each group in a given ManualRule must have a unique group name.
    - name: items
      TYPE: "[]STRUCT(ExtendedValue)"
      REQUIRED: false
      comment: The items in the source data that should be placed into this group. Each item may be a string, number, or boolean. Items may appear in at most one group within a given ManualRule. Items that do not appear in any group will appear on their own.
  MatchedDeveloperMetadata:
    - name: dataFilters
      TYPE: "[]STRUCT(DataFilter)"
      REQUIRED: false
      comment: All filters matching the returned developer metadata.
    - name: developerMetadata
      TYPE: STRUCT(DeveloperMetadata)
      REQUIRED: false
      comment: The developer metadata matching the specified filters.
  MatchedValueRange:
    - name: dataFilters
      TYPE: "[]STRUCT(DataFilter)"
      REQUIRED: false
      comment: The DataFilters from the request that matched the range of values.
    - name: valueRange
      TYPE: STRUCT(ValueRange)
      REQUIRED: false
      comment: The values matched by the DataFilter.
  MergeCellsRequest:
    - name: mergeType
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - MERGE_ALL
        - MERGE_COLUMNS
        - MERGE_ROWS
      comment: How the cells should be merged.
    - name: range
      TYPE: STRUCT(GridRange)
      REQUIRED: false
      comment: The range of cells to merge.
  MoveDimensionRequest:
    - name: destinationIndex
      TYPE: INT
      REQUIRED: false
      FORMAT: int32
      comment: The zero-based start index of where to move the source data to, based on the coordinates *before* the source data is removed from the grid. Existing data will be shifted down or right (depending on the dimension) to make room for the moved dimensions. The source dimensions are removed from the grid, so the the data may end up in a different index than specified. For example, given `A1..A5` of `0, 1, 2, 3, 4` and wanting to move `"1"` and `"2"` to between `"3"` and `"4"`, the source would be `ROWS [1..3)`,and the destination index would be `"4"` (the zero-based index of row 5). The end result would be `A1..A5` of `0, 3, 1, 2, 4`.
    - name: source
      TYPE: STRUCT(DimensionRange)
      REQUIRED: false
      comment: The source dimensions to move.
  NamedRange:
    - name: name
      TYPE: STRING
      REQUIRED: false
      comment: The name of the named range.
    - name: namedRangeId
      TYPE: STRING
      REQUIRED: false
      comment: The ID of the named range.
    - name: range
      TYPE: STRUCT(GridRange)
      REQUIRED: false
      comment: The range this represents.
  NumberFormat:
    - name: pattern
      TYPE: STRING
      REQUIRED: false
      comment: Pattern string used for formatting. If not set, a default pattern based on the spreadsheet's locale will be used if necessary for the given type. See the [Date and Number Formats guide](https://developers.google.com/workspace/sheets/api/guides/formats) for more information about the supported patterns.
    - name: type
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - NUMBER_FORMAT_TYPE_UNSPECIFIED
        - TEXT
        - NUMBER
        - PERCENT
        - CURRENCY
        - DATE
        - TIME
        - DATE_TIME
        - SCIENTIFIC
      comment: The type of the number format. When writing, this field must be set.
  OrgChartSpec:
    - name: labels
      TYPE: STRUCT(ChartData)
      REQUIRED: false
      comment: The data containing the labels for all the nodes in the chart. Labels must be unique.
    - name: nodeColor
      TYPE: STRUCT(Color)
      REQUIRED: false
      DEPRECATED: true
      comment: "The color of the org chart nodes. Deprecated: Use node_color_style."
    - name: nodeColorStyle
      TYPE: STRUCT(ColorStyle)
      REQUIRED: false
      comment: The color of the org chart nodes. If node_color is also set, this field takes precedence.
    - name: nodeSize
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - ORG_CHART_LABEL_SIZE_UNSPECIFIED
        - SMALL
        - MEDIUM
        - LARGE
      comment: The size of the org chart nodes.
    - name: parentLabels
      TYPE: STRUCT(ChartData)
      REQUIRED: false
      comment: The data containing the label of the parent for the corresponding node. A blank value indicates that the node has no parent and is a top-level node. This field is optional.
    - name: selectedNodeColor
      TYPE: STRUCT(Color)
      REQUIRED: false
      DEPRECATED: true
      comment: "The color of the selected org chart nodes. Deprecated: Use selected_node_color_style."
    - name: selectedNodeColorStyle
      TYPE: STRUCT(ColorStyle)
      REQUIRED: false
      comment: The color of the selected org chart nodes. If selected_node_color is also set, this field takes precedence.
    - name: tooltips
      TYPE: STRUCT(ChartData)
      REQUIRED: false
      comment: The data containing the tooltip for the corresponding node. A blank value results in no tooltip being displayed for the node. This field is optional.
  OverlayPosition:
    - name: anchorCell
      TYPE: STRUCT(GridCoordinate)
      REQUIRED: false
      comment: The cell the object is anchored to.
    - name: heightPixels
      TYPE: INT
      REQUIRED: false
      FORMAT: int32
      comment: The height of the object, in pixels. Defaults to 371.
    - name: offsetXPixels
      TYPE: INT
      REQUIRED: false
      FORMAT: int32
      comment: The horizontal offset, in pixels, that the object is offset from the anchor cell.
    - name: offsetYPixels
      TYPE: INT
      REQUIRED: false
      FORMAT: int32
      comment: The vertical offset, in pixels, that the object is offset from the anchor cell.
    - name: widthPixels
      TYPE: INT
      REQUIRED: false
      FORMAT: int32
      comment: The width of the object, in pixels. Defaults to 600.
  Padding:
    - name: bottom
      TYPE: INT
      REQUIRED: false
      FORMAT: int32
      comment: The bottom padding of the cell.
    - name: left
      TYPE: INT
      REQUIRED: false
      FORMAT: int32
      comment: The left padding of the cell.
    - name: right
      TYPE: INT
      REQUIRED: false
      FORMAT: int32
      comment: The right padding of the cell.
    - name: top
      TYPE: INT
      REQUIRED: false
      FORMAT: int32
      comment: The top padding of the cell.
  PasteDataRequest:
    - name: coordinate
      TYPE: STRUCT(GridCoordinate)
      REQUIRED: false
      comment: The coordinate at which the data should start being inserted.
    - name: data
      TYPE: STRING
      REQUIRED: false
      comment: The data to insert.
    - name: delimiter
      TYPE: STRING
      REQUIRED: false
      comment: The delimiter in the data.
    - name: html
      TYPE: BOOL
      REQUIRED: false
      comment: True if the data is HTML.
    - name: type
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - PASTE_NORMAL
        - PASTE_VALUES
        - PASTE_FORMAT
        - PASTE_NO_BORDERS
        - PASTE_FORMULA
        - PASTE_DATA_VALIDATION
        - PASTE_CONDITIONAL_FORMATTING
      comment: How the data should be pasted.
  PersonProperties:
    - name: displayFormat
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - DISPLAY_FORMAT_UNSPECIFIED
        - DEFAULT
        - LAST_NAME_COMMA_FIRST_NAME
        - EMAIL
      comment: Optional. The display format of the person chip. If not set, the default display format is used.
    - name: email
      TYPE: STRING
      REQUIRED: false
      comment: Required. The email address linked to this person. This field is always present.
  PieChartSpec:
    - name: domain
      TYPE: STRUCT(ChartData)
      REQUIRED: false
      comment: The data that covers the domain of the pie chart.
    - name: legendPosition
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - PIE_CHART_LEGEND_POSITION_UNSPECIFIED
        - BOTTOM_LEGEND
        - LEFT_LEGEND
        - RIGHT_LEGEND
        - TOP_LEGEND
        - NO_LEGEND
        - LABELED_LEGEND
      comment: Where the legend of the pie chart should be drawn.
    - name: pieHole
      TYPE: FLOAT
      REQUIRED: false
      FORMAT: double
      comment: The size of the hole in the pie chart.
    - name: series
      TYPE: STRUCT(ChartData)
      REQUIRED: false
      comment: The data that covers the one and only series of the pie chart.
    - name: threeDimensional
      TYPE: BOOL
      REQUIRED: false
      comment: True if the pie is three dimensional.
  PivotFilterCriteria:
    - name: condition
      TYPE: STRUCT(BooleanCondition)
      REQUIRED: false
      comment: A condition that must be true for values to be shown. (`visibleValues` does not override this -- even if a value is listed there, it is still hidden if it does not meet the condition.) Condition values that refer to ranges in A1-notation are evaluated relative to the pivot table sheet. References are treated absolutely, so are not filled down the pivot table. For example, a condition value of `=A1` on "Pivot Table 1" is treated as `'Pivot Table 1'!$A$1`. The source data of the pivot table can be referenced by column header name. For example, if the source data has columns named "Revenue" and "Cost" and a condition is applied to the "Revenue" column with type `NUMBER_GREATER` and value `=Cost`, then only columns where "Revenue" > "Cost" are included.
    - name: visibleByDefault
      TYPE: BOOL
      REQUIRED: false
      comment: Whether values are visible by default. If true, the visible_values are ignored, all values that meet condition (if specified) are shown. If false, values that are both in visible_values and meet condition are shown.
    - name: visibleValues
      TYPE: "[]STRING"
      REQUIRED: false
      comment: Values that should be included. Values not listed here are excluded.
  PivotFilterSpec:
    - name: columnOffsetIndex
      TYPE: INT
      REQUIRED: false
      FORMAT: int32
      comment: The zero-based column offset of the source range.
    - name: dataSourceColumnReference
      TYPE: STRUCT(DataSourceColumnReference)
      REQUIRED: false
      comment: The reference to the data source column.
    - name: filterCriteria
      TYPE: STRUCT(PivotFilterCriteria)
      REQUIRED: false
      comment: The criteria for the column.
  PivotGroup:
    - name: dataSourceColumnReference
      TYPE: STRUCT(DataSourceColumnReference)
      REQUIRED: false
      comment: The reference to the data source column this grouping is based on.
    - name: groupLimit
      TYPE: STRUCT(PivotGroupLimit)
      REQUIRED: false
      comment: The count limit on rows or columns to apply to this pivot group.
    - name: groupRule
      TYPE: STRUCT(PivotGroupRule)
      REQUIRED: false
      comment: The group rule to apply to this row/column group.
    - name: label
      TYPE: STRING
      REQUIRED: false
      comment: The labels to use for the row/column groups which can be customized. For example, in the following pivot table, the row label is `Region` (which could be renamed to `State`) and the column label is `Product` (which could be renamed `Item`). Pivot tables created before December 2017 do not have header labels. If you'd like to add header labels to an existing pivot table, please delete the existing pivot table and then create a new pivot table with same parameters. +--------------+---------+-------+ | SUM of Units | Product | | | Region | Pen | Paper | +--------------+---------+-------+ | New York | 345 | 98 | | Oregon | 234 | 123 | | Tennessee | 531 | 415 | +--------------+---------+-------+ | Grand Total | 1110 | 636 | +--------------+---------+-------+
    - name: repeatHeadings
      TYPE: BOOL
      REQUIRED: false
      comment: True if the headings in this pivot group should be repeated. This is only valid for row groupings and is ignored by columns. By default, we minimize repetition of headings by not showing higher level headings where they are the same. For example, even though the third row below corresponds to "Q1 Mar", "Q1" is not shown because it is redundant with previous rows. Setting repeat_headings to true would cause "Q1" to be repeated for "Feb" and "Mar". +--------------+ | Q1 | Jan | | | Feb | | | Mar | +--------+-----+ | Q1 Total | +--------------+
    - name: showTotals
      TYPE: BOOL
      REQUIRED: false
      comment: True if the pivot table should include the totals for this grouping.
    - name: sortOrder
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - SORT_ORDER_UNSPECIFIED
        - ASCENDING
        - DESCENDING
      comment: The order the values in this group should be sorted.
    - name: sourceColumnOffset
      TYPE: INT
      REQUIRED: false
      FORMAT: int32
      comment: The column offset of the source range that this grouping is based on. For example, if the source was `C10:E15`, a `sourceColumnOffset` of `0` means this group refers to column `C`, whereas the offset `1` would refer to column `D`.
    - name: valueBucket
      TYPE: STRUCT(PivotGroupSortValueBucket)
      REQUIRED: false
      comment: The bucket of the opposite pivot group to sort by. If not specified, sorting is alphabetical by this group's values.
    - name: valueMetadata
      TYPE: "[]STRUCT(PivotGroupValueMetadata)"
      REQUIRED: false
      comment: Metadata about values in the grouping.
  PivotGroupLimit:
    - name: applyOrder
      TYPE: INT
      REQUIRED: false
      FORMAT: int32
      comment: The order in which the group limit is applied to the pivot table. Pivot group limits are applied from lower to higher order number. Order numbers are normalized to consecutive integers from 0. For write request, to fully customize the applying orders, all pivot group limits should have this field set with an unique number. Otherwise, the order is determined by the index in the PivotTable.rows list and then the PivotTable.columns list.
    - name: countLimit
      TYPE: INT
      REQUIRED: false
      FORMAT: int32
      comment: The count limit.
  PivotGroupRule:
    - name: dateTimeRule
      TYPE: STRUCT(DateTimeRule)
      REQUIRED: false
      comment: A DateTimeRule.
    - name: histogramRule
      TYPE: STRUCT(HistogramRule)
      REQUIRED: false
      comment: A HistogramRule.
    - name: manualRule
      TYPE: STRUCT(ManualRule)
      REQUIRED: false
      comment: A ManualRule.
  PivotGroupSortValueBucket:
    - name: buckets
      TYPE: "[]STRUCT(ExtendedValue)"
      REQUIRED: false
      comment: Determines the bucket from which values are chosen to sort. For example, in a pivot table with one row group & two column groups, the row group can list up to two values. The first value corresponds to a value within the first column group, and the second value corresponds to a value in the second column group. If no values are listed, this would indicate that the row should be sorted according to the "Grand Total" over the column groups. If a single value is listed, this would correspond to using the "Total" of that bucket.
    - name: valuesIndex
      TYPE: INT
      REQUIRED: false
      FORMAT: int32
      comment: The offset in the PivotTable.values list which the values in this grouping should be sorted by.
  PivotGroupValueMetadata:
    - name: collapsed
      TYPE: BOOL
      REQUIRED: false
      comment: True if the data corresponding to the value is collapsed.
    - name: value
      TYPE: STRUCT(ExtendedValue)
      REQUIRED: false
      comment: The calculated value the metadata corresponds to. (Note that formulaValue is not valid, because the values will be calculated.)
  PivotTable:
    - name: columns
      TYPE: "[]STRUCT(PivotGroup)"
      REQUIRED: false
      comment: Each column grouping in the pivot table.
    - name: criteria
      TYPE: map[STRING]ANY
      REQUIRED: false
      DEPRECATED: true
      comment: An optional mapping of filters per source column offset. The filters are applied before aggregating data into the pivot table. The map's key is the column offset of the source range that you want to filter, and the value is the criteria for that column. For example, if the source was `C10:E15`, a key of `0` will have the filter for column `C`, whereas the key `1` is for column `D`. This field is deprecated in favor of filter_specs.
    - name: dataExecutionStatus
      TYPE: STRUCT(DataExecutionStatus)
      REQUIRED: false
      READ_ONLY: true
      comment: Output only. The data execution status for data source pivot tables.
    - name: dataSourceId
      TYPE: STRING
      REQUIRED: false
      comment: The ID of the data source the pivot table is reading data from.
    - name: filterSpecs
      TYPE: "[]STRUCT(PivotFilterSpec)"
      REQUIRED: false
      comment: The filters applied to the source columns before aggregating data for the pivot table. Both criteria and filter_specs are populated in responses. If both fields are specified in an update request, this field takes precedence.
    - name: rows
      TYPE: "[]STRUCT(PivotGroup)"
      REQUIRED: false
      comment: Each row grouping in the pivot table.
    - name: source
      TYPE: STRUCT(GridRange)
      REQUIRED: false
      comment: The range the pivot table is reading data from.
    - name: valueLayout
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - HORIZONTAL
        - VERTICAL
      comment: Whether values should be listed horizontally (as columns) or vertically (as rows).
    - name: values
      TYPE: "[]STRUCT(PivotValue)"
      REQUIRED: false
      comment: A list of values to include in the pivot table.
  PivotValue:
    - name: calculatedDisplayType
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - PIVOT_VALUE_CALCULATED_DISPLAY_TYPE_UNSPECIFIED
        - PERCENT_OF_ROW_TOTAL
        - PERCENT_OF_COLUMN_TOTAL
        - PERCENT_OF_GRAND_TOTAL
      comment: If specified, indicates that pivot values should be displayed as the result of a calculation with another pivot value. For example, if calculated_display_type is specified as PERCENT_OF_GRAND_TOTAL, all the pivot values are displayed as the percentage of the grand total. In the Sheets editor, this is referred to as "Show As" in the value section of a pivot table.
    - name: dataSourceColumnReference
      TYPE: STRUCT(DataSourceColumnReference)
      REQUIRED: false
      comment: The reference to the data source column that this value reads from.
    - name: formula
      TYPE: STRING
      REQUIRED: false
      comment: A custom formula to calculate the value. The formula must start with an `=` character.
    - name: name
      TYPE: STRING
      REQUIRED: false
      comment: A name to use for the value.
    - name: sourceColumnOffset
      TYPE: INT
      REQUIRED: false
      FORMAT: int32
      comment: The column offset of the source range that this value reads from. For example, if the source was `C10:E15`, a `sourceColumnOffset` of `0` means this value refers to column `C`, whereas the offset `1` would refer to column `D`.
    - name: summarizeFunction
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - PIVOT_STANDARD_VALUE_FUNCTION_UNSPECIFIED
        - SUM
        - COUNTA
        - COUNT
        - COUNTUNIQUE
        - AVERAGE
        - MAX
        - MIN
        - MEDIAN
        - PRODUCT
        - STDEV
        - STDEVP
        - VAR
        - VARP
        - CUSTOM
        - NONE
      comment: A function to summarize the value. If formula is set, the only supported values are SUM and CUSTOM. If sourceColumnOffset is set, then `CUSTOM` is not supported.
  PointStyle:
    - name: shape
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - POINT_SHAPE_UNSPECIFIED
        - CIRCLE
        - DIAMOND
        - HEXAGON
        - PENTAGON
        - SQUARE
        - STAR
        - TRIANGLE
        - X_MARK
      comment: The point shape. If empty or unspecified, a default shape is used.
    - name: size
      TYPE: FLOAT
      REQUIRED: false
      FORMAT: double
      comment: The point size. If empty, a default size is used.
  ProtectedRange:
    - name: description
      TYPE: STRING
      REQUIRED: false
      comment: The description of this protected range.
    - name: editors
      TYPE: STRUCT(Editors)
      REQUIRED: false
      comment: The users and groups with edit access to the protected range. This field is only visible to users with edit access to the protected range and the document. Editors are not supported with warning_only protection.
    - name: namedRangeId
      TYPE: STRING
      REQUIRED: false
      comment: The named range this protected range is backed by, if any. When writing, only one of range or named_range_id or table_id may be set.
    - name: protectedRangeId
      TYPE: INT
      REQUIRED: false
      FORMAT: int32
      comment: The ID of the protected range. This field is read-only.
    - name: range
      TYPE: STRUCT(GridRange)
      REQUIRED: false
      comment: The range that is being protected. The range may be fully unbounded, in which case this is considered a protected sheet. When writing, only one of range or named_range_id or table_id may be set.
    - name: requestingUserCanEdit
      TYPE: BOOL
      REQUIRED: false
      comment: True if the user who requested this protected range can edit the protected area. This field is read-only.
    - name: tableId
      TYPE: STRING
      REQUIRED: false
      comment: The table this protected range is backed by, if any. When writing, only one of range or named_range_id or table_id may be set.
    - name: unprotectedRanges
      TYPE: "[]STRUCT(GridRange)"
      REQUIRED: false
      comment: The list of unprotected ranges within a protected sheet. Unprotected ranges are only supported on protected sheets.
    - name: warningOnly
      TYPE: BOOL
      REQUIRED: false
      comment: "True if this protected range will show a warning when editing. Warning-based protection means that every user can edit data in the protected range, except editing will prompt a warning asking the user to confirm the edit. When writing: if this field is true, then editors are ignored. Additionally, if this field is changed from true to false and the `editors` field is not set (nor included in the field mask), then the editors will be set to all the editors in the document."
  RandomizeRangeRequest:
    - name: range
      TYPE: STRUCT(GridRange)
      REQUIRED: false
      comment: The range to randomize.
  RefreshCancellationStatus:
    - name: errorCode
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - REFRESH_CANCELLATION_ERROR_CODE_UNSPECIFIED
        - EXECUTION_NOT_FOUND
        - CANCEL_PERMISSION_DENIED
        - QUERY_EXECUTION_COMPLETED
        - CONCURRENT_CANCELLATION
        - CANCEL_OTHER_ERROR
      comment: The error code.
    - name: state
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - REFRESH_CANCELLATION_STATE_UNSPECIFIED
        - CANCEL_SUCCEEDED
        - CANCEL_FAILED
      comment: The state of a call to cancel a refresh in Sheets.
  RefreshDataSourceObjectExecutionStatus:
    - name: dataExecutionStatus
      TYPE: STRUCT(DataExecutionStatus)
      REQUIRED: false
      comment: The data execution status.
    - name: reference
      TYPE: STRUCT(DataSourceObjectReference)
      REQUIRED: false
      comment: Reference to a data source object being refreshed.
  RefreshDataSourceRequest:
    - name: dataSourceId
      TYPE: STRING
      REQUIRED: false
      comment: Reference to a DataSource. If specified, refreshes all associated data source objects for the data source.
    - name: force
      TYPE: BOOL
      REQUIRED: false
      comment: Refreshes the data source objects regardless of the current state. If not set and a referenced data source object was in error state, the refresh will fail immediately.
    - name: isAll
      TYPE: BOOL
      REQUIRED: false
      comment: Refreshes all existing data source objects in the spreadsheet.
    - name: references
      TYPE: STRUCT(DataSourceObjectReferences)
      REQUIRED: false
      comment: References to data source objects to refresh.
  RefreshDataSourceResponse:
    - name: statuses
      TYPE: "[]STRUCT(RefreshDataSourceObjectExecutionStatus)"
      REQUIRED: false
      comment: All the refresh status for the data source object references specified in the request. If is_all is specified, the field contains only those in failure status.
  RepeatCellRequest:

      REQUIRED: false
      comment: The banded (alternating colors) ranges on this sheet.
    - name: basicFilter
      TYPE: STRUCT(BasicFilter)
      REQUIRED: false
      comment: The filter on this sheet, if any.
    - name: charts
      TYPE: "[]STRUCT(EmbeddedChart)"
      REQUIRED: false
      comment: The specifications of every chart on this sheet.
    - name: columnGroups
      TYPE: "[]STRUCT(DimensionGroup)"
      REQUIRED: false
      comment: All column groups on this sheet, ordered by increasing range start index, then by group depth.
    - name: conditionalFormats
      TYPE: "[]STRUCT(ConditionalFormatRule)"
      REQUIRED: false
      comment: The conditional format rules in this sheet.
    - name: data
      TYPE: "[]STRUCT(GridData)"
      REQUIRED: false
      comment: Data in the grid, if this is a grid sheet. The number of GridData objects returned is dependent on the number of ranges requested on this sheet. For example, if this is representing `Sheet1`, and the spreadsheet was requested with ranges `Sheet1!A1:C10` and `Sheet1!D15:E20`, then the first GridData will have a startRow/startColumn of `0`, while the second one will have `startRow 14` (zero-based row 15), and `startColumn 3` (zero-based column D). For a DATA_SOURCE sheet, you can not request a specific range, the GridData contains all the values.
    - name: developerMetadata
      TYPE: "[]STRUCT(DeveloperMetadata)"
      REQUIRED: false
      comment: The developer metadata associated with a sheet.
    - name: filterViews
      TYPE: "[]STRUCT(FilterView)"
      REQUIRED: false
      comment: The filter views in this sheet.
    - name: merges
      TYPE: "[]STRUCT(GridRange)"
      REQUIRED: false
      comment: The ranges that are merged together.
    - name: properties
      TYPE: STRUCT(SheetProperties)
      REQUIRED: false
      comment: The properties of the sheet.
    - name: protectedRanges
      TYPE: "[]STRUCT(ProtectedRange)"
      REQUIRED: false
      comment: The protected ranges in this sheet.
    - name: rowGroups
      TYPE: "[]STRUCT(DimensionGroup)"
      REQUIRED: false
      comment: All row groups on this sheet, ordered by increasing range start index, then by group depth.
    - name: slicers
      TYPE: "[]STRUCT(Slicer)"
      REQUIRED: false
      comment: The slicers on this sheet.
    - name: tables
      TYPE: "[]STRUCT(Table)"
      REQUIRED: false
      comment: The tables on this sheet.
  SheetProperties:
    - name: dataSourceSheetProperties
      TYPE: STRUCT(DataSourceSheetProperties)
      REQUIRED: false
      READ_ONLY: true
      comment: Output only. If present, the field contains DATA_SOURCE sheet specific properties.
    - name: gridProperties
      TYPE: STRUCT(GridProperties)
      REQUIRED: false
      comment: Additional properties of the sheet if this sheet is a grid. (If the sheet is an object sheet, containing a chart or image, then this field will be absent.) When writing it is an error to set any grid properties on non-grid sheets. If this sheet is a DATA_SOURCE sheet, this field is output only but contains the properties that reflect how a data source sheet is rendered in the UI, e.g. row_count.
    - name: hidden
      TYPE: BOOL
      REQUIRED: false
      comment: True if the sheet is hidden in the UI, false if it's visible.
    - name: index
      TYPE: INT
      REQUIRED: false
      FORMAT: int32
      comment: The index of the sheet within the spreadsheet. When adding or updating sheet properties, if this field is excluded then the sheet is added or moved to the end of the sheet list. When updating sheet indices or inserting sheets, movement is considered in "before the move" indexes. For example, if there were three sheets (S1, S2, S3) in order to move S1 ahead of S2 the index would have to be set to 2. A sheet index update request is ignored if the requested index is identical to the sheets current index or if the requested new index is equal to the current sheet index + 1.
    - name: rightToLeft
      TYPE: BOOL
      REQUIRED: false
      comment: True if the sheet is an RTL sheet instead of an LTR sheet.
    - name: sheetId
      TYPE: INT
      REQUIRED: false
      FORMAT: int32
      comment: The ID of the sheet. Must be non-negative. This field cannot be changed once set.
    - name: sheetType
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - SHEET_TYPE_UNSPECIFIED
        - GRID
        - OBJECT
        - DATA_SOURCE
      comment: The type of sheet. Defaults to GRID. This field cannot be changed once set.
    - name: tabColor
      TYPE: STRUCT(Color)
      REQUIRED: false
      DEPRECATED: true
      comment: "The color of the tab in the UI. Deprecated: Use tab_color_style."
    - name: tabColorStyle
      TYPE: STRUCT(ColorStyle)
      REQUIRED: false
      comment: The color of the tab in the UI. If tab_color is also set, this field takes precedence.
    - name: title
      TYPE: STRING
      REQUIRED: false
      comment: The name of the sheet.
  Slicer:
    - name: position
      TYPE: STRUCT(EmbeddedObjectPosition)
      REQUIRED: false
      comment: The position of the slicer. Note that slicer can be positioned only on existing sheet. Also, width and height of slicer can be automatically adjusted to keep it within permitted limits.
    - name: slicerId
      TYPE: INT
      REQUIRED: false
      FORMAT: int32
      comment: The ID of the slicer.
    - name: spec
      TYPE: STRUCT(SlicerSpec)
      REQUIRED: false
      comment: The specification of the slicer.
  SlicerSpec:
    - name: applyToPivotTables
      TYPE: BOOL
      REQUIRED: false
      comment: True if the filter should apply to pivot tables. If not set, default to `True`.
    - name: backgroundColor
      TYPE: STRUCT(Color)
      REQUIRED: false
      DEPRECATED: true
      comment: "The background color of the slicer. Deprecated: Use background_color_style."
    - name: backgroundColorStyle
      TYPE: STRUCT(ColorStyle)
      REQUIRED: false
      comment: The background color of the slicer. If background_color is also set, this field takes precedence.
    - name: columnIndex
      TYPE: INT
      REQUIRED: false
      FORMAT: int32
      comment: The zero-based column index in the data table on which the filter is applied to.
    - name: dataRange
      TYPE: STRUCT(GridRange)
      REQUIRED: false
      comment: The data range of the slicer.
    - name: filterCriteria
      TYPE: STRUCT(FilterCriteria)
      REQUIRED: false
      comment: The filtering criteria of the slicer.
    - name: horizontalAlignment
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - HORIZONTAL_ALIGN_UNSPECIFIED
        - LEFT
        - CENTER
        - RIGHT
      comment: The horizontal alignment of title in the slicer. If unspecified, defaults to `LEFT`
    - name: textFormat
      TYPE: STRUCT(TextFormat)
      REQUIRED: false
      comment: The text format of title in the slicer. The link field is not supported.
    - name: title
      TYPE: STRING
      REQUIRED: false
      comment: The title of the slicer.
  SortRangeRequest:
    - name: range
      TYPE: STRUCT(GridRange)
      REQUIRED: false
      comment: The range to sort.
    - name: sortSpecs
      TYPE: "[]STRUCT(SortSpec)"
      REQUIRED: false
      comment: The sort order per column. Later specifications are used when values are equal in the earlier specifications.
  SortSpec:
    - name: backgroundColor
      TYPE: STRUCT(Color)
      REQUIRED: false
      DEPRECATED: true
      comment: "The background fill color to sort by; cells with this fill color are sorted to the top. Mutually exclusive with foreground_color. Deprecated: Use background_color_style."
    - name: backgroundColorStyle
      TYPE: STRUCT(ColorStyle)
      REQUIRED: false
      comment: The background fill color to sort by; cells with this fill color are sorted to the top. Mutually exclusive with foreground_color, and must be an RGB-type color. If background_color is also set, this field takes precedence.
    - name: dataSourceColumnReference
      TYPE: STRUCT(DataSourceColumnReference)
      REQUIRED: false
      comment: Reference to a data source column.
    - name: dimensionIndex
      TYPE: INT
      REQUIRED: false
      FORMAT: int32
      comment: The dimension the sort should be applied to.
    - name: foregroundColor
      TYPE: STRUCT(Color)
      REQUIRED: false
      DEPRECATED: true
      comment: "The foreground color to sort by; cells with this foreground color are sorted to the top. Mutually exclusive with background_color. Deprecated: Use foreground_color_style."
    - name: foregroundColorStyle
      TYPE: STRUCT(ColorStyle)
      REQUIRED: false
      comment: The foreground color to sort by; cells with this foreground color are sorted to the top. Mutually exclusive with background_color, and must be an RGB-type color. If foreground_color is also set, this field takes precedence.
    - name: sortOrder
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - SORT_ORDER_UNSPECIFIED
        - ASCENDING
        - DESCENDING
      comment: The order data should be sorted.
  SourceAndDestination:
    - name: dimension
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - DIMENSION_UNSPECIFIED
        - ROWS
        - COLUMNS
      comment: The dimension that data should be filled into.
    - name: fillLength
      TYPE: INT
      REQUIRED: false
      FORMAT: int32
      comment: The number of rows or columns that data should be filled into. Positive numbers expand beyond the last row or last column of the source. Negative numbers expand before the first row or first column of the source.
    - name: source
      TYPE: STRUCT(GridRange)
      REQUIRED: false
      comment: The location of the data to use as the source of the autofill.
  Spreadsheet:
    - name: dataSourceSchedules
      TYPE: "[]STRUCT(DataSourceRefreshSchedule)"
      REQUIRED: false
      READ_ONLY: true
      comment: Output only. A list of data source refresh schedules.
    - name: dataSources
      TYPE: "[]STRUCT(DataSource)"
      REQUIRED: false
      comment: A list of external data sources connected with the spreadsheet.
    - name: developerMetadata
      TYPE: "[]STRUCT(DeveloperMetadata)"
      REQUIRED: false
      comment: The developer metadata associated with a spreadsheet.
    - name: namedRanges
      TYPE: "[]STRUCT(NamedRange)"
      REQUIRED: false
      comment: The named ranges defined in a spreadsheet.
    - name: properties
      TYPE: STRUCT(SpreadsheetProperties)
      REQUIRED: false
      comment: Overall properties of a spreadsheet.
    - name: sheets
      TYPE: "[]STRUCT(Sheet)"
      REQUIRED: false
      comment: The sheets that are part of a spreadsheet.
    - name: spreadsheetId
      TYPE: STRING
      REQUIRED: false
      comment: The ID of the spreadsheet. This field is read-only.
    - name: spreadsheetUrl
      TYPE: STRING
      REQUIRED: false
      comment: The url of the spreadsheet. This field is read-only.
  SpreadsheetProperties:
    - name: autoRecalc
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - RECALCULATION_INTERVAL_UNSPECIFIED
        - ON_CHANGE
        - MINUTE
        - HOUR
      comment: The amount of time to wait before volatile functions are recalculated.
    - name: defaultFormat
      TYPE: STRUCT(CellFormat)
      REQUIRED: false
      comment: The default format of all cells in the spreadsheet. CellData.effectiveFormat will not be set if the cell's format is equal to this default format. This field is read-only.
    - name: importFunctionsExternalUrlAccessAllowed
      TYPE: BOOL
      REQUIRED: false
      comment: Whether to allow external URL access for image and import functions. Read only when true. When false, you can set to true. This value will be bypassed and always return true if the admin has enabled the [allowlisting feature](https://support.google.com/a?p=url_allowlist).
    - name: iterativeCalculationSettings
      TYPE: STRUCT(IterativeCalculationSettings)
      REQUIRED: false
      comment: Determines whether and how circular references are resolved with iterative calculation. Absence of this field means that circular references result in calculation errors.
    - name: locale
      TYPE: STRING
      REQUIRED: false
      comment: "The locale of the spreadsheet in one of the following formats: * an ISO 639-1 language code such as `en` * an ISO 639-2 language code such as `fil`, if no 639-1 code exists * a combination of the ISO language code and country code, such as `en_US` Note: when updating this field, not all locales/languages are supported."
    - name: spreadsheetTheme
      TYPE: STRUCT(SpreadsheetTheme)
      REQUIRED: false
      comment: Theme applied to the spreadsheet.
    - name: timeZone
      TYPE: STRING
      REQUIRED: false
      comment: The time zone of the spreadsheet, in CLDR format such as `America/New_York`. If the time zone isn't recognized, this may be a custom time zone such as `GMT-07:00`.
    - name: title
      TYPE: STRING
      REQUIRED: false
      comment: The title of the spreadsheet.
  SpreadsheetTheme:
    - name: primaryFontFamily
      TYPE: STRING
      REQUIRED: false
      comment: Name of the primary font family.
    - name: themeColors
      TYPE: "[]STRUCT(ThemeColorPair)"
      REQUIRED: false
      comment: The spreadsheet theme color pairs. To update you must provide all theme color pairs.
  Table:
    - name: columnProperties
      TYPE: "[]STRUCT(TableColumnProperties)"
      REQUIRED: false
      comment: The table column properties.
    - name: name
      TYPE: STRING
      REQUIRED: false
      comment: The table name. This is unique to all tables in the same spreadsheet.
    - name: range
      TYPE: STRUCT(GridRange)
      REQUIRED: false
      comment: The table range.
    - name: rowsProperties
      TYPE: STRUCT(TableRowsProperties)
      REQUIRED: false
      comment: The table rows properties.
    - name: tableId
      TYPE: STRING
      REQUIRED: false
      comment: The id of the table.
  TableColumnDataValidationRule:
    - name: condition
      TYPE: STRUCT(BooleanCondition)
      REQUIRED: false
      comment: The condition that data in the cell must match. Valid only if the [BooleanCondition.type] is ONE_OF_LIST.
  TableColumnProperties:
    - name: columnIndex
      TYPE: INT
      REQUIRED: false
      FORMAT: int32
      comment: The 0-based column index. This index is relative to its position in the table and is not necessarily the same as the column index in the sheet.
    - name: columnName
      TYPE: STRING
      REQUIRED: false
      comment: The column name.
    - name: columnType
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - COLUMN_TYPE_UNSPECIFIED
        - DOUBLE
        - CURRENCY
        - PERCENT
        - DATE
        - TIME
        - DATE_TIME
        - TEXT
        - BOOLEAN
        - DROPDOWN
        - FILES_CHIP
        - PEOPLE_CHIP
        - FINANCE_CHIP
        - PLACE_CHIP
        - RATINGS_CHIP
      comment: The column type.
    - name: dataValidationRule
      TYPE: STRUCT(TableColumnDataValidationRule)
      REQUIRED: false
      comment: The column data validation rule. Only set for dropdown column type.
  TableRowsProperties:
    - name: firstBandColorStyle
      TYPE: STRUCT(ColorStyle)
      REQUIRED: false
      comment: The first color that is alternating. If this field is set, the first banded row is filled with the specified color. Otherwise, the first banded row is filled with a default color.
    - name: footerColorStyle
      TYPE: STRUCT(ColorStyle)
      REQUIRED: false
      comment: The color of the last row. If this field is not set a footer is not added, the last row is filled with either first_band_color_style or second_band_color_style, depending on the color of the previous row. If updating an existing table without a footer to have a footer, the range will be expanded by 1 row. If updating an existing table with a footer and removing a footer, the range will be shrunk by 1 row.
    - name: headerColorStyle
      TYPE: STRUCT(ColorStyle)
      REQUIRED: false
      comment: The color of the header row. If this field is set, the header row is filled with the specified color. Otherwise, the header row is filled with a default color.
    - name: secondBandColorStyle
      TYPE: STRUCT(ColorStyle)
      REQUIRED: false
      comment: The second color that is alternating. If this field is set, the second banded row is filled with the specified color. Otherwise, the second banded row is filled with a default color.
  TextFormat:
    - name: bold
      TYPE: BOOL
      REQUIRED: false
      comment: True if the text is bold.
    - name: fontFamily
      TYPE: STRING
      REQUIRED: false
      comment: The font family.
    - name: fontSize
      TYPE: INT
      REQUIRED: false
      FORMAT: int32
      comment: The size of the font.
    - name: foregroundColor
      TYPE: STRUCT(Color)
      REQUIRED: false
      DEPRECATED: true
      comment: "The foreground color of the text. Deprecated: Use foreground_color_style."
    - name: foregroundColorStyle
      TYPE: STRUCT(ColorStyle)
      REQUIRED: false
      comment: The foreground color of the text. If foreground_color is also set, this field takes precedence.
    - name: italic
      TYPE: BOOL
      REQUIRED: false
      comment: True if the text is italicized.
    - name: link
      TYPE: STRUCT(Link)
      REQUIRED: false
      comment: The link destination of the text, if any. Setting the link field in a TextFormatRun will clear the cell's existing links or a cell-level link set in the same request. When a link is set, the text foreground color will be set to the default link color and the text will be underlined. If these fields are modified in the same request, those values will be used instead of the link defaults.
    - name: strikethrough
      TYPE: BOOL
      REQUIRED: false
      comment: True if the text has a strikethrough.
    - name: underline
      TYPE: BOOL
      REQUIRED: false
      comment: True if the text is underlined.
  TextFormatRun:
    - name: format
      TYPE: STRUCT(TextFormat)
      REQUIRED: false
      comment: The format of this run. Absent values inherit the cell's format.
    - name: startIndex
      TYPE: INT
      REQUIRED: false
      FORMAT: int32
      comment: The zero-based character index where this run starts, in UTF-16 code units.
  TextPosition:
    - name: horizontalAlignment
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - HORIZONTAL_ALIGN_UNSPECIFIED
        - LEFT
        - CENTER
        - RIGHT
      comment: Horizontal alignment setting for the piece of text.
  TextRotation:
    - name: angle
      TYPE: INT
      REQUIRED: false
      FORMAT: int32
      comment: "The angle between the standard orientation and the desired orientation. Measured in degrees. Valid values are between -90 and 90. Positive angles are angled upwards, negative are angled downwards. Note: For LTR text direction positive angles are in the counterclockwise direction, whereas for RTL they are in the clockwise direction"
    - name: vertical
      TYPE: BOOL
      REQUIRED: false
      comment: "If true, text reads top to bottom, but the orientation of individual characters is unchanged. For example: | V | | e | | r | | t | | i | | c | | a | | l |"
  TextToColumnsRequest:
    - name: delimiter
      TYPE: STRING
      REQUIRED: false
      comment: The delimiter to use. Used only if delimiterType is CUSTOM.
    - name: delimiterType
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - DELIMITER_TYPE_UNSPECIFIED
        - COMMA
        - SEMICOLON
        - PERIOD
        - SPACE
        - CUSTOM
        - AUTODETECT
      comment: The delimiter type to use.
    - name: source
      TYPE: STRUCT(GridRange)
      REQUIRED: false
      comment: The source data range. This must span exactly one column.
  ThemeColorPair:
    - name: color
      TYPE: STRUCT(ColorStyle)
      REQUIRED: false
      comment: The concrete color corresponding to the theme color type.
    - name: colorType
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - THEME_COLOR_TYPE_UNSPECIFIED
        - TEXT
        - BACKGROUND
        - ACCENT1
        - ACCENT2
        - ACCENT3
        - ACCENT4
        - ACCENT5
        - ACCENT6
        - LINK
      comment: The type of the spreadsheet theme color.
  TimeOfDay:
    - name: hours
      TYPE: INT
      REQUIRED: false
      FORMAT: int32
      comment: Hours of a day in 24 hour format. Must be greater than or equal to 0 and typically must be less than or equal to 23. An API may choose to allow the value "24:00:00" for scenarios like business closing time.
    - name: minutes
      TYPE: INT
      REQUIRED: false
      FORMAT: int32
      comment: Minutes of an hour. Must be greater than or equal to 0 and less than or equal to 59.
    - name: nanos
      TYPE: INT
      REQUIRED: false
      FORMAT: int32
      comment: Fractions of seconds, in nanoseconds. Must be greater than or equal to 0 and less than or equal to 999,999,999.
    - name: seconds
      TYPE: INT
      REQUIRED: false
      FORMAT: int32
      comment: Seconds of a minute. Must be greater than or equal to 0 and typically must be less than or equal to 59. An API may allow the value 60 if it allows leap-seconds.
  TreemapChartColorScale:
    - name: maxValueColor
      TYPE: STRUCT(Color)
      REQUIRED: false
      DEPRECATED: true
      comment: "The background color for cells with a color value greater than or equal to maxValue. Defaults to #109618 if not specified. Deprecated: Use max_value_color_style."
    - name: maxValueColorStyle
      TYPE: STRUCT(ColorStyle)
      REQUIRED: false
      comment: "The background color for cells with a color value greater than or equal to maxValue. Defaults to #109618 if not specified. If max_value_color is also set, this field takes precedence."
    - name: midValueColor
      TYPE: STRUCT(Color)
      REQUIRED: false
      DEPRECATED: true
      comment: "The background color for cells with a color value at the midpoint between minValue and maxValue. Defaults to #efe6dc if not specified. Deprecated: Use mid_value_color_style."
    - name: midValueColorStyle
      TYPE: STRUCT(ColorStyle)
      REQUIRED: false
      comment: "The background color for cells with a color value at the midpoint between minValue and maxValue. Defaults to #efe6dc if not specified. If mid_value_color is also set, this field takes precedence."
    - name: minValueColor
      TYPE: STRUCT(Color)
      REQUIRED: false
      DEPRECATED: true
      comment: "The background color for cells with a color value less than or equal to minValue. Defaults to #dc3912 if not specified. Deprecated: Use min_value_color_style."
    - name: minValueColorStyle
      TYPE: STRUCT(ColorStyle)
      REQUIRED: false
      comment: "The background color for cells with a color value less than or equal to minValue. Defaults to #dc3912 if not specified. If min_value_color is also set, this field takes precedence."
    - name: noDataColor
      TYPE: STRUCT(Color)
      REQUIRED: false
      DEPRECATED: true
      comment: "The background color for cells that have no color data associated with them. Defaults to #000000 if not specified. Deprecated: Use no_data_color_style."
    - name: noDataColorStyle
      TYPE: STRUCT(ColorStyle)
      REQUIRED: false
      comment: "The background color for cells that have no color data associated with them. Defaults to #000000 if not specified. If no_data_color is also set, this field takes precedence."
  TreemapChartSpec:
    - name: colorData
      TYPE: STRUCT(ChartData)
      REQUIRED: false
      comment: The data that determines the background color of each treemap data cell. This field is optional. If not specified, size_data is used to determine background colors. If specified, the data is expected to be numeric. color_scale will determine how the values in this data map to data cell background colors.
    - name: colorScale
      TYPE: STRUCT(TreemapChartColorScale)
      REQUIRED: false
      comment: The color scale for data cells in the treemap chart. Data cells are assigned colors based on their color values. These color values come from color_data, or from size_data if color_data is not specified. Cells with color values less than or equal to min_value will have minValueColor as their background color. Cells with color values greater than or equal to max_value will have maxValueColor as their background color. Cells with color values between min_value and max_value will have background colors on a gradient between minValueColor and maxValueColor, the midpoint of the gradient being midValueColor. Cells with missing or non-numeric color values will have noDataColor as their background color.
    - name: headerColor
      TYPE: STRUCT(Color)
      REQUIRED: false
      DEPRECATED: true
      comment: "The background color for header cells. Deprecated: Use header_color_style."
    - name: headerColorStyle
      TYPE: STRUCT(ColorStyle)
      REQUIRED: false
      comment: The background color for header cells. If header_color is also set, this field takes precedence.
    - name: hideTooltips
      TYPE: BOOL
      REQUIRED: false
      comment: True to hide tooltips.
    - name: hintedLevels
      TYPE: INT
      REQUIRED: false
      FORMAT: int32
      comment: The number of additional data levels beyond the labeled levels to be shown on the treemap chart. These levels are not interactive and are shown without their labels. Defaults to 0 if not specified.
    - name: labels
      TYPE: STRUCT(ChartData)
      REQUIRED: false
      comment: The data that contains the treemap cell labels.
    - name: levels
      TYPE: INT
      REQUIRED: false
      FORMAT: int32
      comment: The number of data levels to show on the treemap chart. These levels are interactive and are shown with their labels. Defaults to 2 if not specified.
    - name: maxValue
      TYPE: FLOAT
      REQUIRED: false
      FORMAT: double
      comment: The maximum possible data value. Cells with values greater than this will have the same color as cells with this value. If not specified, defaults to the actual maximum value from color_data, or the maximum value from size_data if color_data is not specified.
    - name: minValue
      TYPE: FLOAT
      REQUIRED: false
      FORMAT: double
      comment: The minimum possible data value. Cells with values less than this will have the same color as cells with this value. If not specified, defaults to the actual minimum value from color_data, or the minimum value from size_data if color_data is not specified.
    - name: parentLabels
      TYPE: STRUCT(ChartData)
      REQUIRED: false
      comment: The data the contains the treemap cells' parent labels.
    - name: sizeData
      TYPE: STRUCT(ChartData)
      REQUIRED: false
      comment: The data that determines the size of each treemap data cell. This data is expected to be numeric. The cells corresponding to non-numeric or missing data will not be rendered. If color_data is not specified, this data is used to determine data cell background colors as well.
    - name: textFormat
      TYPE: STRUCT(TextFormat)
      REQUIRED: false
      comment: The text format for all labels on the chart. The link field is not supported.
  TrimWhitespaceRequest:
    - name: range
      TYPE: STRUCT(GridRange)
      REQUIRED: false
      comment: The range whose cells to trim.
  TrimWhitespaceResponse:
    - name: cellsChangedCount
      TYPE: INT
      REQUIRED: false
      FORMAT: int32
      comment: The number of cells that were trimmed of whitespace.
  UnmergeCellsRequest:
    - name: range
      TYPE: STRUCT(GridRange)
      REQUIRED: false
      comment: The range within which all cells should be unmerged. If the range spans multiple merges, all will be unmerged. The range must not partially span any merge.
  UpdateBandingRequest:
    - name: bandedRange
      TYPE: STRUCT(BandedRange)
      REQUIRED: false
      comment: The banded range to update with the new properties.
    - name: fields
      TYPE: STRING
      REQUIRED: false

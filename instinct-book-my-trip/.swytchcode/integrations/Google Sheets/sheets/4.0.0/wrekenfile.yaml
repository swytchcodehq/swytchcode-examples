      TYPE: STRUCT(EmbeddedObjectPosition)
      REQUIRED: false
      comment: An explicit position to move the embedded object to. If newPosition.sheetId is set, a new sheet with that ID will be created. If newPosition.newSheet is set to true, a new sheet will be created with an ID that will be chosen for you.
    - name: objectId
      TYPE: INT
      REQUIRED: false

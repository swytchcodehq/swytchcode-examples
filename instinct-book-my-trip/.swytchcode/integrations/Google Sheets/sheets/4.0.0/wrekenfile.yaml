          scopes:
            - https://www.googleapis.com/auth/drive.file
      - Oauth2:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/spreadsheets
        Oauth2c:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/spreadsheets
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - spreadsheetId:
          TYPE: STRING
          REQUIRED: true
          LOCATION: path
      - range:
          TYPE: STRING
          REQUIRED: true
          LOCATION: path
      - body:
          TYPE: STRUCT(ClearValuesRequest)
          REQUIRED: false
          LOCATION: body
    RETURNS:
      - RETURNTYPE: STRUCT(ClearValuesResponse)
        RETURNVAR: google_sheets_value_rangeclear_create
        STATUS: 200
    CANONICAL_ID: google_sheets.value.rangeclear.create

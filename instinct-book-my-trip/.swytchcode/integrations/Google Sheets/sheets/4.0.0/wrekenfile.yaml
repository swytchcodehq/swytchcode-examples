    RETURNS:
      - RETURNTYPE: STRUCT(BatchClearValuesByDataFilterResponse)
        RETURNVAR: google_sheets_valuesbatchclearbydatafilter_create
        STATUS: 200
    CANONICAL_ID: google_sheets.valuesbatchclearbydatafilter.create

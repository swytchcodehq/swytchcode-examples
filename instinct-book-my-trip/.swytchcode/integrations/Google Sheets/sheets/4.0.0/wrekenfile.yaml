      TYPE: STRUCT(CellData)
      REQUIRED: false
      comment: The data to write.
    - name: fields
      TYPE: STRING
      REQUIRED: false
      FORMAT: google-fieldmask
      comment: The fields that should be updated. At least one field must be specified. The root `cell` is implied and should not be specified. A single `"*"` can be used as short-hand for listing every field.
    - name: range
      TYPE: STRUCT(GridRange)
      REQUIRED: false
      comment: The range to repeat the cell in.

      - Oauth2:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/calendar.calendars
        Oauth2c:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/calendar.calendars
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - body:
          TYPE: STRUCT(Calendar)
          REQUIRED: false
          LOCATION: body
    RETURNS:
      - RETURNTYPE: STRUCT(Calendar)
        RETURNVAR: calendar_calendar_create
        STATUS: 200
    CANONICAL_ID: calendar.calendar.create

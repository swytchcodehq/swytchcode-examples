    DESC: Lists the drafts in the user's mailbox. For more information, see [Create and send draft emails](https://developers.google.com/workspace/gmail/api/guides/drafts).
    HTTP:
      METHOD: GET
      ENDPOINT: /gmail/v1/users/{userId}/drafts
      HEADERS:
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    SECURITY:
      - Oauth2:
          type: oauth2
          scopes:
            - https://mail.google.com/
        Oauth2c:
          type: oauth2
          scopes:
            - https://mail.google.com/
      - Oauth2:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/gmail.compose
        Oauth2c:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/gmail.compose
      - Oauth2:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/gmail.modify
        Oauth2c:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/gmail.modify
      - Oauth2:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/gmail.readonly
        Oauth2c:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/gmail.readonly
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - userId:
          TYPE: STRING
          REQUIRED: true
          LOCATION: path
          DEFAULT: me
      - includeSpamTrash:
          TYPE: BOOL
          REQUIRED: false
          LOCATION: query
          DEFAULT: false
      - maxResults:
          TYPE: INT
          REQUIRED: false
          LOCATION: query
          DEFAULT: 100
      - pageToken:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
      - q:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
    RETURNS:
      - RETURNTYPE: STRUCT(ListDraftsResponse)
        RETURNVAR: gmail_user_drafts_get
        STATUS: 200
    CANONICAL_ID: gmail.user.drafts.get
  gmail.user.drafts.create:
    SUMMARY: Creates a draft with the `DRAFT` label
    DESC: Creates a draft with the `DRAFT` label. For more information, see [Create and send draft emails](https://developers.google.com/workspace/gmail/api/guides/drafts).
    HTTP:
      METHOD: POST
      ENDPOINT: /gmail/v1/users/{userId}/drafts
      HEADERS:
        Content-Type: message/cpim
        Authorization: bearer_token
      CONTENT_TYPE: message/cpim
      ACCEPT: application/json
      BODY:
        TYPE: STRUCT(Draft)
    SECURITY:
      - Oauth2:
          type: oauth2
          scopes:
            - https://mail.google.com/
        Oauth2c:
          type: oauth2
          scopes:
            - https://mail.google.com/
      - Oauth2:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/gmail.addons.current.action.compose
        Oauth2c:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/gmail.addons.current.action.compose

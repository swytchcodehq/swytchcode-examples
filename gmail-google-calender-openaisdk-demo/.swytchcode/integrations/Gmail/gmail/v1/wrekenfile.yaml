            - https://www.googleapis.com/auth/gmail.modify
        Oauth2c:
          type: oauth2
          scopes:
            - https://www.googleapis.com/auth/gmail.modify
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - userId:
          TYPE: STRING
          REQUIRED: true
          LOCATION: path
          DEFAULT: me
      - body:
          TYPE: STRUCT(Draft)

      METHOD: GET
      ENDPOINT: /gmail/v1/users/{userId}/history
      HEADERS:
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    SECURITY:
      - Oauth2:
          type: oauth2
          scopes:

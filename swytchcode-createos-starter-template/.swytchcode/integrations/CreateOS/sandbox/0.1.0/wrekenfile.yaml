        Content-Type: application/json
        X-Api-Key: x-api-key
      CONTENT_TYPE: application/json
      ACCEPT: application/json
      BODY:
        TYPE: STRUCT(ResizeReq)
    SECURITY:
      - apiKeyAuth:
          type: apiKey
          in: header
          name: X-Api-Key
      - authTokenAuth:
          type: apiKey
          in: header
          name: X-Auth-Token
      - accessTokenAuth:
          type: apiKey
          in: header
          name: X-Access-Token
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - id:
          TYPE: STRING
          REQUIRED: true
          LOCATION: path
      - body:
          TYPE: STRUCT(ResizeReq)
          REQUIRED: true
          LOCATION: body
          CONTENT_TYPE: application/json
    RETURNS:
      - RETURNTYPE: STRUCT(resizeSandbox_post_v1_sandboxes_id_resize_bb0bb8a6Response200)
        RETURNVAR: fc_spawn_control_plane_resize_create
        STATUS: 200
    ERRORS:
      - TYPE: STRUCT(FailEnvelope)
        STATUS: 400
        WHEN: Validation failure (HTTP 400)
      - TYPE: STRUCT(FailEnvelope)
        STATUS: 404
        WHEN: Resource not found (HTTP 404)
    CANONICAL_ID: fc_spawn_control_plane.resize.create
  fc_spawn_control_plane.resume.create:
    SUMMARY: Restore a paused sandbox
    DESC: |
      Brings a paused sandbox back to `running`. Disk + memory are
      restored exactly; the sandbox gets a fresh IP. Returns 202 with
      the row in `resuming`; poll until status flips to `running`.
      Typical resume completes in <1s if the original host is still
      available, ~10–13s when fetched from storage.

      Retries on a different host if the first attempt fails. If all
      attempts are exhausted the row goes to `error` — POST `/resume`
      against that row to try again with a fresh budget.
    HTTP:
      METHOD: POST
      ENDPOINT: /v1/sandboxes/{id}/resume
      HEADERS:
        Content-Type: application/json
        X-Api-Key: x-api-key
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    SECURITY:
      - apiKeyAuth:
          type: apiKey
          in: header
          name: X-Api-Key
      - authTokenAuth:
          type: apiKey
          in: header
          name: X-Auth-Token
      - accessTokenAuth:
          type: apiKey
          in: header
          name: X-Access-Token
    EXECUTION:
      KIND: http
      MODE: async
    INPUTS:
      - id:
          TYPE: STRING
          REQUIRED: true
          LOCATION: path
    RETURNS:
      - RETURNTYPE: STRUCT(resumeSandbox_post_v1_sandboxes_id_resume_bb0bea05Response202)
        RETURNVAR: fc_spawn_control_plane_resume_create_202
        STATUS: 202
    ERRORS:
      - TYPE: ANY
        STATUS: 409
        WHEN: Sandbox is not paused or in error (HTTP 409)
      - TYPE: ANY
        STATUS: 503
        WHEN: No host with capacity (or bundle not yet uploaded and no cached host) (HTTP 503)
    CANONICAL_ID: fc_spawn_control_plane.resume.create
  fc_spawn_control_plane.shape.list:
    SUMMARY: List the shape catalog
    DESC: Lists the static shape catalog (`s-1vcpu-256mb`, `s-1vcpu-1gb`, etc.).
    HTTP:
      METHOD: GET
      ENDPOINT: /v1/shapes
      HEADERS:
        X-Api-Key: x-api-key
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    SECURITY:
      - apiKeyAuth:
          type: apiKey
          in: header
          name: X-Api-Key
      - authTokenAuth:
          type: apiKey
          in: header
          name: X-Auth-Token
      - accessTokenAuth:
          type: apiKey
          in: header
          name: X-Access-Token
    EXECUTION:
      KIND: http
      MODE: sync
    RETURNS:
      - RETURNTYPE: STRUCT(listShapes_get_v1_shapes_1357d0aeResponse200)
        RETURNVAR: fc_spawn_control_plane_shape_list
        STATUS: 200
    CANONICAL_ID: fc_spawn_control_plane.shape.list
  fc_spawn_control_plane.template.list:
    SUMMARY: List the caller's templates (most-recent first)
    HTTP:
      METHOD: GET
      ENDPOINT: /v1/templates
      HEADERS:
        X-Api-Key: x-api-key
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    SECURITY:
      - apiKeyAuth:
          type: apiKey
          in: header
          name: X-Api-Key
      - authTokenAuth:
          type: apiKey
          in: header
          name: X-Auth-Token
      - accessTokenAuth:
          type: apiKey
          in: header
          name: X-Access-Token
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - limit:
          TYPE: INT
          REQUIRED: false
          LOCATION: query
          DEFAULT: 50
          MAXIMUM: 500
      - offset:
          TYPE: INT
          REQUIRED: false
          LOCATION: query
          DEFAULT: 0
          MINIMUM: 0
    RETURNS:
      - RETURNTYPE: STRUCT(listTemplates_get_v1_templates_a64dccf9Response200)
        RETURNVAR: fc_spawn_control_plane_template_list
        STATUS: 200
    CANONICAL_ID: fc_spawn_control_plane.template.list
  fc_spawn_control_plane.template.create:
    SUMMARY: Submit a Dockerfile to build a custom sandbox image
    DESC: |
      Returns immediately with a `pending` template; build runs
      asynchronously and the row flips to `ready` (or `failed`) when
      done. Poll `GET /v1/templates/{id}` or tail `…/logs` to follow.
      Per-user concurrent build cap defaults to 2 (429 if exceeded).
    HTTP:
      METHOD: POST
      ENDPOINT: /v1/templates
      HEADERS:
        Content-Type: application/json
        X-Api-Key: x-api-key
      CONTENT_TYPE: application/json
      ACCEPT: application/json
      BODY:
        TYPE: STRUCT(TemplateCreateReq)
    SECURITY:
      - apiKeyAuth:
          type: apiKey
          in: header
          name: X-Api-Key
      - authTokenAuth:
          type: apiKey
          in: header
          name: X-Auth-Token
      - accessTokenAuth:
          type: apiKey
          in: header
          name: X-Access-Token
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - body:
          TYPE: STRUCT(TemplateCreateReq)
          REQUIRED: true
          LOCATION: body
          CONTENT_TYPE: application/json
    RETURNS:
      - RETURNTYPE: STRUCT(submitTemplate_post_v1_templates_a64dccf9Response200)
        RETURNVAR: fc_spawn_control_plane_template_create
        STATUS: 200
    ERRORS:
      - TYPE: STRUCT(FailEnvelope)
        STATUS: 400
        WHEN: Validation failure (HTTP 400)
      - TYPE: STRUCT(FailEnvelope)
        STATUS: 429
        WHEN: Validation failure (HTTP 429)
    CANONICAL_ID: fc_spawn_control_plane.template.create
  fc_spawn_control_plane.template.delete:
    SUMMARY: Delete a template
    HTTP:
      METHOD: DELETE
      ENDPOINT: /v1/templates/{id}
      HEADERS:
        X-Api-Key: x-api-key
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    SECURITY:
      - apiKeyAuth:
          type: apiKey
          in: header
          name: X-Api-Key
      - authTokenAuth:
          type: apiKey
          in: header
          name: X-Auth-Token
      - accessTokenAuth:
          type: apiKey
          in: header
          name: X-Access-Token
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - id:
          TYPE: STRING
          REQUIRED: true
          LOCATION: path
    RETURNS:
      - RETURNTYPE: STRUCT(deleteTemplate_delete_v1_templates_id_c3398eedResponse200)
        RETURNVAR: fc_spawn_control_plane_template_delete
        STATUS: 200
    ERRORS:
      - TYPE: STRUCT(FailEnvelope)
        STATUS: 404
        WHEN: Resource not found (HTTP 404)
    CANONICAL_ID: fc_spawn_control_plane.template.delete
  fc_spawn_control_plane.template.get:
    SUMMARY: Get template details (resolves friendly name to latest ready)
    HTTP:
      METHOD: GET
      ENDPOINT: /v1/templates/{id}
      HEADERS:
        X-Api-Key: x-api-key
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    SECURITY:
      - apiKeyAuth:
          type: apiKey
          in: header
          name: X-Api-Key
      - authTokenAuth:
          type: apiKey
          in: header
          name: X-Auth-Token
      - accessTokenAuth:
          type: apiKey
          in: header
          name: X-Access-Token
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - id:
          TYPE: STRING
          REQUIRED: true
          LOCATION: path
      - include:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
          ENUM:
            - dockerfile
    RETURNS:
      - RETURNTYPE: STRUCT(getTemplate_get_v1_templates_id_c3398eedResponse200)
        RETURNVAR: fc_spawn_control_plane_template_get
        STATUS: 200
    ERRORS:
      - TYPE: STRUCT(FailEnvelope)
        STATUS: 404
        WHEN: Resource not found (HTTP 404)
    CANONICAL_ID: fc_spawn_control_plane.template.get
  fc_spawn_control_plane.log.get:
    SUMMARY: Fetch or stream build logs for a template
    DESC: |
      Default (`follow=false`, or omitted) returns the full log so far
      as `text/plain`, one raw line per row. Set `?follow=true` to
      stream `application/x-ndjson`; each newline-delimited line is a
      `TemplateLogLine` JSON object. The stream stays open, tailing new
      rows every 500 ms, until the template reaches a terminal status
      or the client disconnects. Empty for pending templates, partial
      while building.
    HTTP:
      METHOD: GET
      ENDPOINT: /v1/templates/{id}/logs
      HEADERS:
        X-Api-Key: x-api-key
      CONTENT_TYPE: application/json
      ACCEPT: application/x-ndjson
    SECURITY:
      - apiKeyAuth:
          type: apiKey
          in: header
          name: X-Api-Key
      - authTokenAuth:
          type: apiKey
          in: header
          name: X-Auth-Token
      - accessTokenAuth:
          type: apiKey
          in: header
          name: X-Access-Token
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - id:
          TYPE: STRING
          REQUIRED: true
          LOCATION: path
      - follow:
          TYPE: BOOL
          REQUIRED: false
          LOCATION: query
          DEFAULT: false
      - attempt:
          TYPE: INT
          REQUIRED: false
          LOCATION: query
          MINIMUM: 1
      - limit:
          TYPE: INT
          REQUIRED: false
          LOCATION: query
          MINIMUM: 1
    RETURNS:
      - RETURNTYPE: ANY
        RETURNVAR: fc_spawn_control_plane_log_get
        STATUS: 200
    ERRORS:
      - TYPE: STRUCT(FailEnvelope)
        STATUS: 404
        WHEN: Resource not found (HTTP 404)
    CANONICAL_ID: fc_spawn_control_plane.log.get
  fc_spawn_control_plane.whoami.list:
    SUMMARY: Identity introspection + per-user sandbox counts
    DESC: |
      Returns the user_id resolved from the bearer token plus a
      snapshot of how many sandboxes the user has (running / paused /
      other / total). Equivalent in spirit to `aws sts get-caller-identity`
      — useful for SDK callers to confirm credentials before doing real
      work. Counts are observational; no consistency guarantees vs
      creates/destroys mid-call.
    HTTP:
      METHOD: GET
      ENDPOINT: /v1/whoami
      HEADERS:
        X-Api-Key: x-api-key
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    SECURITY:
      - apiKeyAuth:
          type: apiKey
          in: header
          name: X-Api-Key
      - authTokenAuth:
          type: apiKey
          in: header
          name: X-Auth-Token
      - accessTokenAuth:
          type: apiKey
          in: header
          name: X-Access-Token
    EXECUTION:
      KIND: http
      MODE: sync
    RETURNS:
      - RETURNTYPE: STRUCT(whoami_get_v1_whoami_1cb3e1afResponse200)
        RETURNVAR: fc_spawn_control_plane_whoami_list
        STATUS: 200
    CANONICAL_ID: fc_spawn_control_plane.whoami.list
STRUCTS:
  BandwidthView:
    - name: capped
      TYPE: BOOL
      REQUIRED: false
    - name: id
      TYPE: STRING
      REQUIRED: false
    - name: quota_bytes
      TYPE: INT
      REQUIRED: false
      FORMAT: int64
    - name: remaining_bytes
      TYPE: INT
      REQUIRED: false
      FORMAT: int64
    - name: used_bytes
      TYPE: INT
      REQUIRED: false
      FORMAT: int64
  ComputerButtonRequest:
    - name: button
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - left
        - middle
        - right
      DEFAULT: left
  ComputerClickRequest:
    - name: button
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - left
        - middle
        - right
      DEFAULT: left
    - name: count
      TYPE: INT
      REQUIRED: false
      MINIMUM: 1
      MAXIMUM: 10
      DEFAULT: 1
    - name: "true"
      TYPE: INT
      REQUIRED: false
      MINIMUM: 0
      MAXIMUM: 65535
    - name: x
      TYPE: INT
      REQUIRED: false

VERSION: 2.0.2
DEFAULTS:
  x-access-token: <X-ACCESS-TOKEN>
  x-api-key: <X-API-KEY>
  x-auth-token: <X-AUTH-TOKEN>
  w_base_url: https://api.sb.createos.sh
METHODS:
  fc_spawn_control_plane.healthz.list:
    SUMMARY: Liveness probe
    HTTP:
      METHOD: GET
      ENDPOINT: /healthz
      HEADERS: {}
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    SECURITY: []
    EXECUTION:
      KIND: http
      MODE: sync
    RETURNS:
      - RETURNTYPE: STRUCT(getHealthz_get_healthz_14239264Response200)
        RETURNVAR: fc_spawn_control_plane_healthz_list
        STATUS: 200
    CANONICAL_ID: fc_spawn_control_plane.healthz.list
  fc_spawn_control_plane.readyz.list:
    SUMMARY: Readiness probe (DB reachable)
    HTTP:
      METHOD: GET
      ENDPOINT: /readyz
      HEADERS: {}
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    SECURITY: []
    EXECUTION:
      KIND: http
      MODE: sync
    RETURNS:
      - RETURNTYPE: STRUCT(getReadyz_get_readyz_36f771a3Response200)
        RETURNVAR: fc_spawn_control_plane_readyz_list
        STATUS: 200
    ERRORS:
      - TYPE: STRUCT(ErrorEnvelope)
        STATUS: 503
        WHEN: Server-side error (HTTP 503)
    CANONICAL_ID: fc_spawn_control_plane.readyz.list
  fc_spawn_control_plane.disk.list:
    SUMMARY: List the caller's S3 disks
    DESC: |
      Credentials are never returned — only the disk metadata + config.
    HTTP:
      METHOD: GET
      ENDPOINT: /v1/disks
      HEADERS:
        X-Api-Key: x-api-key
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    SECURITY:
      - apiKeyAuth:
          type: apiKey
          in: header
          name: X-Api-Key
      - authTokenAuth:
          type: apiKey
          in: header
          name: X-Auth-Token
      - accessTokenAuth:
          type: apiKey
          in: header
          name: X-Access-Token
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - limit:
          TYPE: INT
          REQUIRED: false
          LOCATION: query
          DEFAULT: 50
          MAXIMUM: 500
      - offset:
          TYPE: INT
          REQUIRED: false
          LOCATION: query
          DEFAULT: 0
          MINIMUM: 0
    RETURNS:
      - RETURNTYPE: STRUCT(listDisks_get_v1_disks_6c229da8Response200)
        RETURNVAR: fc_spawn_control_plane_disk_list
        STATUS: 200
    ERRORS:
      - TYPE: STRUCT(FailEnvelope)
        STATUS: 401
        WHEN: Authentication missing or invalid (HTTP 401)
      - TYPE: ANY
        STATUS: 503
        WHEN: |-
          Disks API not configured — control was started without a
          `--disk-credential-key`.
           (HTTP 503)
    CANONICAL_ID: fc_spawn_control_plane.disk.list
  fc_spawn_control_plane.disk.create:
    SUMMARY: Register an S3 bucket as a disk
    DESC: |
      Server validates the request, runs a 3-second HEAD probe against
      `<endpoint>/<bucket>` to catch typos, then AES-256-GCM encrypts
      the credentials and inserts a `disks` row. Credentials are
      NEVER returned in any response.
    HTTP:
      METHOD: POST
      ENDPOINT: /v1/disks
      HEADERS:
        Content-Type: application/json
        X-Api-Key: x-api-key
      CONTENT_TYPE: application/json
      ACCEPT: application/json
      BODY:
        TYPE: STRUCT(DiskCreateReq)
    SECURITY:
      - apiKeyAuth:
          type: apiKey
          in: header
          name: X-Api-Key
      - authTokenAuth:
          type: apiKey
          in: header
          name: X-Auth-Token
      - accessTokenAuth:
          type: apiKey
          in: header
          name: X-Access-Token
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - body:
          TYPE: STRUCT(DiskCreateReq)
          REQUIRED: true
          LOCATION: body
          CONTENT_TYPE: application/json
    RETURNS:
      - RETURNTYPE: STRUCT(createDisk_post_v1_disks_6c229da8Response200)
        RETURNVAR: fc_spawn_control_plane_disk_create
        STATUS: 200
    ERRORS:
      - TYPE: ANY
        STATUS: 400
        WHEN: |-
          Validation rejection. Common causes: malformed name,
          unsupported `kind`, missing bucket / endpoint / credentials,
          unreachable endpoint (HEAD probe failed), or bucket missing
          (404 from the probe).
           (HTTP 400)
      - TYPE: STRUCT(FailEnvelope)
        STATUS: 401
        WHEN: Authentication missing or invalid (HTTP 401)
      - TYPE: ANY
        STATUS: 409
        WHEN: A disk with this name already exists. (HTTP 409)
      - TYPE: ANY
        STATUS: 503
        WHEN: Disks API not configured. (HTTP 503)
    CANONICAL_ID: fc_spawn_control_plane.disk.create
  fc_spawn_control_plane.disk.delete:
    SUMMARY: Soft-delete a disk
    DESC: |
      Refuses with 409 if the disk is attached to a non-destroyed
      sandbox. Soft-delete only; the bucket contents are never touched.
    HTTP:
      METHOD: DELETE
      ENDPOINT: /v1/disks/{idOrName}
      HEADERS:
        X-Api-Key: x-api-key
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    SECURITY:
      - apiKeyAuth:
          type: apiKey
          in: header
          name: X-Api-Key
      - authTokenAuth:
          type: apiKey
          in: header
          name: X-Auth-Token
      - accessTokenAuth:
          type: apiKey
          in: header
          name: X-Access-Token
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - idOrName:
          TYPE: STRING
          REQUIRED: true
          LOCATION: path
    RETURNS:
      - RETURNTYPE: STRUCT(deleteDisk_delete_v1_disks_idOrName_195a43eResponse200)
        RETURNVAR: fc_spawn_control_plane_disk_delete
        STATUS: 200
    ERRORS:
      - TYPE: STRUCT(FailEnvelope)
        STATUS: 401
        WHEN: Authentication missing or invalid (HTTP 401)
      - TYPE: STRUCT(FailEnvelope)
        STATUS: 404
        WHEN: Resource not found (HTTP 404)
      - TYPE: ANY
        STATUS: 409
        WHEN: |-
          Disk is attached to a running, paused, creating, resuming,
          or other non-terminal sandbox. Destroy the sandboxes (or
          detach the disk live) before deleting.
           (HTTP 409)
      - TYPE: ANY
        STATUS: 503
        WHEN: Disks API not configured. (HTTP 503)
    CANONICAL_ID: fc_spawn_control_plane.disk.delete
  fc_spawn_control_plane.disk.get:
    SUMMARY: Get a disk by id or name
    HTTP:
      METHOD: GET
      ENDPOINT: /v1/disks/{idOrName}
      HEADERS:
        X-Api-Key: x-api-key
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    SECURITY:
      - apiKeyAuth:
          type: apiKey
          in: header
          name: X-Api-Key
      - authTokenAuth:
          type: apiKey
          in: header
          name: X-Auth-Token
      - accessTokenAuth:
          type: apiKey
          in: header
          name: X-Access-Token
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - idOrName:
          TYPE: STRING
          REQUIRED: true
          LOCATION: path
    RETURNS:
      - RETURNTYPE: STRUCT(getDisk_get_v1_disks_idOrName_195a43eResponse200)
        RETURNVAR: fc_spawn_control_plane_disk_get
        STATUS: 200
    ERRORS:
      - TYPE: STRUCT(FailEnvelope)
        STATUS: 401
        WHEN: Authentication missing or invalid (HTTP 401)
      - TYPE: ANY
        STATUS: 404
        WHEN: |-
          Disk not found, or owned by another user (identical body —
          no existence leak across tenants).
           (HTTP 404)
      - TYPE: ANY
        STATUS: 503
        WHEN: Disks API not configured. (HTTP 503)
    CANONICAL_ID: fc_spawn_control_plane.disk.get
  fc_spawn_control_plane.preset.list:
    SUMMARY: List named egress-rule presets
    DESC: |
      Returns the preset tokens accepted in sandbox create and live egress
      update requests. Presets are expanded by control before persistence
      and enforcement; sandbox responses therefore contain concrete rules.
    HTTP:
      METHOD: GET
      ENDPOINT: /v1/egress/presets
      HEADERS:
        X-Api-Key: x-api-key
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    SECURITY:
      - apiKeyAuth:
          type: apiKey
          in: header
          name: X-Api-Key
      - authTokenAuth:
          type: apiKey
          in: header
          name: X-Auth-Token
      - accessTokenAuth:
          type: apiKey
          in: header
          name: X-Access-Token
    EXECUTION:
      KIND: http
      MODE: sync
    RETURNS:
      - RETURNTYPE: STRUCT(listEgressPresets_get_v1_egress_presets_127d00c8Response200)
        RETURNVAR: fc_spawn_control_plane_preset_list
        STATUS: 200
    CANONICAL_ID: fc_spawn_control_plane.preset.list
  fc_spawn_control_plane.host.list:
    SUMMARY: List registered hosts (public view — no tokens, no DB row fields)
    HTTP:
      METHOD: GET
      ENDPOINT: /v1/hosts
      HEADERS:
        X-Api-Key: x-api-key
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    SECURITY:
      - apiKeyAuth:
          type: apiKey
          in: header
          name: X-Api-Key
      - authTokenAuth:
          type: apiKey
          in: header
          name: X-Auth-Token
      - accessTokenAuth:
          type: apiKey
          in: header
          name: X-Access-Token
    EXECUTION:
      KIND: http
      MODE: sync
    RETURNS:
      - RETURNTYPE: STRUCT(listHosts_get_v1_hosts_6c6e4b1bResponse200)
        RETURNVAR: fc_spawn_control_plane_host_list
        STATUS: 200
    CANONICAL_ID: fc_spawn_control_plane.host.list
  fc_spawn_control_plane.network.list:
    SUMMARY: List the caller's networks

  fc_spawn_control_plane.exec.create:
    SUMMARY: Run a command inside the sandbox (buffered or streaming)
    DESC: |
      Two response modes selected by the `stream` query parameter
      (or the `stream` field in the request body):

      **Buffered (default).** Agent runs the cmd to completion and returns
      a JSend envelope with `stdout`, `stderr`, and `exit_code`. Suitable
      for short, well-behaved commands.

      **Streaming (`?stream=true`).** Agent emits one JSON object per
      line over `Content-Type: application/x-ndjson` (HTTP/1.1 chunked).
      Each line is an `ExecStreamEvent` with the same field names as
      the buffered shape — so a single struct parses both worlds. The
      terminal frame carries `exit_code`. Heartbeat lines (`{"hb":true}`)
      are emitted every 5 seconds so a dead client is detected and the
      in-VM command killed within ~5s of disconnect.

      Background processes must detach (redirect stdio + `&`) or
      the exec blocks until they exit.
    HTTP:
      METHOD: POST
      ENDPOINT: /v1/sandboxes/{id}/exec
      HEADERS:
        Content-Type: application/json
        X-Api-Key: x-api-key
      CONTENT_TYPE: application/json
      ACCEPT: application/json
      BODY:
        TYPE: STRUCT(ExecReq)
    SECURITY:
      - apiKeyAuth:
          type: apiKey
          in: header
          name: X-Api-Key
      - authTokenAuth:
          type: apiKey
          in: header
          name: X-Auth-Token
      - accessTokenAuth:
          type: apiKey
          in: header
          name: X-Access-Token
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - id:
          TYPE: STRING
          REQUIRED: true
          LOCATION: path
      - stream:
          TYPE: BOOL
          REQUIRED: false
          LOCATION: query
          DEFAULT: false
      - body:
          TYPE: STRUCT(ExecReq)
          REQUIRED: true
          LOCATION: body
          CONTENT_TYPE: application/json
    RETURNS:
      - RETURNTYPE: STRUCT(execSandbox_post_v1_sandboxes_id_exec_c92308d9Response200)
        RETURNVAR: fc_spawn_control_plane_exec_create
        STATUS: 200
    ERRORS:
      - TYPE: STRUCT(FailEnvelope)
        STATUS: 404
        WHEN: Resource not found (HTTP 404)
    CANONICAL_ID: fc_spawn_control_plane.exec.create

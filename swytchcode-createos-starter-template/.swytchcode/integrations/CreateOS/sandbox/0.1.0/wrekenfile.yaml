        STATUS: 200
    ERRORS:
      - TYPE: STRUCT(FailEnvelope)
        STATUS: 400
        WHEN: Validation failure (HTTP 400)
      - TYPE: STRUCT(FailEnvelope)
        STATUS: 401
        WHEN: Authentication missing or invalid (HTTP 401)
      - TYPE: STRUCT(ErrorEnvelope)
        STATUS: 503
        WHEN: |-
          No host with capacity (scheduler exhausted, or the hinted
          `host_id` can't fit the VM)
           (HTTP 503)
    CANONICAL_ID: fc_spawn_control_plane.sandbox.create

  fc_spawn_control_plane.sandbox.create:
    SUMMARY: Create a sandbox
    DESC: |
      Creates a new sandbox. Typical startup is ~30–100 ms.
      `ssh_pubkeys` is required if you plan to use `createos-cli tunnel`
      or `createos-cli shell`.
    HTTP:
      METHOD: POST
      ENDPOINT: /v1/sandboxes
      HEADERS:
        Content-Type: application/json
        X-Api-Key: x-api-key
      CONTENT_TYPE: application/json
      ACCEPT: application/json
      BODY:
        TYPE: STRUCT(CreateReq)
    SECURITY:
      - apiKeyAuth:
          type: apiKey
          in: header
          name: X-Api-Key
      - authTokenAuth:
          type: apiKey
          in: header
          name: X-Auth-Token
      - accessTokenAuth:
          type: apiKey
          in: header
          name: X-Access-Token
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - body:
          TYPE: STRUCT(CreateReq)
          REQUIRED: true
          LOCATION: body
          CONTENT_TYPE: application/json
    RETURNS:
      - RETURNTYPE: STRUCT(createSandbox_post_v1_sandboxes_b11926f1Response200)

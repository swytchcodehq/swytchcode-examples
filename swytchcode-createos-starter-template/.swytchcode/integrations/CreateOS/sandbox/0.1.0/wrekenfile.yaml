  fc_spawn_control_plane.disk.create1:
    SUMMARY: Live-attach a disk to a running sandbox
    DESC: |
      Adds the disk to the sandbox's MMDS-fed desired set; the agent's
      reconciler mounts it on its next tick (~2 ms detection,
      ~1 second to spin up `s3fs`). Live attach only works on
      sandboxes whose `status` is `running` — other states return 409
      with a hint.
    HTTP:
      METHOD: POST
      ENDPOINT: /v1/sandboxes/{id}/disks
      HEADERS:
        Content-Type: application/json
        X-Api-Key: x-api-key
      CONTENT_TYPE: application/json
      ACCEPT: application/json
      BODY:
        TYPE: STRUCT(DiskAttachment)
    SECURITY:
      - apiKeyAuth:
          type: apiKey
          in: header
          name: X-Api-Key
      - authTokenAuth:
          type: apiKey
          in: header
          name: X-Auth-Token
      - accessTokenAuth:
          type: apiKey
          in: header
          name: X-Access-Token
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - id:
          TYPE: STRING
          REQUIRED: true
          LOCATION: path
      - body:
          TYPE: STRUCT(DiskAttachment)
          REQUIRED: true
          LOCATION: body
          CONTENT_TYPE: application/json
    RETURNS:
      - RETURNTYPE: STRUCT(attachDiskLive_post_v1_sandboxes_id_disks_ed6a0ed2Response200)
        RETURNVAR: fc_spawn_control_plane_disk_create1
        STATUS: 200
    ERRORS:
      - TYPE: ANY
        STATUS: 400
        WHEN: |-
          Validation rejection — empty disk_id, mount_path missing /
          not absolute / contains `..`, or targets a reserved
          filesystem path.
           (HTTP 400)
      - TYPE: STRUCT(FailEnvelope)
        STATUS: 401
        WHEN: Authentication missing or invalid (HTTP 401)
      - TYPE: ANY
        STATUS: 404
        WHEN: |-
          Either the sandbox or the disk isn't owned by the caller
          (identical body — no existence leak).
           (HTTP 404)
      - TYPE: ANY
        STATUS: 409
        WHEN: |-
          Either (a) the sandbox is not in `running` state — live
          attach requires a running VM; paused/creating/destroying
          sandboxes pick up disk changes via the resume / cold-boot
          flow — or (b) another attachment on the same sandbox
          already claims the requested `mount_path` (unique
          constraint on `(sandbox_id, mount_path)`).
           (HTTP 409)
      - TYPE: ANY
        STATUS: 503
        WHEN: Disks API not configured. (HTTP 503)
    CANONICAL_ID: fc_spawn_control_plane.disk.create1
  fc_spawn_control_plane.disk.delete1:
    SUMMARY: Live-detach a disk at a specific mount path (unmount only; bucket untouched)
    DESC: |
      Removes one attachment (keyed by `(disk_id, mount_path)`) from the
      sandbox's desired set. The agent reconciler unmounts the FUSE
      backing on the next tick. **The bucket contents are never touched**
      — this only drops the in-VM mount. A disk mounted at multiple
      paths in one sandbox can be detached one path at a time.
    HTTP:
      METHOD: DELETE
      ENDPOINT: /v1/sandboxes/{id}/disks/{disk_id}
      HEADERS:
        X-Api-Key: x-api-key
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    SECURITY:
      - apiKeyAuth:
          type: apiKey
          in: header
          name: X-Api-Key
      - authTokenAuth:
          type: apiKey
          in: header
          name: X-Auth-Token
      - accessTokenAuth:
          type: apiKey
          in: header
          name: X-Access-Token
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - id:
          TYPE: STRING
          REQUIRED: true
          LOCATION: path
      - disk_id:
          TYPE: STRING
          REQUIRED: true
          LOCATION: path
      - mount_path:
          TYPE: STRING
          REQUIRED: true
          LOCATION: query
    RETURNS:
      - RETURNTYPE: STRUCT(detachDiskLive_delete_v1_sandboxes_id_disks_disk_id_57fca330Response200)
        RETURNVAR: fc_spawn_control_plane_disk_delete1
        STATUS: 200
    ERRORS:
      - TYPE: STRUCT(FailEnvelope)
        STATUS: 401
        WHEN: Authentication missing or invalid (HTTP 401)
      - TYPE: ANY
        STATUS: 404
        WHEN: |-
          The disk isn't attached to this sandbox (or the sandbox /
          disk isn't owned by the caller). Idempotency boundary —
          the first DELETE wins; the second sees nothing to remove.
           (HTTP 404)
    CANONICAL_ID: fc_spawn_control_plane.disk.delete1

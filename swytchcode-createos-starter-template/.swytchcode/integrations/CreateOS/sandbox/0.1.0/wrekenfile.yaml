    RETURNS:
      - RETURNTYPE: STRUCT(createNetwork_post_v1_networks_f12d0ac7Response200)
        RETURNVAR: fc_spawn_control_plane_network_create
        STATUS: 200
    ERRORS:
      - TYPE: STRUCT(FailEnvelope)
        STATUS: 400
        WHEN: Validation failure (HTTP 400)
      - TYPE: STRUCT(FailEnvelope)
        STATUS: 401
        WHEN: Authentication missing or invalid (HTTP 401)
    CANONICAL_ID: fc_spawn_control_plane.network.create
  fc_spawn_control_plane.network.delete:
    SUMMARY: Delete a network (must have no members)
    HTTP:
      METHOD: DELETE
      ENDPOINT: /v1/networks/{id}
      HEADERS:
        X-Api-Key: x-api-key
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    SECURITY:
      - apiKeyAuth:
          type: apiKey
          in: header
          name: X-Api-Key
      - authTokenAuth:
          type: apiKey
          in: header
          name: X-Auth-Token
      - accessTokenAuth:
          type: apiKey
          in: header
          name: X-Access-Token
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - id:
          TYPE: STRING
          REQUIRED: true
          LOCATION: path
    RETURNS:
      - RETURNTYPE: STRUCT(deleteNetwork_delete_v1_networks_id_dcad9d7bResponse200)
        RETURNVAR: fc_spawn_control_plane_network_delete
        STATUS: 200
    ERRORS:
      - TYPE: STRUCT(FailEnvelope)
        STATUS: 401
        WHEN: Authentication missing or invalid (HTTP 401)
      - TYPE: STRUCT(FailEnvelope)
        STATUS: 404
        WHEN: Resource not found (HTTP 404)
      - TYPE: ANY
        STATUS: 409
        WHEN: Network still has active members; detach all sandboxes first (HTTP 409)
    CANONICAL_ID: fc_spawn_control_plane.network.delete
  fc_spawn_control_plane.network.get:

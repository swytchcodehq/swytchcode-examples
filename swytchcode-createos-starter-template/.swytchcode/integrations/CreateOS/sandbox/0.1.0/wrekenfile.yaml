    CANONICAL_ID: fc_spawn_control_plane.sandbox.update
  fc_spawn_control_plane.access_token.delete:
    SUMMARY: Disable the sandbox's delegated token
    DESC: |
      Requires the sandbox owner's normal user credential. Revocation takes
      effect immediately in the home region and propagates asynchronously to

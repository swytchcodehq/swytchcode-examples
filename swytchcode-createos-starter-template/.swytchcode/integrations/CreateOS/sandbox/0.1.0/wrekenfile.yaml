      MAXIMUM: 65535
  ComputerClipboard:
    - name: text
      TYPE: STRING
      REQUIRED: true
      MAX_LENGTH: 1048576
  ComputerCreateScreenRequest:
    - name: height
      TYPE: INT
      REQUIRED: false
      MINIMUM: 240
      MAXIMUM: 2160
      DEFAULT: 800
    - name: width
      TYPE: INT
      REQUIRED: false
      MINIMUM: 320
      MAXIMUM: 3840
      DEFAULT: 1280
  ComputerDragRequest:
    - name: from
      TYPE: STRUCT(ComputerPoint)
      REQUIRED: true
    - name: to
      TYPE: STRUCT(ComputerPoint)
      REQUIRED: true
  ComputerLaunchRequest:
    - name: application
      TYPE: STRING
      REQUIRED: true
      MAX_LENGTH: 256
      EXAMPLE: firefox-esr
    - name: uri
      TYPE: STRING
      REQUIRED: false
      MAX_LENGTH: 4096
      EXAMPLE: https://example.com
  ComputerOpenRequest:
    - name: target
      TYPE: STRING
      REQUIRED: true
      MAX_LENGTH: 4096
      EXAMPLE: https://example.com
  ComputerPoint:
    - name: "true"
      TYPE: INT
      REQUIRED: false
      MINIMUM: 0
      MAXIMUM: 65535
    - name: x
      TYPE: INT
      REQUIRED: true
      MINIMUM: 0
      MAXIMUM: 65535
  ComputerPressRequest:
    - name: keys
      TYPE: "[]STRING"
      REQUIRED: true
      MIN_ITEMS: 1
      MAX_ITEMS: 16
      EXAMPLE:
        - Control_L
        - C
  ComputerScreen:
    - name: display
      TYPE: STRING
      REQUIRED: true
      PATTERN: ^:[0-7]$
      EXAMPLE: ":0"
    - name: height
      TYPE: INT
      REQUIRED: true
      MINIMUM: 240
      MAXIMUM: 2160
    - name: novnc_port
      TYPE: INT
      REQUIRED: true
      MINIMUM: 6080
      MAXIMUM: 6087
    - name: screen_id
      TYPE: STRING
      REQUIRED: true
      PATTERN: ^screen-[0-7]$
      EXAMPLE: screen-0
    - name: vnc_port
      TYPE: INT
      REQUIRED: true
      MINIMUM: 5900
      MAXIMUM: 5907
    - name: width
      TYPE: INT
      REQUIRED: true
      MINIMUM: 320
      MAXIMUM: 3840
  ComputerScreenConnection:
    - name: expires_at
      TYPE: TIMESTAMP
      REQUIRED: true
      FORMAT: date-time
      comment: Time after which this token cannot establish a new websocket session.
    - name: path
      TYPE: STRING
      REQUIRED: true
    - name: port
      TYPE: INT
      REQUIRED: true
      MINIMUM: 6080
      MAXIMUM: 6087
    - name: screen_id
      TYPE: STRING
      REQUIRED: true
      PATTERN: ^screen-[0-7]$
    - name: token
      TYPE: STRING
      REQUIRED: true
      PATTERN: ^[0-9a-f]{64}$
      comment: Single-screen noVNC bearer token. It expires after one hour, and a new connect call invalidates it immediately.
    - name: url
      TYPE: STRING
      REQUIRED: false
      FORMAT: uri
      comment: Public noVNC URL; present when sandbox ingress is enabled.
  ComputerScreenGeometry:
    - name: height
      TYPE: INT
      REQUIRED: true
      MINIMUM: 1
    - name: width
      TYPE: INT
      REQUIRED: true
      MINIMUM: 1
  ComputerScrollRequest:
    - name: amount
      TYPE: INT
      REQUIRED: false
      MINIMUM: 1
      MAXIMUM: 100
      DEFAULT: 1
    - name: direction
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - up
        - down
      DEFAULT: down
  ComputerTypeRequest:
    - name: delay_in_ms
      TYPE: INT
      REQUIRED: false
      MINIMUM: 0
      MAXIMUM: 1000
      DEFAULT: 25
    - name: text
      TYPE: STRING
      REQUIRED: true
      MAX_LENGTH: 65536
  ComputerWindow:
    - name: id
      TYPE: STRING
      REQUIRED: true
      PATTERN: ^[0-9]+$
    - name: title
      TYPE: STRING
      REQUIRED: false
  ComputerWindowGeometry:
    - name: height
      TYPE: INT
      REQUIRED: true
      MINIMUM: 1
    - name: id
      TYPE: STRING
      REQUIRED: true
      PATTERN: ^[0-9]+$
    - name: screen
      TYPE: INT
      REQUIRED: true
      MINIMUM: 0
    - name: "true"
      TYPE: INT
      REQUIRED: false
    - name: width
      TYPE: INT
      REQUIRED: true
      MINIMUM: 1
    - name: x
      TYPE: INT
      REQUIRED: true
  ComputerWindowMoveRequest:
    - name: "true"
      TYPE: INT
      REQUIRED: false
      MINIMUM: 0
      MAXIMUM: 65535
    - name: x
      TYPE: INT
      REQUIRED: true
      MINIMUM: 0
      MAXIMUM: 65535
  ComputerWindowResizeRequest:
    - name: height
      TYPE: INT
      REQUIRED: true
      MINIMUM: 1
      MAXIMUM: 2160
    - name: width
      TYPE: INT
      REQUIRED: true
      MINIMUM: 1
      MAXIMUM: 3840
  CreateReq:
    - name: auto_pause_after_seconds
      TYPE: INT
      REQUIRED: false
      MINIMUM: 60
      MAXIMUM: 86400
      NULLABLE: true
      EXAMPLE: 600
      comment: |
        Automatically pause the sandbox after this many seconds with
        no activity (no exec, file transfer, or tunnel). Null / omitted
        means the sandbox runs until you stop it manually.
        Valid range: 60–86400 (1 minute to 24 hours).
    - name: bandwidth_quota_bytes
      TYPE: INT
      REQUIRED: false
      FORMAT: int64
      comment: |
        **Not settable at create.** Every sandbox starts with the
        cluster default (50 GiB by default; configurable per cluster
        via the control plane). Any non-zero value sent here is
        rejected with 400. To grow the budget after create, call
        `POST /v1/sandboxes/{id}/bandwidth/recharge`.
    - name: disk_mib
      TYPE: INT
      REQUIRED: false
      FORMAT: int64
      EXAMPLE: 10240
      comment: Disk size in MiB. 0 = shape default (10 GiB).
    - name: disks
      TYPE: "[]STRUCT(DiskAttachment)"
      REQUIRED: false
      EXAMPLE:
        - disk_id: my-data
          mount_path: /mnt/data
      comment: |
        S3 disks to mount at create time. Each entry references a
        disk the caller has previously registered via `POST /v1/disks`
        and assigns it an absolute mount path inside the guest. The
        disk's credentials are decrypted server-side and pushed into
        MMDS so the guest agent's reconciler runs `s3fs` for each
        entry. Live attach + detach is available post-create via
        `POST /v1/sandboxes/{id}/disks` and the matching DELETE.
    - name: egress
      TYPE: "[]STRING"
      REQUIRED: false
      EXAMPLE:
        - "@pypi"
        - github.com
        - 1.1.1.1:53
      comment: |
        Allowlist entries. Each is `host[:port]`, `ip[:port]`,
        `cidr[:port]`, a named preset such as `@pypi`, or `*`.
        Missing / empty / `["*"]` = allow all. Presets expand to
        concrete rules before the sandbox is created.
        Domain entries (`pypi.org`) require the proxy to be running
        on the host; IP/CIDR entries are kernel-enforced.
    - name: envs
      TYPE: map[STRING]STRING
      REQUIRED: false
      EXAMPLE:
        ANTHROPIC_API_KEY: sk-ant-...
      comment: |
        Environment variables exported into every `exec` invocation
        inside the sandbox. Keys must match POSIX env-name regex
        ^[A-Za-z_][A-Za-z0-9_]*$. Up to 64 entries; each value up to
        4 KiB; total payload up to 64 KiB.
    - name: host_id
      TYPE: STRING
      REQUIRED: false
      comment: |
        Optional — pin to a specific host by id. Empty = scheduler
        picks. 503 if the named host can't fit the VM; never silent
        fallback.
    - name: ingress_enabled
      TYPE: BOOL
      REQUIRED: false
      comment: |
        When true, the sandbox is reachable at
        `<ulid>-<port>.<domain>`. Off by default — opt-in.
        Flippable via PATCH later. Requires no SSH key.
    - name: name
      TYPE: STRING
      REQUIRED: false
      EXAMPLE: brave-otter
      comment: |
        User-facing VM name, unique per user among non-terminal
        sandboxes. Empty/omitted → control auto-generates a
        Docker-style `<adjective>-<animal>` name. The sandbox id stays
        the only addressing handle; name is purely a label / hostname /
        in-network DNS name.
    - name: networks
      TYPE: "[]STRUCT(NetworkEntry)"
      REQUIRED: false
      comment: |
        Private networks to join at create time. Each entry is
        `{id: "<name|net-ulid>"}`. Inside the network, peers reach
        this sandbox by its name.
    - name: region
      TYPE: STRING
      REQUIRED: false
      EXAMPLE: eu
      comment: |
        Optional — placement region. When omitted, the server defaults
        to its own configured region. When set, must equal this control
        plane's region; mismatched values get rejected with HTTP 400
        (no cross-region routing).
    - name: rootfs
      TYPE: STRING
      REQUIRED: false
      EXAMPLE: devbox:1
      comment: |
        Rootfs catalog name. Empty = host default (see `GET /v1/rootfs`).
        Names marked `disabled=true` in `rootfs_catalog` are rejected
        with HTTP 400 and a `rootfs` field error pointing at the
        recommended successor when one is set.
    - name: shape
      TYPE: STRING
      REQUIRED: true
      EXAMPLE: s-1vcpu-256mb
      comment: Required; see `GET /v1/shapes`.
    - name: ssh_pubkeys
      TYPE: "[]STRING"
      REQUIRED: false
      comment: |
        OpenSSH-formatted public keys authorized to connect via the
        SSH gateway for port-forwarding. Without at least one key
        here, `createos-cli tunnel` / `createos-cli shell` will be rejected.
  CreateResp:
    - name: bandwidth_quota_bytes
      TYPE: INT
      REQUIRED: false
      FORMAT: int64
    - name: disk_mib
      TYPE: INT
      REQUIRED: false
      FORMAT: int64
    - name: egress
      TYPE: "[]STRING"
      REQUIRED: false
    - name: id
      TYPE: STRING
      REQUIRED: false
      EXAMPLE: sb_01K…
    - name: ip
      TYPE: STRING
      REQUIRED: false
      EXAMPLE: 192.168.0.12
    - name: mem_mib
      TYPE: INT
      REQUIRED: false
    - name: name
      TYPE: STRING
      REQUIRED: false
      EXAMPLE: brave-otter
    - name: rootfs
      TYPE: STRING
      REQUIRED: false
    - name: shape
      TYPE: STRING
      REQUIRED: false
    - name: spawn_ms
      TYPE: FLOAT
      REQUIRED: false
      FORMAT: double
    - name: status
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - running
    - name: vcpu
      TYPE: INT
      REQUIRED: false
  DestroyedResp:
    - name: id
      TYPE: STRING
      REQUIRED: false
      comment: the sandbox id
    - name: status
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - destroying
        - destroyed
  DiskAttachment:
    - name: disk_id
      TYPE: STRING
      REQUIRED: true
      EXAMPLE: my-data
      comment: Either a `disk_<ulid>` id or a user-scoped name.
    - name: mount_path
      TYPE: STRING
      REQUIRED: true
      EXAMPLE: /mnt/data
      comment: |
        Absolute path inside the guest. Must start with `/`, must
        not contain `..`, must not target a reserved system path
        (`/`, `/etc`, `/proc`, `/sys`, `/dev`, ...). At most one
        attachment per sandbox may claim a given `mount_path` —
        collisions with a *different* disk return 409 on live
        attach, 400 on create-time. Re-attaching the *same* disk
        at the same path is idempotent.
    - name: sub_path
      TYPE: STRING
      REQUIRED: false
      EXAMPLE: team-a/
      comment: |
        Optional prefix inside the bucket. When non-empty, the guest
        mounts `<bucket>:/<sub_path>` (s3fs `compat_dir` is enabled
        so the synthetic directory works without a placeholder
        object). Leading / trailing slashes are normalised; `..` is
        rejected. Default empty = mount the bucket root.

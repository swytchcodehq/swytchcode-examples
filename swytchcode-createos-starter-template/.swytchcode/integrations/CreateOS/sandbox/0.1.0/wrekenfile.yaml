  fc_spawn_control_plane.network.create:
    SUMMARY: Create a network
    HTTP:
      METHOD: POST
      ENDPOINT: /v1/networks
      HEADERS:
        Content-Type: application/json
        X-Api-Key: x-api-key
      CONTENT_TYPE: application/json

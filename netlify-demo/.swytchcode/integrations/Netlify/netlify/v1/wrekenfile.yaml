STRUCTS:
  createDatabaseRequest:
    - name: region
      type: STRING
      REQUIRED: false
      comment: The region where the database should be created. Defaults to the site's functions region if not specified.
  databaseResponse:
    - name: connection_string
      type: STRING
      REQUIRED: false
      comment: The connection string for the database
  createDatabaseBranchRequest:
    - name: parent_branch_id
      type: STRING
      REQUIRED: false
      comment: The ID of the parent branch to create the new branch from. Defaults to the production branch if not specified.
    - name: branch_id
      type: STRING
      REQUIRED: true
      comment: The branch identifier
    - name: metadata
      type: map[STRING]ANY
      REQUIRED: false
      comment: Arbitrary metadata to associate with the branch
  databaseBranchResponse:
    - name: connection_string
      type: STRING
      REQUIRED: false
      comment: The connection string for the database branch
    - name: metadata
      type: map[STRING]ANY
      REQUIRED: false
      comment: Metadata associated with the branch
  databaseBranchesResponse:
    - name: branches
      type: "[]STRUCT(databaseBranchDetail)"
      REQUIRED: false
      comment: List of database branches
  databaseBranchDetail:
    - name: branch_id
      type: STRING
      REQUIRED: false
      comment: The branch identifier
    - name: name
      type: STRING
      REQUIRED: false
      comment: The branch name
    - name: connection_string
      type: STRING
      REQUIRED: false
      comment: The connection string for the branch
    - name: state
      type: STRING
      REQUIRED: false
      comment: The current state of the branch
    - name: logical_size_bytes
      type: INT
      REQUIRED: false
      comment: The logical size of the branch in bytes
    - name: created_at
      type: STRING
      REQUIRED: false
      comment: When the branch was created
    - name: updated_at
      type: STRING
      REQUIRED: false
      comment: When the branch was last updated
    - name: last_active_at
      type: STRING
      REQUIRED: false
      comment: When the branch was last active
    - name: compute
      type: STRUCT(databaseBranchCompute)
      REQUIRED: false
    - name: metadata
      type: map[STRING]ANY
      REQUIRED: false
      comment: Metadata associated with the branch
  databaseBranchCompute:
    - name: current_state
      type: STRING
      REQUIRED: false
      comment: The current state of the compute endpoint
    - name: autoscaling_limit_min_cu
      type: FLOAT
      REQUIRED: false
      comment: Minimum compute units for autoscaling
    - name: autoscaling_limit_max_cu
      type: FLOAT
      REQUIRED: false
      comment: Maximum compute units for autoscaling
    - name: suspend_timeout_seconds
      type: INT
      REQUIRED: false
      comment: Seconds of inactivity before the compute endpoint is suspended
    - name: last_active
      type: STRING
      REQUIRED: false
      comment: When the compute endpoint was last active
  createDatabaseSnapshotRequest:
    - name: branch_id
      type: STRING
      REQUIRED: false
      comment: The ID of the branch to snapshot. Defaults to "production" if not specified.
    - name: name
      type: STRING
      REQUIRED: false
      comment: A name for the snapshot
    - name: metadata
      type: STRUCT(databaseSnapshotMetadata)
      REQUIRED: false
  databaseSnapshotMetadata:
    - name: deploy
      type: map[STRING]ANY
      REQUIRED: false
      comment: Deploy information associated with the snapshot
    - name: source
      type: STRING
      REQUIRED: false
      comment: The source that created the snapshot
  databaseSnapshot:
    - name: id
      type: STRING
      REQUIRED: false
      comment: The unique identifier of the snapshot
    - name: source_branch_id
      type: STRING
      REQUIRED: false
      comment: The ID of the branch that was snapshotted
    - name: manual
      type: BOOL
      REQUIRED: false
      comment: Whether this snapshot was manually created
    - name: created_at
      type: STRING
      REQUIRED: false
      comment: When the snapshot was created
    - name: expires_at
      type: STRING
      REQUIRED: false
      comment: When the snapshot expires
    - name: timestamp
      type: STRING
      REQUIRED: false
      comment: The point-in-time timestamp of the snapshot
    - name: metadata
      type: STRUCT(databaseSnapshotMetadata)
      REQUIRED: false
  databaseSnapshotsResponse:
    - name: snapshots
      type: "[]STRUCT(databaseSnapshot)"
      REQUIRED: false
      comment: List of database snapshots
  restoreDatabaseSnapshotRequest:
    - name: branch_id
      type: STRING
      REQUIRED: false
      comment: The ID of the branch to restore the snapshot to. Defaults to "production" if not specified.
  databaseComputeSettingsRequest:
    - name: min_cu
      type: FLOAT
      REQUIRED: false
      comment: Minimum compute units (0.25 to 16.0). Must be less than or equal to max_cu.
    - name: max_cu
      type: FLOAT
      REQUIRED: false
      comment: Maximum compute units (0.25 to 16.0). Must be greater than or equal to min_cu. max_cu - min_cu must not exceed 8.0.
    - name: sleep_timeout_seconds
      type: INT
      REQUIRED: false
      comment: Seconds of inactivity before the compute endpoint is suspended. Use -1 for always on, or a non-negative value.
  databaseComputeSettings:
    - name: min_cu
      type: FLOAT
      REQUIRED: false
      comment: Minimum compute units
    - name: max_cu
      type: FLOAT
      REQUIRED: false
      comment: Maximum compute units
    - name: sleep_timeout_seconds
      type: INT
      REQUIRED: false
      comment: Seconds of inactivity before suspension
  runDatabaseMigrationsRequest:
    - name: dry_run
      type: BOOL
      REQUIRED: false
      comment: If true, validates migrations without applying them.
  resetDatabaseBranchRequest:
    - name: source_branch_id
      type: STRING
      REQUIRED: false
      comment: The ID of the branch to re-fork the target branch from. Defaults to "production" if not specified.
  resetDatabaseBranchResponse:
    - name: reset
      type: BOOL
      REQUIRED: false
      comment: Whether the branch was actually re-forked. False when the target was already in sync with the source and `force=true` was not set.
    - name: connection_string
      type: STRING
      REQUIRED: false
      comment: The connection string for the reset (or unchanged) branch
    - name: metadata
      type: map[STRING]ANY
      REQUIRED: false
      comment: Metadata associated with the branch
  listDatabaseMigrationsResponse:
    - name: migrations
      type: "[]STRUCT(databaseMigration)"
      REQUIRED: false
      comment: List of migrations
  databaseMigration:
    - name: version
      type: INT
      REQUIRED: false
      comment: The migration version number
    - name: name
      type: STRING
      REQUIRED: false
      comment: The migration name
    - name: path
      type: STRING
      REQUIRED: false
      comment: The path to the migration file in the deploy bundle
    - name: applied
      type: BOOL
      REQUIRED: false
      comment: Whether this migration has been applied to the branch
  databaseMigrationDetail:
    - name: version
      type: INT
      REQUIRED: false
      comment: The migration version number
    - name: name
      type: STRING
      REQUIRED: false
      comment: The migration name
    - name: path
      type: STRING
      REQUIRED: false
      comment: The path to the migration file in the deploy bundle
    - name: content
      type: STRING
      REQUIRED: false
      comment: The raw contents of the migration file
  DeployValidationsReport:
    - name: id
      type: STRING
      REQUIRED: false
      comment: The id of the deploy validations report
    - name: deploy_id
      type: STRING
      REQUIRED: false
      comment: The id of the deploy
    - name: secret_scan_result

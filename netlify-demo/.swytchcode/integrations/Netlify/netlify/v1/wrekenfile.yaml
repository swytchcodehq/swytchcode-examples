  netlify.site.builds.create:
    SUMMARY: Runs a build for a site
    DESC: |
      Runs a build for a site. The build will be scheduled to run at the first opportunity, but it might not start immediately if insufficient account build capacity is available.

      Files for build can be uploaded as a zipped site using one of these methods:
      1. Set Content-Type to 'application/zip' and send the zip file as the raw request body
      2. Set Content-Type to 'multipart/form-data' and include the zip file in the 'zip' field
    HTTP:
      METHOD: POST
      ENDPOINT: /sites/{site_id}/builds
      HEADERS:
        Content-Type: multipart/form-data
        Authorization: bearer_token
      CONTENT_TYPE: multipart/form-data
      ACCEPT: application/json
      BODYTYPE: form-data
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - site_id:
          TYPE: STRING
          LOCATION: path
      - branch:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
      - clear_cache:
          TYPE: BOOL
          REQUIRED: false
          LOCATION: query
      - image:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
      - template_id:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
      - title:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
      - zip:
          TYPE: STRING
          REQUIRED: false
          LOCATION: body
    RETURNS:
      - RETURNTYPE: STRUCT(build)
        RETURNVAR: netlify_site_builds_create
        STATUS: 200
    ERRORS:
      - TYPE: ANY
        STATUS: 400
        WHEN: Bad Request (HTTP 400)
      - TYPE: ANY
        STATUS: 404
        WHEN: Not Found (HTTP 404)
      - TYPE: ANY
        STATUS: 422
        WHEN: Unprocessable Entity (HTTP 422)
      - TYPE: STRUCT(error)
        STATUS: 500
        WHEN: error (HTTP default)
    CANONICAL_ID: netlify.site.builds.create

  netlify.site.list:
    SUMMARY: "**Note:** Environment variable keys and values have moved from `build_settings.env` and `repo.env` to a new endpoint"
    DESC: "**Note:** Environment variable keys and values have moved from `build_settings.env` and `repo.env` to a new endpoint. Please use [getEnvVars](#tag/environmentVariables/operation/getEnvVars) to retrieve site environment variables."
    HTTP:
      METHOD: GET
      ENDPOINT: /sites
      HEADERS:
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - name:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
      - filter:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
      - page:
          TYPE: INT
          REQUIRED: false
          LOCATION: query
      - per_page:
          TYPE: INT
          REQUIRED: false
          LOCATION: query
    RETURNS:
      - RETURNTYPE: "[]STRUCT(site)"
        RETURNVAR: netlify_site_list

    SUMMARY: Restores a snapshot to a database branch
    DESC: Restores a snapshot to a database branch. Defaults to the production branch if no branch_name is specified.
    HTTP:
      METHOD: POST
      ENDPOINT: /sites/{site_id}/database/snapshot/{snapshot_id}/restore
      HEADERS:
        Content-Type: application/json
        Authorization: bearer_token

  netlify.site.ssl.create:
    SUMMARY: Provisions or updates a TLS certificate for the site
    DESC: |-
      Provisions or updates a TLS certificate for the site.

      **Creating a certificate (site has no certificate):**
      - Omit certificate params to initiate Let's Encrypt provisioning
      - Provide certificate, key, and ca_certificates to upload a custom certificate

      **Updating a certificate (site already has a certificate):**
      - REQUIRES certificate, key, and ca_certificates to replace with a new custom certificate
      - Use POST /api/v1/sites/{site_id}/ssl/renew to renew an existing Let's Encrypt certificate
    HTTP:
      METHOD: POST
      ENDPOINT: /sites/{site_id}/ssl
      HEADERS:
        Content-Type: application/json
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - site_id:
          TYPE: STRING
          LOCATION: path
      - certificate:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
      - key:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
      - ca_certificates:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
    RETURNS:
      - RETURNTYPE: STRUCT(sniCertificate)
        RETURNVAR: netlify_site_ssl_create
        STATUS: 200
    ERRORS:
      - TYPE: ANY
        STATUS: 422
        WHEN: "Unprocessable Entity. Returns errors such as: \"certificate parameter is required when updating an existing certificate\" (when updating without params), \"No custom domain configured\", or \"bad dns for custom domain\" (HTTP 422)"
      - TYPE: STRUCT(error)
        STATUS: 500
        WHEN: error (HTTP default)
    CANONICAL_ID: netlify.site.ssl.create
  netlify.site.ssl.get:
    SUMMARY: Perform operation showSiteTLSCertificate
    HTTP:
      METHOD: GET
      ENDPOINT: /sites/{site_id}/ssl
      HEADERS:
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    EXECUTION:

    ERRORS:
      - TYPE: ANY
        STATUS: 404
        WHEN: Account not found (HTTP 404)
    CANONICAL_ID: zoom.account.settings.get
  zoom.account.settings.update:
    SUMMARY: Update a sub account's settings
    DESC: Update a sub account's settings under the master account
    HTTP:
      METHOD: PATCH
      ENDPOINT: /accounts/{accountId}/settings

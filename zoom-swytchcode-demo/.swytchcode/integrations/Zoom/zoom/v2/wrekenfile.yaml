STRUCTS:
  Account:
    - name: first_name
      type: STRING
      REQUIRED: true
      comment: User's first name
    - name: last_name
      type: STRING
      REQUIRED: true
      comment: User's last name
    - name: email
      type: STRING
      REQUIRED: true
      comment: User's email address
    - name: password
      type: STRING
      REQUIRED: true
      comment: User's password
    - name: options
      type: STRUCT(AccountOptions)
      REQUIRED: false
  AccountOptions:
    - name: share_rc
      type: BOOL
      REQUIRED: false
      comment: Enable Share Virtual Room Connector
    - name: room_connectors
      type: STRING
      REQUIRED: false
      comment: Virtual Room Connector, multiple value separated by comma
    - name: share_mc
      type: BOOL
      REQUIRED: false
      comment: Enable Share Meeting Connector
    - name: meeting_connectors
      type: STRING
      REQUIRED: false
      comment: Meeting Connector, multiple values separated by comma
    - name: pay_mode
      type: STRING
      REQUIRED: false
      comment: Payee
  AccountPlan:
    - name: type
      type: STRING
      REQUIRED: false
      comment: Account <a href="#plans">plan type</a>
    - name: hosts
      type: INT
      REQUIRED: false
      comment: Account plan number of hosts
  AccountPlanBaseRequired:
    - name: type
      type: STRING
      REQUIRED: true
      comment: Account base <a href="#plans">plan type</a>
    - name: hosts
      type: INT
      REQUIRED: true
      comment: Account base plan number of hosts. For a Pro Plan, please select a value between 1 and 9. For a Business Plan, please select a value between 10 and 49. For a Education Plan, please select a value between 20 and 149. For a Free Trial Plan, please select a value between 1 and 9999.
  AccountPlanRequired:
    - name: type
      type: STRING
      REQUIRED: true
      comment: Account <a href="#plans">plan type</a>
    - name: hosts
      type: INT
      REQUIRED: true
      comment: Account plan number of hosts
  AccountPlans:
    - name: plan_base
      type: STRUCT(AccountPlanBaseRequired)
      REQUIRED: false
    - name: plan_zoom_rooms
      type: STRUCT(AccountPlan)
      REQUIRED: false
    - name: plan_room_connector
      type: STRUCT(AccountPlan)
      REQUIRED: false
    - name: plan_large_meeting
      type: "[]STRUCT(AccountPlan)"
      REQUIRED: false
      comment: Additional Large Meeting Plans
    - name: plan_webinar
      type: "[]STRUCT(AccountPlan)"
      REQUIRED: false
      comment: Additional Webinar Plans
    - name: plan_recording
      type: STRING
      REQUIRED: false
      comment: Additional Cloud Recording Plan
    - name: plan_audio
      type: OBJECT
      REQUIRED: false
      comment: Additional Audio Conferencing <a href="#plans">plan type</a>
  AccountSettings:
    - name: schedule_meting
      type: STRUCT(AccountSettingsScheduleMeeting)
      REQUIRED: false
    - name: in_meeting
      type: STRUCT(AccountSettingsInMeeting)
      REQUIRED: false
    - name: email_notification
      type: STRUCT(AccountSettingsEmailNotification)
      REQUIRED: false
    - name: zoom_rooms
      type: STRUCT(AccountSettingsZoomRooms)
      REQUIRED: false
    - name: security
      type: STRUCT(AccountSettingsSecurity)
      REQUIRED: false
    - name: recording
      type: STRUCT(AccountSettingsRecording)
      REQUIRED: false
    - name: telephony
      type: STRUCT(AccountSettingsTelephony)
      REQUIRED: false
    - name: integration
      type: STRUCT(AccountSettingsIntegration)
      REQUIRED: false
    - name: feature
      type: STRUCT(AccountSettingsFeature)
      REQUIRED: false
  AccountSettingsScheduleMeeting:
    - name: host_video
      type: BOOL
      REQUIRED: false
      comment: Start meetings with host video on
    - name: participant_video
      type: BOOL
      REQUIRED: false
      comment: Start meetings with participant video on. Participants can change this during the meeting.
    - name: audio_type
      type: STRING
      REQUIRED: false
      comment: Determine how participants can join the audio portion of the meeting
    - name: join_before_host
      type: BOOL
      REQUIRED: false
      comment: Allow participants to join the meeting before the host arrives
    - name: enforce_login
      type: BOOL
      REQUIRED: false
      comment: Only signed-in (Zoom users) users can join meetings
    - name: enforce_login_with_domains
      type: BOOL
      REQUIRED: false
      comment: Only signed-in users with a specific domain can join meetings
    - name: enforce_login_domains
      type: STRING
      REQUIRED: false
      comment: Only signed-in users with a specified domains
    - name: not_store_meeting_topic
      type: BOOL
      REQUIRED: false
      comment: Always display "Zoom Meeting" as the meeting topic
    - name: force_pmi_jbh_password
      type: BOOL
      REQUIRED: false
      comment: Require a password for Personal Meetings if attendees can join before host
  AccountSettingsInMeeting:
    - name: e2e_encryption
      type: BOOL
      REQUIRED: false
      comment: Require that all meetings are encrypted using AES
    - name: chat
      type: BOOL
      REQUIRED: false
      comment: Allow meeting participants to send a message visible to all participants
    - name: private_chat
      type: BOOL
      REQUIRED: false
      comment: Allow meeting participants to send a private 1:1 message to another participants
    - name: auto_saving_chat
      type: BOOL
      REQUIRED: false
      comment: Automatically save all in-meeting chats so that hosts do not need to manually save the text of the chat after the meeting starts
    - name: file_transfer
      type: BOOL
      REQUIRED: false
      comment: Hosts and participants can send files through the in-meeting chat
    - name: feedback
      type: BOOL
      REQUIRED: false
      comment: Add a Feedback tab to the Windows Settings or Mac Preferences dialog, and also enable users to provide feedback to Zoom at the end of the meeting
    - name: post_meeting_feedback
      type: BOOL
      REQUIRED: false
      comment: Display a thumbs up/down survey at the end of each meeting
    - name: co_host
      type: BOOL
      REQUIRED: false
      comment: Allow the host to add co-hosts
    - name: polling
      type: BOOL
      REQUIRED: false
      comment: Add 'Polls' to the meeting controls.
    - name: attendee_on_hold
      type: BOOL
      REQUIRED: false
      comment: Allow hosts to temporarily remove an attendee from the meeting
    - name: show_meeting_control_toolbar
      type: BOOL
      REQUIRED: false
      comment: Always show meeting control toolbar
    - name: allow_show_zoom_windows
      type: BOOL
      REQUIRED: false
      comment: Show Zoom Desktop application when sharing screen
    - name: annotation
      type: BOOL
      REQUIRED: false
      comment: Allow participants to use annotation tools to add information to shared screens
    - name: whiteboard
      type: BOOL
      REQUIRED: false
      comment: Allow participants to share a whiteboard that includes annotation tools
    - name: webinar_question_answer
      type: BOOL
      REQUIRED: false
      comment: Q&A in webinar
    - name: anonymous_question_answer
      type: BOOL
      REQUIRED: false
      comment: Allow Anonymous Q&A in Webinar
    - name: breakout_room
      type: BOOL
      REQUIRED: false
      comment: Allow host to split meeting participants into separate, smaller rooms
    - name: closed_caption
      type: BOOL
      REQUIRED: false
      comment: Allow host to type closed captions or assign a participant/third party device to add closed captions
    - name: far_end_camera_control
      type: BOOL
      REQUIRED: false
      comment: Allow another user to take control of your camera during a meeting
    - name: group_hd
      type: BOOL
      REQUIRED: false
      comment: Activate higher quality video for host and participants. (This will use more bandwidth.)
    - name: virtual_background
      type: BOOL
      REQUIRED: false
      comment: Allow users to replace their background with any selected image. Choose or upload an image in the Zoom Desktop application settings.
    - name: watermark
      type: BOOL
      REQUIRED: false
      comment: Add watermark when viewing shared screen
    - name: alert_guest_join
      type: BOOL
      REQUIRED: false
      comment: Identify guest participants in the meeting/webinar
    - name: auto_answer
      type: BOOL
      REQUIRED: false
      comment: Enable users to see and add contacts to 'auto-answer group' in the contact list on chat. Any call from members of this group will be automatically answered.
    - name: p2p_connetion
      type: BOOL
      REQUIRED: false
      comment: Peer to Peer connection while only 2 people are in a meeting
    - name: p2p_ports
      type: BOOL
      REQUIRED: false
      comment: P2P listening ports range
    - name: ports_range
      type: STRING
      REQUIRED: false
      comment: Listening ports range, separated by comma (ex 55,56). The ports range must be between 1 to 65535.
    - name: sending_default_email_invites
      type: BOOL
      REQUIRED: false
      comment: Only show default email when sending email invites
    - name: use_html_format_email
      type: BOOL
      REQUIRED: false
      comment: Use HTML format email for Outlook plugin
    - name: dscp_marking
      type: BOOL
      REQUIRED: false
      comment: DSCP marking
    - name: dscp_audio
